ts(1);\n    document.getElementById('btn-hint-1').onclick = () => giveHint(1);\n\n    // Physical Keyboard Typing Support for 4-Pics\n    window.addEventListener('keydown', (e) => {\n      if (currentItemIdx > 1) return; // Only for 4-pic questions\n      const char = e.key.toUpperCase();\n      if (/^[A-Z]$/.test(char) && char.length === 1) {\n        const data = quizItems[currentItemIdx];\n        // Find if this character is available in current bank\n        for (let i = 0; i < data.tiles.length; i++) {\n          if (data.tiles[i] === char && !usedBankTiles[currentItemIdx][i]) {\n            placeLetter(currentItemIdx, i, char);\n            break;\n          }\n        }\n      } else if (e.key === 'Backspace') {\n        backspace(currentItemIdx);\n      }\n    });\n\n    // ==========================================\n    // MATRIX RED VS BLUE PILL LOGIC (Items 2 and 3)\n    // ==========================================\n    let pillLocked = [false, false];\n\n    function selectPill(itemIdx, chosenColor) {\n      const lockIdx = itemIdx - 2;\n      if (pillLocked[lockIdx]) return;\n      pillLocked[lockIdx] = true;\n\n      soundPillSwallow();\n      const data = quizItems[itemIdx];\n      const isCorrect = chosenColor === data.correctPill;\n\n      const redCard = document.getElementById(`pill-${itemIdx}-red`);\n      const blueCard = document.getElementById(`pill-${itemIdx}-blue`);\n      const feedback = document.getElementById(`feedback-${itemIdx}`);\n\n      // Neutral active selection highlight (DO NOT reveal right/wrong!)\n      if (chosenColor === 'red') {\n        redCard.style.borderColor = '#38bdf8';\n        redCard.style.boxShadow = '0 0 25px rgba(56, 189, 248, 0.45)';\n        blueCard.style.opacity = '0.5';\n      } else {\n        blueCard.style.borderColor = '#38bdf8';\n        blueCard.style.boxShadow = '0 0 25px rgba(56, 189, 248, 0.45)';\n        redCard.style.opacity = '0.5';\n      }\n\n      // Record score silently\n      if (isCorrect) {\n        streak++;\n        score += 100 + (streak * 10);\n      } else {\n        streak = 0;\n      }\n      updateHUD();\n\n      // Show neutral next button without showing correct/incorrect answer!\n      feedback.className = 'rounded-xl p-3 sm:p-4 text-center transition-all bg-slate-900/90 border border-sky-500/30';\n      feedback.innerHTML = `\n        <div class=\"flex items-center justify-between flex-wrap gap-2\">\n          <span class=\"text-xs sm:text-sm font-semibold text-sky-300\">\n            Selection recorded: <b class=\"text-white uppercase\">${chosenColor} Pill</b>\n          </span>\n          <button onclick=\"advanceNextItem()\" class=\"px-5 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-xs sm:text-sm shadow-lg shadow-sky-500/25 transition-all hover:scale-105\">\n            ${itemIdx === 3 ? 'Finish Quiz & View Score 🏆' : 'Next Question →'}\n          </button>\n        </div>\n      `;\n      feedback.classList.remove('hidden');\n    }\n\n    // ==========================================\n    // STEP NAVIGATION & COMPLETION\n    // ==========================================\n    function advanceNextItem() {\n      document.getElementById('item-' + currentItemIdx).classList.add('hidden');\n      currentItemIdx++;\n\n      if (currentItemIdx < 4) {\n        document.getElementById('item-' + currentItemIdx).classList.remove('hidden');\n        if (currentItemIdx === 1) render4PicItem(1);\n        updateHUD();\n      } else {\n        // SHOW RESULTS SCREEN\n        updateHUD();\n        showResults();\n      }\n    }\n\n    function showResults() {\n      document.getElementById('item-results').classList.remove('hidden');\n      document.getElementById('res-score').textContent = score + ' pts';\n      document.getElementById('res-streak').textContent = maxStreak + ' 🔥';\n\n      const pct = Math.round((score / 440) * 100);\n      document.getElementById('res-acc').textContent = Math.min(100, Math.max(0, pct)) + '%';\n\n      if (score >= 350) {\n        document.getElementById('res-trophy').textContent = '🏆';\n        document.getElementById('res-title').textContent = 'Greedy Algorithm Master!';\n        document.getElementById('res-subtitle').textContent = 'Flawless comprehension of Slide 1 heuristics, local vs global optima, and coin divisibility.';\n        soundFanfare();\n        triggerConfetti();\n      } else if (score >= 200) {\n        document.getElementById('res-trophy').textContent = '🥈';\n        document.getElementById('res-title').textContent = 'Solid Performance!';\n        document.getElementById('res-subtitle').textContent = 'Good grasp of the basics. Review the coin divisibility and no-backtracking rules in Slide 1 to solidify your mastery!';\n      } else {\n        document.getElementById('res-trophy').textContent = '💡';\n        document.getElementById('res-title').textContent = 'Keep Practicing!';\n        document.getElementById('res-subtitle').textContent = 'Take another look at Slide 1 to review why greedy heuristics avoid brute force 2ⁿ search.';\n      }\n    }\n\n    function retakeQuiz() {\n      score = 0;\n      streak = 0;\n      maxStreak = 0;\n      currentItemIdx = 0;\n      answers[0].fill('');\n      answers[1].fill('');\n      usedBankTiles[0].fill(false);\n      usedBankTiles[1].fill(false);\n      pillLocked = [false, false];\n\n      document.getElementById('item-results').classList.add('hidden');\n      for (let i = 0; i < 4; i++) {\n        document.getElementById('item-' + i).classList.add('hidden');\n        const fb = document.getElementById('feedback-' + i);\n        if (fb) fb.classList.add('hidden');\n      }\n\n      // Reset pill cards\n      [2, 3].forEach(idx => {\n        ['red', 'blue'].forEach(col => {\n          const c = document.getElementById(`pill-${idx}-${col}`);\n          c.className = `pill-card ${col} group`;\n        });\n      });\n\n      // Enable hint/clear buttons\n      [0, 1].forEach(i => {\n        document.getElementById('btn-hint-' + i).disabled = false;\n        document.getElementById('btn-backspace-' + i).disabled = false;\n        document.getElementById('btn-clear-' + i).disabled = false;\n      });\n\n      document.getElementById('item-0').classList.remove('hidden');\n      render4PicItem(0);\n      updateHUD();\n    }\n\n    // ==========================================\n    // ZOOM MODAL FOR 4-PICS\n    // ==========================================\n    function openZoom(clueId, title, desc) {\n      const modal = document.getElementById('zoom-modal');\n      const targetCard = event.currentTarget.querySelector('svg, div.aspect-square > div');\n      const container = document.getElementById('zoom-content');\n      container.innerHTML = targetCard.outerHTML;\n      document.getElementById('zoom-title').textContent = title;\n      document.getElementById('zoom-desc').textContent = desc;\n      modal.classList.add('open');\n    }\n\n    function closeZoom() {\n      document.getElementById('zoom-modal').classList.remove('open');\n    }\n    document.getElementById('zoom-modal').onclick = (e) => {\n      if (e.target.id === 'zoom-modal') closeZoom();\n    };\n\n    // ==========================================\n    // CONFETTI PARTICLES\n    // ==========================================\n    function triggerConfetti() {\n      const canvas = document.getElementById('confetti-canvas');\n      const ctx = canvas.getContext('2d');\n      canvas.width = window.innerWidth;\n      canvas.height = window.innerHeight;\n\n      const particles = [];\n      const colors = ['#10b981', '#38bdf8', '#f59e0b', '#f43f5e', '#a855f7'];\n\n      for (let i = 0; i < 90; i++) {\n        particles.push({\n          x: canvas.width / 2,\n          y: canvas.height * 0.4,\n          r: Math.random() * 6 + 3,\n          color: colors[Math.floor(Math.random() * colors.length)],\n          vx: (Math.random() - 0.5) * 14,\n          vy: (Math.random() - 0.8) * 14,\n          gravity: 0.28,\n          rotation: Math.random() * 360,\n          vRot: (Math.random() - 0.5) * 10\n        });\n      }\n\n      let animId;\n      function animate() {\n        ctx.clearRect(0, 0, canvas.width, canvas.height);\n        let alive = false;\n        particles.forEach(p => {\n          p.x += p.vx;\n          p.y += p.vy;\n          p.vy += p.gravity;\n          p.rotation += p.vRot;\n          if (p.y < canvas.height) alive = true;\n\n          ctx.save();\n          ctx.translate(p.x, p.y);\n          ctx.rotate((p.rotation * Math.PI) / 180);\n          ctx.fillStyle = p.color;\n          ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 1.4);\n          ctx.restore();\n        });\n\n        if (alive) animId = requestAnimationFrame(animate);\n        else ctx.clearRect(0, 0, canvas.width, canvas.height);\n      }\n      animate();\n    }\n\n    // ==========================================\n    // PRESENTATION INTEGRATION LINKS\n    // ==========================================\n    document.getElementById('btn-back-slide').onclick = () => {\n      if (window.parent && window.parent !== window) {\n        window.parent.postMessage({ type: 'GOTO_TOPIC', index: 0 }, '*');\n      } else {\n        window.location.href = 'index.html';\n      }\n    };\n\n    const btnNextQuiz = document.getElementById('btn-next-quiz');\n    if (btnNextQuiz) {\n      btnNextQuiz.onclick = () => {\n        if (window.parent && window.parent !== window) {\n          window.parent.postMessage({ type: 'GOTO_TOPIC', index: 9 }, '*'); // Slide 10: EFT Questions\n        } else {\n          window.location.href = 'EFT Questions (1).html';\n        }\n      };\n    }\n\n    // Startup\n    render4PicItem(0);\n    updateHUD();\n  <\/script>\n</body>\n</html>\n"},{"id":10,"tag":"Quiz 2","title":"Quiz 2: EFT Strategy Questions","shortTitle":"EFT Quiz","subtitle":"Identification Challenge: Earliest-Finish-Time Strategy","badge":"Interactive Quiz","file":"EFT Questions (1).html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>IDENTIFICATION CHALLENGE - EFT Strategy</title>\n  <style>\n    :root {\n      --bg-dark: #0b0f19;\n      --bg-radial: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0b0f19 70%);\n      --card-bg: rgba(23, 27, 44, 0.75);\n      --card-border: rgba(168, 85, 247, 0.2);\n      --accent-violet: #8b5cf6;\n      --accent-lavender: #c084fc;\n      --text-main: #f8fafc;\n      --text-muted: #94a3b8;\n      --text-dim: #64748b;\n      --stage-bg: rgba(15, 23, 42, 0.6);\n    }\n\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    html, body {\n      width: 100%;\n      height: 100%;\n      background: var(--bg-dark);\n      background-image: var(--bg-radial);\n      color: var(--text-main);\n      font-family: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      overflow: hidden;\n      -webkit-font-smoothing: antialiased;\n    }\n\n    /* Main Container for Desktop (Single Screen View) */\n    .viewport-wrapper {\n      width: 100vw;\n      height: 100vh;\n      display: flex;\n      flex-direction: column;\n      padding: 1.5rem 2.2rem;\n      box-sizing: border-box;\n      gap: 1.25rem;\n      opacity: 0;\n      animation: fadeIn 0.8s ease-out forwards;\n    }\n\n    @keyframes fadeIn {\n      from { opacity: 0; transform: translateY(8px); }\n      to { opacity: 1; transform: translateY(0); }\n    }\n\n    /* Header Presentation Styling */\n    .header {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      padding-bottom: 0.5rem;\n      border-bottom: 1px solid rgba(255, 255, 255, 0.08);\n      flex-shrink: 0;\n    }\n\n    .header-titles {\n      display: flex;\n      flex-direction: column;\n      gap: 0.2rem;\n    }\n\n    .eyebrow {\n      font-size: clamp(0.75rem, 1.1vw, 0.95rem);\n      font-weight: 700;\n      letter-spacing: 0.15em;\n      text-transform: uppercase;\n      color: var(--accent-lavender);\n    }\n\n    .title {\n      font-size: clamp(1.4rem, 2.5vw, 2.2rem);\n      font-weight: 900;\n      letter-spacing: -0.02em;\n      background: linear-gradient(135deg, #ffffff 30%, var(--accent-lavender) 100%);\n      -webkit-background-clip: text;\n      -webkit-text-fill-color: transparent;\n    }\n\n    .controls-group {\n      display: flex;\n      align-items: center;\n      gap: 0.6rem;\n    }\n\n    .ctrl-btn {\n      background: rgba(255, 255, 255, 0.05);\n      border: 1px solid var(--card-border);\n      color: var(--text-muted);\n      border-radius: 10px;\n      padding: 0.55rem 0.85rem;\n      cursor: pointer;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      transition: all 0.2s ease;\n      backdrop-filter: blur(8px);\n    }\n\n    .ctrl-btn:hover {\n      background: rgba(168, 85, 247, 0.2);\n      border-color: var(--accent-violet);\n      color: #ffffff;\n      transform: translateY(-1px);\n    }\n\n    .ctrl-btn svg {\n      width: 18px;\n      height: 18px;\n      fill: currentColor;\n    }\n\n    /* Content Cards Grid */\n    .cards-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1.5rem;\n      flex: 1;\n      min-height: 0; /* Critical for flex child grid containment */\n    }\n\n    .card {\n      background: var(--card-bg);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      border: 1px solid var(--card-border);\n      border-radius: 24px;\n      padding: 2.2rem;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);\n      position: relative;\n      overflow: hidden;\n    }\n\n    .card-header {\n      display: flex;\n      align-items: center;\n      gap: 0.8rem;\n      margin-bottom: 1rem;\n      flex-shrink: 0;\n    }\n\n    .card-badge {\n      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(139, 92, 246, 0.15) 100%);\n      border: 1px solid rgba(192, 132, 252, 0.4);\n      color: var(--accent-lavender);\n      font-weight: 800;\n      font-size: clamp(0.7rem, 0.9vw, 0.85rem);\n      padding: 0.35rem 0.85rem;\n      border-radius: 999px;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n\n    .card-type {\n      font-size: clamp(0.7rem, 0.9vw, 0.85rem);\n      font-weight: 700;\n      color: var(--text-dim);\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n    }\n\n    .question-body {\n      flex: 1;\n      display: flex;\n      align-items: center;\n    }\n\n    .question-text {\n      font-size: clamp(1.25rem, 2.1vw, 2.05rem);\n      line-height: 1.45;\n      font-weight: 500;\n      color: var(--text-main);\n      letter-spacing: -0.01em;\n    }\n\n    .blank-space {\n      display: inline-block;\n      min-width: 140px;\n      border-bottom: 3px dashed var(--accent-lavender);\n      color: var(--accent-lavender);\n      font-weight: 800;\n      text-align: center;\n      margin: 0 0.3rem;\n      padding: 0 0.4rem;\n      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2);\n    }\n\n    .card-footer {\n      margin-top: 1rem;\n      display: flex;\n      justify-content: flex-start;\n      flex-shrink: 0;\n    }\n\n    .instruction-tag {\n      font-size: clamp(0.7rem, 0.85vw, 0.8rem);\n      color: var(--text-muted);\n      display: inline-flex;\n      align-items: center;\n      gap: 0.4rem;\n      background: rgba(255, 255, 255, 0.04);\n      padding: 0.4rem 0.8rem;\n      border-radius: 8px;\n      border: 1px solid rgba(255, 255, 255, 0.06);\n    }\n\n    /* Dedicated Stage Area for Bouncing Shorts in Question 2 */\n    .shorts-stage {\n      width: 100%;\n      height: 150px;\n      margin-top: 1rem;\n      background: var(--stage-bg);\n      border: 1px dashed rgba(168, 85, 247, 0.25);\n      border-radius: 16px;\n      position: relative;\n      overflow: hidden;\n      flex-shrink: 0;\n    }\n\n    /* Outer sprite container handles translation only */\n    .shorts-sprite {\n      position: absolute;\n      top: 0;\n      left: 0;\n      width: 70px;\n      height: 59.5px; /* Aspect ratio matches 100:85 viewBox perfectly */\n      will-change: transform;\n    }\n\n    /* Inner sprite wrapper handles pulse/scale animation without breaking outer position */\n    .shorts-inner {\n      width: 100%;\n      height: 100%;\n      filter: drop-shadow(0 0 12px var(--accent-violet));\n      transition: filter 0.2s ease;\n      transform-origin: center center;\n    }\n\n    .shorts-svg {\n      width: 100%;\n      height: 100%;\n      display: block;\n    }\n\n    /* Collision Scale Pulse Keyframes on inner element */\n    @keyframes collidePulse {\n      0% { transform: scale(1); }\n      50% { transform: scale(1.18); }\n      100% { transform: scale(1); }\n    }\n\n    .shorts-inner.collided {\n      animation: collidePulse 0.18s ease-out;\n    }\n\n    /* Responsive Mobile Layout */\n    @media (max-width: 900px) {\n      html, body {\n        overflow-y: auto;\n      }\n\n      .viewport-wrapper {\n        height: auto;\n        min-height: 100vh;\n        padding: 1.25rem 1rem;\n        overflow-y: visible;\n      }\n\n      .cards-grid {\n        grid-template-columns: 1fr;\n        gap: 1.2rem;\n      }\n\n      .card {\n        padding: 1.5rem;\n      }\n\n      .shorts-stage {\n        height: 180px;\n      }\n    }\n  </style>\n</head>\n<body>\n\n<div class=\"viewport-wrapper\">\n  <!-- Header Presentation Controls -->\n  <header class=\"header\">\n    <div class=\"header-titles\">\n      <span class=\"eyebrow\">Algorithms • Earliest-Finish-Time Strategy</span>\n      <h1 class=\"title\">IDENTIFICATION CHALLENGE</h1>\n    </div>\n    <div class=\"controls-group\">\n      <button id=\"play-pause-btn\" class=\"ctrl-btn\" title=\"Pause Animation (Space)\">\n        <svg id=\"play-pause-icon\" viewBox=\"0 0 24 24\">\n          <path d=\"M6 19h4V5H6v14zm8-14v14h4V5h-4z\"/>\n        </svg>\n      </button>\n      <button id=\"fullscreen-btn\" class=\"ctrl-btn\" title=\"Toggle Fullscreen (F)\">\n        <svg viewBox=\"0 0 24 24\">\n          <path d=\"M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z\"/>\n        </svg>\n      </button>\n    </div>\n  </header>\n\n  <!-- Main Cards Grid -->\n  <main class=\"cards-grid\">\n    <!-- Question 1 Card -->\n    <section class=\"card\">\n      <div class=\"card-header\">\n        <span class=\"card-badge\">Question 01</span>\n        <span class=\"card-type\">Identification</span>\n      </div>\n      <div class=\"question-body\">\n        <p class=\"question-text\">\n          \"This greedy algorithm strategy maximizes the total number of non-overlapping activities scheduled by always prioritizing tasks that finish soonest.\"\n        </p>\n      </div>\n      <div class=\"card-footer\">\n        <span class=\"instruction-tag\"></span>\n      </div>\n    </section>\n\n    <!-- Question 2 Card -->\n    <section class=\"card\">\n      <div class=\"card-header\">\n        <span class=\"card-badge\">Question 02</span>\n        <span class=\"card-type\">Fill in the Blank</span>\n      </div>\n      <div class=\"question-body\">\n        <p class=\"question-text\">\n          \"Before evaluating activity compatibility, the EFT strategy must <span class=\"blank-space\">________</span> all items by their finish time in ascending order.\"\n        </p>\n      </div>\n\n      <!-- Animation Bouncing Stage Area -->\n      <div class=\"shorts-stage\" id=\"shorts-stage\">\n        <div id=\"bouncing-shorts\" class=\"shorts-sprite\">\n          <div class=\"shorts-inner\">\n            <svg class=\"shorts-svg\" viewBox=\"0 0 100 85\" xmlns=\"http://www.w3.org/2000/svg\">\n              <!-- Waistband -->\n              <path class=\"shorts-part waistband\" d=\"M 15 12 C 35 9, 65 9, 85 12 L 86 23 C 65 20, 35 20, 14 23 Z\" fill=\"#e2e8f0\" />\n              <!-- Drawstring lines -->\n              <path d=\"M 46 20 Q 43 32 40 40 M 54 20 Q 57 32 60 40\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\" fill=\"none\" />\n              <!-- Shorts Body -->\n              <path class=\"shorts-part body\" d=\"M 14 23 C 35 20, 65 20, 86 23 L 94 68 C 94 72, 90 75, 85 75 L 56 75 C 53 75, 51 72, 50 68 L 48 44 C 47 44, 45 44, 44 44 L 42 68 C 41 72, 39 75, 36 75 L 15 75 C 10 75, 6 72, 6 68 Z\" fill=\"#c084fc\" />\n              <!-- Sporty Side Stripes -->\n              <path d=\"M 17 25 L 8 68 M 83 25 L 92 68\" stroke=\"rgba(255,255,255,0.6)\" stroke-width=\"3.5\" stroke-linecap=\"round\" />\n            </svg>\n          </div>\n        </div>\n      </div>\n    </section>\n  </main>\n</div>\n\n<script>\n  (function() {\n    const stage = document.getElementById('shorts-stage');\n    const sprite = document.getElementById('bouncing-shorts');\n    const innerSprite = sprite ? sprite.querySelector('.shorts-inner') : null;\n    const bodyPart = sprite ? sprite.querySelector('.shorts-part.body') : null;\n    const playPauseBtn = document.getElementById('play-pause-btn');\n    const playPauseIcon = document.getElementById('play-pause-icon');\n    const fullscreenBtn = document.getElementById('fullscreen-btn');\n\n    // Vibrant color palette for wall collisions\n    const colors = [\n      '#c084fc', // Lavender\n      '#38bdf8', // Sky blue\n      '#34d399', // Emerald\n      '#f472b6', // Pink\n      '#fbbf24', // Amber\n      '#a855f7', // Purple\n      '#f43f5e'  // Rose\n    ];\n\n    let posX = 20;\n    let posY = 20;\n    let speedX = 2.2;\n    let speedY = 1.8;\n    let colorIdx = 0;\n    let isPlaying = true;\n    let animFrameId = null;\n\n    // Check reduced motion accessibility preference\n    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (prefersReducedMotion) {\n      isPlaying = false;\n    }\n\n    function getBounds() {\n      const stageRect = stage.getBoundingClientRect();\n      const spriteWidth = 70;\n      const spriteHeight = 59.5;\n      return {\n        maxX: Math.max(0, stageRect.width - spriteWidth),\n        maxY: Math.max(0, stageRect.height - spriteHeight)\n      };\n    }\n\n    function triggerCollisionEffect() {\n      if (!innerSprite) return;\n      innerSprite.classList.remove('collided');\n      // Force reflow to re-trigger CSS keyframe pulse\n      void innerSprite.offsetWidth;\n      innerSprite.classList.add('collided');\n\n      // Change shorts body fill & glow shadow\n      colorIdx = (colorIdx + 1) % colors.length;\n      if (bodyPart) {\n        bodyPart.setAttribute('fill', colors[colorIdx]);\n      }\n      innerSprite.style.filter = `drop-shadow(0 0 16px ${colors[colorIdx]})`;\n    }\n\n    function step() {\n      if (!isPlaying) return;\n\n      const { maxX, maxY } = getBounds();\n\n      posX += speedX;\n      posY += speedY;\n\n      let bounced = false;\n\n      if (posX >= maxX) {\n        posX = maxX;\n        speedX = -Math.abs(speedX);\n        bounced = true;\n      } else if (posX <= 0) {\n        posX = 0;\n        speedX = Math.abs(speedX);\n        bounced = true;\n      }\n\n      if (posY >= maxY) {\n        posY = maxY;\n        speedY = -Math.abs(speedY);\n        bounced = true;\n      } else if (posY <= 0) {\n        posY = 0;\n        speedY = Math.abs(speedY);\n        bounced = true;\n      }\n\n      if (bounced) {\n        triggerCollisionEffect();\n      }\n\n      sprite.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;\n\n      animFrameId = requestAnimationFrame(step);\n    }\n\n    function togglePlayPause() {\n      isPlaying = !isPlaying;\n      updatePlayPauseIcon();\n      if (isPlaying) {\n        animFrameId = requestAnimationFrame(step);\n      } else if (animFrameId) {\n        cancelAnimationFrame(animFrameId);\n      }\n    }\n\n    function updatePlayPauseIcon() {\n      if (!playPauseIcon) return;\n      if (isPlaying) {\n        playPauseIcon.innerHTML = `<path d=\"M6 19h4V5H6v14zm8-14v14h4V5h-4z\"/>`;\n        playPauseBtn.setAttribute('title', 'Pause Animation (Space)');\n      } else {\n        playPauseIcon.innerHTML = `<path d=\"M8 5v14l11-7z\"/>`;\n        playPauseBtn.setAttribute('title', 'Play Animation (Space)');\n      }\n    }\n\n    function toggleFullscreen() {\n      if (!document.fullscreenElement) {\n        document.documentElement.requestFullscreen().catch(() => {});\n      } else {\n        if (document.exitFullscreen) {\n          document.exitFullscreen();\n        }\n      }\n    }\n\n    // Event listeners\n    if (playPauseBtn) playPauseBtn.addEventListener('click', togglePlayPause);\n    if (fullscreenBtn) fullscreenBtn.addEventListener('click', toggleFullscreen);\n\n    window.addEventListener('keydown', (e) => {\n      if (e.code === 'Space' || e.key === ' ') {\n        e.preventDefault();\n        togglePlayPause();\n      } else if (e.code === 'KeyF' || e.key === 'f' || e.key === 'F') {\n        toggleFullscreen();\n      }\n    });\n\n    window.addEventListener('resize', () => {\n      const { maxX, maxY } = getBounds();\n      if (posX > maxX) posX = maxX;\n      if (posY > maxY) posY = maxY;\n      sprite.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;\n    });\n\n    // Initial setup\n    updatePlayPauseIcon();\n    sprite.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;\n    if (isPlaying) {\n      animFrameId = requestAnimationFrame(step);\n    }\n  })();\n<\/script>\n\n</body>\n</html>"},{"id":11,"tag":"Quiz 3","title":"Quiz 3: Why Earliest Finish Works","shortTitle":"Why EFT Quiz","subtitle":"Conceptual Questions: Correctness & Time Complexity","badge":"Conceptual Check","file":"why_the_earliest_finish_works_quiz.html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"theme-color\" content=\"#101827\">\n  <title>Earliest Finish Algorithm — Questions</title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n  <script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n  <style>\n    :root {\n      color-scheme: light;\n      --ink: #172033;\n      --muted: #5d687b;\n      --line: #dce3ed;\n      --paper: #ffffff;\n      --page: #f2f5fa;\n      --accent: #315ee8;\n      --accent-soft: #eaf0ff;\n    }\n    * { box-sizing: border-box; }\n    body {\n      margin: 0;\n      background: var(--page);\n      color: var(--ink);\n      font: 16px/1.65 system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n    }\n    .hero {\n      padding: clamp(2rem, 6vw, 4.5rem) 1rem 2.5rem;\n      background: linear-gradient(135deg, #101827, #203a70);\n      color: white;\n    }\n    .hero-inner, main, footer {\n      width: min(100% - 2rem, 1000px);\n      margin-inline: auto;\n    }\n    .eyebrow {\n      display: inline-block;\n      margin: 0 0 .75rem;\n      padding: .25rem .65rem;\n      border: 1px solid #8198d7;\n      border-radius: 999px;\n      color: #d9e4ff;\n      font-size: .78rem;\n      font-weight: 700;\n      letter-spacing: .08em;\n      text-transform: uppercase;\n    }\n    h1 {\n      max-width: 780px;\n      margin: 0;\n      font-size: clamp(2rem, 6vw, 3.5rem);\n      line-height: 1.12;\n      letter-spacing: -.035em;\n    }\n    .hero p {\n      max-width: 720px;\n      margin: 1rem 0 0;\n      color: #e0e8fa;\n      font-size: clamp(1rem, 2.4vw, 1.15rem);\n    }\n    main { padding-block: 1.5rem 3rem; }\n    section {\n      margin: 1.2rem 0;\n      padding: clamp(1rem, 3vw, 1.6rem);\n      background: var(--paper);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      box-shadow: 0 8px 24px rgb(21 35 62 / 5%);\n    }\n    h2 {\n      margin: 0 0 .7rem;\n      font-size: clamp(1.25rem, 3vw, 1.65rem);\n      line-height: 1.25;\n    }\n    p { margin: .5rem 0; }\n    .question-label {\n      display: inline-block;\n      margin-bottom: .65rem;\n      padding: .2rem .6rem;\n      border-radius: 999px;\n      background: var(--accent-soft);\n      color: var(--accent);\n      font-size: .8rem;\n      font-weight: 750;\n    }\n    .question-text { font-size: 1.08rem; }\n    footer {\n      padding: 0 0 2rem;\n      color: var(--muted);\n      font-size: .9rem;\n    }\n    @media (max-width: 520px) {\n      .hero-inner, main, footer { width: min(100% - 1rem, 1000px); }\n      .hero { padding-top: 2.2rem; }\n      section { border-radius: 13px; padding: 1rem; }\n    }\n  </style>\n</head>\n<body>\n  <header class=\"hero\">\n    <div class=\"hero-inner\">\n      <p class=\"eyebrow\">Greedy Algorithm · Questions</p>\n      <h1>Why Earliest Finish Works</h1>\n      <p>Two coding-related questions about the Earliest Finish algorithm.</p>\n    </div>\n  </header>\n\n  <main>\n    <section aria-labelledby=\"question-one\">\n      <span class=\"question-label\">Question 1</span>\n      <h2 id=\"question-one\">Algorithm Implementation</h2>\n      <p class=\"question-text\">\n        How does the Earliest Finish algorithm select the maximum number\n        of non-overlapping activities in a program?\n      </p>\n    </section>\n\n    <section aria-labelledby=\"question-two\">\n      <span class=\"question-label\">Question 2</span>\n      <h2 id=\"question-two\">Correctness and Efficiency</h2>\n      <p class=\"question-text\">\n        Why does sorting activities by their finish time help guarantee\n        an optimal solution, and what is the algorithm's time complexity?\n      </p>\n    </section>\n  </main>\n\n  <footer>\n    <p>Hayop na yan. Hoy! Wal-walang kanin buseng? Putanginang hayop na yan! Walang kanin?!</p>\n  </footer>\n</body>\n</html>\n"},{"id":12,"tag":"Quiz 4","title":"Quiz 4: When Greedy Algorithms Fail","shortTitle":"Failures Quiz","subtitle":"Knowledge Check: 0/1 Knapsack & Greedy Limitations","badge":"Knowledge Check","file":"greedy_algorithms_quiz.html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Knowledge Check: Greedy Algorithms</title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap\" rel=\"stylesheet\">\n    <style>\n        body {\n            background-color: #0f172a; /* Slate 900 */\n            color: #f8fafc; /* Slate 50 */\n            font-family: 'Inter', sans-serif;\n            min-height: 100vh;\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            padding: 2rem 1rem;\n        }\n\n        .glass-container {\n            background: rgba(30, 41, 59, 0.7); /* Slate 800 */\n            backdrop-filter: blur(10px);\n            border: 1px solid rgba(255, 255, 255, 0.1);\n            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);\n        }\n\n        /* Custom radio button styling */\n        input[type=\"radio\"] {\n            accent-color: #38bdf8; /* Sky 400 */\n            width: 1.25rem;\n            height: 1.25rem;\n            cursor: pointer;\n        }\n\n        .feedback-box {\n            display: none;\n            transition: all 0.3s ease-in-out;\n        }\n        \n        .feedback-box.visible {\n            display: block;\n            animation: fadeIn 0.5s;\n        }\n\n        @keyframes fadeIn {\n            from { opacity: 0; transform: translateY(-10px); }\n            to { opacity: 1; transform: translateY(0); }\n        }\n    </style>\n</head>\n<body>\n\n    <div class=\"glass-container w-full max-w-3xl rounded-2xl p-6 md:p-10\">\n        <div class=\"text-center mb-10\">\n            <h1 class=\"text-4xl font-bold mb-4\">Knowledge Check</h1>\n            <div class=\"w-16 h-1 bg-sky-500 mx-auto rounded mb-4\"></div>\n            <p class=\"text-slate-400 text-lg\">Test your understanding of when and why Greedy Algorithms fail.</p>\n        </div>\n\n        <form id=\"quiz-form\" class=\"space-y-10\">\n            <!-- Question 1 -->\n            <div class=\"space-y-4\" id=\"q1-container\">\n                <h2 class=\"text-2xl font-semibold text-sky-400\">1. Local vs Global Optimum</h2>\n                <p class=\"text-lg\">Why do greedy algorithms sometimes fail to find the optimal solution?</p>\n                \n                <div class=\"space-y-3 bg-slate-900/50 p-5 rounded-lg border border-slate-700\">\n                    <label class=\"flex items-start space-x-3 cursor-pointer p-2 hover:bg-slate-800 rounded transition-colors\">\n                        <input type=\"radio\" name=\"q1\" value=\"A\" class=\"mt-1\" required>\n                        <span><strong>A)</strong> They are too slow and generally run out of memory before finishing.</span>\n                    </label>\n                    <label class=\"flex items-start space-x-3 cursor-pointer p-2 hover:bg-slate-800 rounded transition-colors\">\n                        <input type=\"radio\" name=\"q1\" value=\"B\" class=\"mt-1\">\n                        <span><strong>B)</strong> They make locally optimal choices that permanently lock them out of the global optimum.</span>\n                    </label>\n                    <label class=\"flex items-start space-x-3 cursor-pointer p-2 hover:bg-slate-800 rounded transition-colors\">\n                        <input type=\"radio\" name=\"q1\" value=\"C\" class=\"mt-1\">\n                        <span><strong>C)</strong> They evaluate every single combination, which causes stack overflows.</span>\n                    </label>\n                    <label class=\"flex items-start space-x-3 cursor-pointer p-2 hover:bg-slate-800 rounded transition-colors\">\n                        <input type=\"radio\" name=\"q1\" value=\"D\" class=\"mt-1\">\n                        <span><strong>D)</strong> They always require overlapping subproblems to function correctly.</span>\n                    </label>\n                </div>\n                \n                <!-- Feedback Q1 -->\n                <div id=\"q1-feedback\" class=\"feedback-box p-4 rounded-lg mt-2 border\"></div>\n            </div>\n\n            <!-- Question 2 -->\n            <div class=\"space-y-4\" id=\"q2-container\">\n                <h2 class=\"text-2xl font-semibold text-sky-400\">2. The 0/1 Knapsack Problem</h2>\n                <p class=\"text-lg\">In the 0/1 Knapsack problem, why does the greedy approach (sorting by best value-to-weight ratio) fail?</p>\n                \n                <div class=\"space-y-3 bg-slate-900/50 p-5 rounded-lg border border-slate-700\">\n                    <label class=\"flex items-start space-x-3 cursor-pointer p-2 hover:bg-slate-800 rounded transition-colors\">\n                        <input type=\"radio\" name=\"q2\" value=\"A\" class=\"mt-1\" required>\n                        <span><strong>A)</strong> It ignores the weight limit entirely and just takes the most valuable items.</span>\n                    </label>\n                    <label class=\"flex items-start space-x-3 cursor-pointer p-2 hover:bg-slate-800 rounded transition-colors\">\n                        <input type=\"radio\" name=\"q2\" value=\"B\" class=\"mt-1\">\n                        <span><strong>B)</strong> It takes fractions of items instead of whole items.</span>\n                    </label>\n                    <label class=\"flex items-start space-x-3 cursor-pointer p-2 hover:bg-slate-800 rounded transition-colors\">\n                        <input type=\"radio\" name=\"q2\" value=\"C\" class=\"mt-1\">\n                        <span><strong>C)</strong> It maximizes short-term ratio, potentially leaving empty space that a better combination of lower-ratio items could efficiently fill.</span>\n                    </label>\n                    <label class=\"flex items-start space-x-3 cursor-pointer p-2 hover:bg-slate-800 rounded transition-colors\">\n                        <input type=\"radio\" name=\"q2\" value=\"D\" class=\"mt-1\">\n                        <span><strong>D)</strong> It stops early because it encounters an item with a negative value.</span>\n                    </label>\n                </div>\n\n                <!-- Feedback Q2 -->\n                <div id=\"q2-feedback\" class=\"feedback-box p-4 rounded-lg mt-2 border\"></div>\n            </div>\n\n            <div class=\"pt-6 border-t border-slate-700 text-center\">\n                <button type=\"submit\" class=\"bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 px-10 rounded-full transition-colors shadow-lg transform hover:scale-105 duration-200\">\n                    Submit Answers\n                </button>\n            </div>\n            \n            <!-- Final Score Display -->\n            <div id=\"score-display\" class=\"hidden text-center mt-6 text-2xl font-bold p-4 bg-slate-900 rounded-xl border border-slate-700\">\n            </div>\n        </form>\n    </div>\n\n    <script>\n        document.getElementById('quiz-form').addEventListener('submit', function(e) {\n            e.preventDefault(); // Prevent page reload\n            \n            // Get selected values\n            const q1Answer = document.querySelector('input[name=\"q1\"]:checked').value;\n            const q2Answer = document.querySelector('input[name=\"q2\"]:checked').value;\n            \n            const q1Feedback = document.getElementById('q1-feedback');\n            const q2Feedback = document.getElementById('q2-feedback');\n            \n            let score = 0;\n\n            // Evaluate Question 1\n            if (q1Answer === 'B') {\n                score++;\n                q1Feedback.className = 'feedback-box visible bg-green-900/30 border-green-500 text-green-300 p-4 rounded-lg mt-2 border';\n                q1Feedback.innerHTML = '<strong>✓ Correct!</strong> Greedy algorithms make decisions based entirely on immediate, local gain. If the problem lacks the \"greedy-choice property\", this short-sightedness prevents it from seeing the true global optimum.';\n            } else {\n                q1Feedback.className = 'feedback-box visible bg-red-900/30 border-red-500 text-red-300 p-4 rounded-lg mt-2 border';\n                q1Feedback.innerHTML = '<strong>✗ Incorrect.</strong> The correct answer is <strong>B</strong>. Greedy algorithms are usually very fast and memory-efficient, but they fail when a short-sighted local choice prevents a better long-term combination.';\n            }\n\n            // Evaluate Question 2\n            if (q2Answer === 'C') {\n                score++;\n                q2Feedback.className = 'feedback-box visible bg-green-900/30 border-green-500 text-green-300 p-4 rounded-lg mt-2 border';\n                q2Feedback.innerHTML = '<strong>✓ Correct!</strong> In the 0/1 Knapsack problem, you cannot take fractions of items. Taking a highly-rated, heavy item might leave an awkward gap in your backpack that goes unused, whereas taking multiple slightly-lower-rated items might fill the backpack perfectly for a higher total value.';\n            } else {\n                q2Feedback.className = 'feedback-box visible bg-red-900/30 border-red-500 text-red-300 p-4 rounded-lg mt-2 border';\n                q2Feedback.innerHTML = '<strong>✗ Incorrect.</strong> The correct answer is <strong>C</strong>. The greedy approach focuses only on the value-to-weight ratio. Because it cannot break items into fractions, a high-ratio item might waste capacity that could have been perfectly filled by a combination of lower-ratio items.';\n            }\n\n            // Display Score\n            const scoreDisplay = document.getElementById('score-display');\n            scoreDisplay.classList.remove('hidden');\n            scoreDisplay.classList.add('block');\n            \n            if(score === 2) {\n                scoreDisplay.innerHTML = `Perfect Score: 2/2! <br><span class=\"text-sm text-sky-400 font-normal\">You've mastered the pitfalls of Greedy Algorithms.</span>`;\n            } else {\n                scoreDisplay.innerHTML = `Your Score: ${score}/2 <br><span class=\"text-sm text-slate-400 font-normal\">Review the explanations above to understand where greedy algorithms fall short.</span>`;\n            }\n\n            // Disable radio buttons after submission\n            const radios = document.querySelectorAll('input[type=\"radio\"]');\n            radios.forEach(radio => radio.disabled = true);\n            \n            // Disable the submit button\n            const submitBtn = document.querySelector('button[type=\"submit\"]');\n            submitBtn.disabled = true;\n            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');\n            submitBtn.classList.remove('hover:bg-sky-500', 'hover:scale-105');\n            submitBtn.innerText = \"Answers Submitted\";\n        });\n    <\/script>\n</body>\n</html>"},{"id":13,"tag":"Answer Key","title":"Master Answer Key for All Quizzes","shortTitle":"Answer Key","subtitle":"Complete Verified Solutions & Detailed Explanations for All 4 Quizzes","badge":"Master Key","file":"answer_key.html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <title>Master Answer Key · All Quizzes</title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n  <script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n  <style>\n    :root {\n      --font-mono: 'JetBrains Mono', ui-monospace, monospace;\n    }\n    * {\n      box-sizing: border-box;\n    }\n    html, body {\n      background: #090d16;\n      color: #f1f5f9;\n      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;\n      min-height: 100%;\n      overflow-x: hidden;\n      overflow-y: auto !important;\n      -webkit-overflow-scrolling: touch;\n      background: radial-gradient(1200px 600px at 10% -10%, rgba(16, 185, 129, 0.12), transparent 60%),\n                  radial-gradient(900px 500px at 90% 10%, rgba(56, 189, 248, 0.12), transparent 55%),\n                  radial-gradient(800px 600px at 50% 100%, rgba(139, 92, 246, 0.1), transparent 60%),\n                  linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px) 0 0/48px 48px,\n                  linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px) 0 0/48px 48px,\n                  #090d16;\n      background-attachment: fixed;\n    }\n\n    .glass-card {\n      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.85));\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      border: 1px solid rgba(255, 255, 255, 0.08);\n      box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);\n      border-radius: 1.25rem;\n    }\n\n    .answer-badge {\n      display: inline-flex;\n      align-items: center;\n      gap: 0.35rem;\n      padding: 0.25rem 0.75rem;\n      border-radius: 9999px;\n      font-family: var(--font-mono);\n      font-weight: 800;\n      font-size: 0.85rem;\n      letter-spacing: 0.04em;\n    }\n\n    .nav-pill {\n      transition: all 0.2s ease;\n    }\n    .nav-pill:hover {\n      transform: translateY(-2px);\n    }\n  </style>\n</head>\n<body class=\"relative pb-36\">\n\n  <!-- Header -->\n  <header class=\"sticky top-0 z-40 bg-slate-950/85 backdrop-blur-md border-b border-white/10 px-4 md:px-8 py-3.5\">\n    <div class=\"max-w-5xl mx-auto flex items-center justify-between gap-4 flex-wrap\">\n      <div class=\"flex items-center gap-3\">\n        <span class=\"w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse\"></span>\n        <div>\n          <div class=\"text-[10px] sm:text-[11px] font-bold uppercase tracking-widest text-emerald-400\">Final Presentation Stage · Master Reference</div>\n          <h1 class=\"text-base sm:text-xl font-black text-white flex items-center gap-2\">\n            <span>🔑 Master Answer Key for All Quizzes</span>\n            <span class=\"px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-300 border border-emerald-500/30\">Verified</span>\n          </h1>\n        </div>\n      </div>\n\n      <div class=\"flex items-center gap-2\">\n        <a href=\"#quiz-1-sec\" class=\"nav-pill px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-white/10\">Quiz 1</a>\n        <a href=\"#quiz-2-sec\" class=\"nav-pill px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-white/10\">EFT</a>\n        <a href=\"#quiz-3-sec\" class=\"nav-pill px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-white/10\">Why EFT</a>\n        <a href=\"#quiz-4-sec\" class=\"nav-pill px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-white/10\">Limitations</a>\n      </div>\n    </div>\n  </header>\n\n  <!-- Main Container -->\n  <main class=\"max-w-5xl mx-auto px-3 sm:px-6 py-6 space-y-8\">\n\n    <!-- Overview Banner -->\n    <div class=\"p-4 sm:p-5 rounded-2xl bg-gradient-to-r from-emerald-500/10 via-sky-500/10 to-indigo-500/10 border border-emerald-500/20 text-center sm:text-left flex flex-col sm:flex-row items-center justify-between gap-4\">\n      <div>\n        <h2 class=\"text-lg font-bold text-white\">Complete Presentation Solutions</h2>\n        <p class=\"text-xs sm:text-sm text-slate-300 mt-0.5\">Use this master reference key to check and verify answers across all 4 interactive quizzes.</p>\n      </div>\n      <div class=\"flex items-center gap-3\">\n        <button onclick=\"window.print()\" class=\"px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold border border-white/10 shadow transition-all\">\n          🖨️ Print / Save PDF\n        </button>\n      </div>\n    </div>\n\n    <!-- ======================================================== -->\n    <!-- SECTION 1: QUIZ 1 (INTRODUCTION TO GREEDY ALGORITHMS) -->\n    <!-- ======================================================== -->\n    <section id=\"quiz-1-sec\" class=\"glass-card p-5 sm:p-7 space-y-6 border-sky-500/25\">\n      <div class=\"flex items-center justify-between border-b border-white/10 pb-4 flex-wrap gap-2\">\n        <div class=\"flex items-center gap-3\">\n          <span class=\"w-8 h-8 rounded-xl bg-sky-500/20 text-sky-400 font-black text-sm flex items-center justify-center border border-sky-500/30\">01</span>\n          <div>\n            <span class=\"text-[10px] font-bold text-sky-400 uppercase tracking-wider\">Slide 09 · Interactive Checkpoint</span>\n            <h3 class=\"text-lg sm:text-xl font-extrabold text-white\">Quiz 1: Introduction to Greedy Algorithms</h3>\n          </div>\n        </div>\n        <span class=\"px-2.5 py-1 rounded-full bg-slate-800 text-xs text-slate-300 font-semibold border border-white/10\">4 Items</span>\n      </div>\n\n      <div class=\"grid gap-4\">\n        <!-- Item 1 -->\n        <div class=\"p-4 rounded-xl bg-slate-900/80 border border-white/5 space-y-2\">\n          <div class=\"flex items-center justify-between flex-wrap gap-2\">\n            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wide\">Item 1 • 4 Pics 1 Word</span>\n            <span class=\"answer-badge bg-emerald-500/20 text-emerald-300 border border-emerald-500/40\">ANSWER: GREEDY</span>\n          </div>\n          <p class=\"text-xs sm:text-sm text-slate-300 font-medium\"><b>Clues:</b> 1. Immediate ₱20 coin grab; 2. Short-sighted lens on \"NOW\"; 3. One-way highway (no backtracking); 4. `prioritize(c)` + `solution.append()`. Word length: <b>6 letters</b>.</p>\n          <p class=\"text-xs text-slate-400 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800 leading-relaxed\">\n            <b>Rationale:</b> A <b>Greedy Algorithm</b> always commits permanently to the most advantageous choice right now (local optimum) without exploring all futures or backtracking.\n          </p>\n        </div>\n\n        <!-- Item 2 -->\n        <div class=\"p-4 rounded-xl bg-slate-900/80 border border-white/5 space-y-2\">\n          <div class=\"flex items-center justify-between flex-wrap gap-2\">\n            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wide\">Item 2 • 4 Pics 1 Word</span>\n            <span class=\"answer-badge bg-emerald-500/20 text-emerald-300 border border-emerald-500/40\">ANSWER: BRUTE FORCE</span>\n          </div>\n          <p class=\"text-xs sm:text-sm text-slate-300 font-medium\"><b>Clues:</b> 1. Endless key ring trying every key; 2. Exponential 2ⁿ curve; 3. Overheated 100% CPU burn; 4. Full permutation search tree. Word length: <b>10 letters (2 words)</b>.</p>\n          <p class=\"text-xs text-slate-400 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800 leading-relaxed\">\n            <b>Rationale:</b> <b>Brute Force</b> exhaustively tests all 2ⁿ subsets or n! permutations, which becomes computationally impossible as input size <i>n</i> scales higher.\n          </p>\n        </div>\n\n        <!-- Item 3 -->\n        <div class=\"p-4 rounded-xl bg-slate-900/80 border border-white/5 space-y-2\">\n          <div class=\"flex items-center justify-between flex-wrap gap-2\">\n            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wide\">Item 3 • The Matrix Dilemma</span>\n            <span class=\"answer-badge bg-rose-500/20 text-rose-300 border border-rose-500/40\">ANSWER: THE RED PILL</span>\n          </div>\n          <p class=\"text-xs sm:text-sm text-slate-200\"><b>Question:</b> What truly happens when <code>solution.append(candidate)</code> executes in a genuine Greedy Algorithm?</p>\n          <p class=\"text-xs text-slate-400 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800 leading-relaxed\">\n            <b>Correct Pill:</b> <b>The Red Pill (Permanent Commitment: No Undo, No Backtracking)</b>.<br>\n            <b>Rationale:</b> Slide 1 line 99 explicitly documents: <code># Permanent commitment: no undo / backtracking</code>. Greedy never backtracks; candidates are never on probation.\n          </p>\n        </div>\n\n        <!-- Item 4 -->\n        <div class=\"p-4 rounded-xl bg-slate-900/80 border border-white/5 space-y-2\">\n          <div class=\"flex items-center justify-between flex-wrap gap-2\">\n            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wide\">Item 4 • Coin Change Dilemma</span>\n            <span class=\"answer-badge bg-rose-500/20 text-rose-300 border border-rose-500/40\">ANSWER: THE RED PILL</span>\n          </div>\n          <p class=\"text-xs sm:text-sm text-slate-200\"><b>Question:</b> Why does the Greedy strategy guarantee the minimum coins in the {₱20, ₱10, ₱5, ₱1} sandbox?</p>\n          <p class=\"text-xs text-slate-400 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800 leading-relaxed\">\n            <b>Correct Pill:</b> <b>The Red Pill (Divisibility Principle)</b>.<br>\n            <b>Rationale:</b> ₱20, ₱10, ₱5, and ₱1 divide neatly into each other. Replacing one ₱20 requires two ₱10s, and replacing one ₱5 requires five ₱1s. The Blue Pill claim that greedy always works for any arbitrary coins (like {4, 3, 1}) is false as noted in Slide 1!\n          </p>\n        </div>\n      </div>\n    </section>\n\n    <!-- ======================================================== -->\n    <!-- SECTION 2: QUIZ 2 (EFT QUESTIONS - STRATEGY) -->\n    <!-- ======================================================== -->\n    <section id=\"quiz-2-sec\" class=\"glass-card p-5 sm:p-7 space-y-6 border-violet-500/25\">\n      <div class=\"flex items-center justify-between border-b border-white/10 pb-4 flex-wrap gap-2\">\n        <div class=\"flex items-center gap-3\">\n          <span class=\"w-8 h-8 rounded-xl bg-violet-500/20 text-violet-400 font-black text-sm flex items-center justify-center border border-violet-500/30\">02</span>\n          <div>\n            <span class=\"text-[10px] font-bold text-violet-400 uppercase tracking-wider\">Slide 10 · Identification Challenge</span>\n            <h3 class=\"text-lg sm:text-xl font-extrabold text-white\">Quiz 2: Earliest-Finish-Time (EFT) Questions</h3>\n          </div>\n        </div>\n        <span class=\"px-2.5 py-1 rounded-full bg-slate-800 text-xs text-slate-300 font-semibold border border-white/10\">2 Items</span>\n      </div>\n\n      <div class=\"grid gap-4\">\n        <!-- Question 1 -->\n        <div class=\"p-4 rounded-xl bg-slate-900/80 border border-white/5 space-y-2\">\n          <div class=\"flex items-center justify-between flex-wrap gap-2\">\n            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wide\">Question 01 • Identification</span>\n            <span class=\"answer-badge bg-emerald-500/20 text-emerald-300 border border-emerald-500/40\">ANSWER: Earliest-Finish-Time (EFT) Strategy</span>\n          </div>\n          <p class=\"text-xs sm:text-sm text-slate-200 italic\">\"This greedy algorithm strategy maximizes the total number of non-overlapping activities scheduled by always prioritizing tasks that finish soonest.\"</p>\n          <p class=\"text-xs text-slate-400 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800 leading-relaxed\">\n            <b>Rationale:</b> The <b>Earliest-Finish-Time (EFT)</b> heuristic picks activities with the minimal finish time, leaving the largest remaining time available for subsequent events.\n          </p>\n        </div>\n\n        <!-- Question 2 -->\n        <div class=\"p-4 rounded-xl bg-slate-900/80 border border-white/5 space-y-2\">\n          <div class=\"flex items-center justify-between flex-wrap gap-2\">\n            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wide\">Question 02 • Fill in the Blank</span>\n            <span class=\"answer-badge bg-emerald-500/20 text-emerald-300 border border-emerald-500/40\">ANSWER: sort (or order)</span>\n          </div>\n          <p class=\"text-xs sm:text-sm text-slate-200 italic\">\"Before evaluating activity compatibility, the EFT strategy must <u class=\"text-emerald-300 font-bold\">sort</u> all items by their finish time in ascending order.\"</p>\n          <p class=\"text-xs text-slate-400 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800 leading-relaxed\">\n            <b>Rationale:</b> Sorting activities by ascending finish times (requiring $O(n \\log n)$) is the mandatory prerequisite before the linear greedy scan can take place.\n          </p>\n        </div>\n      </div>\n    </section>\n\n    <!-- ======================================================== -->\n    <!-- SECTION 3: QUIZ 3 (WHY EARLIEST FINISH WORKS) -->\n    <!-- ======================================================== -->\n    <section id=\"quiz-3-sec\" class=\"glass-card p-5 sm:p-7 space-y-6 border-amber-500/25\">\n      <div class=\"flex items-center justify-between border-b border-white/10 pb-4 flex-wrap gap-2\">\n        <div class=\"flex items-center gap-3\">\n          <span class=\"w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 font-black text-sm flex items-center justify-center border border-amber-500/30\">03</span>\n          <div>\n            <span class=\"text-[10px] font-bold text-amber-400 uppercase tracking-wider\">Slide 11 · Conceptual Questions</span>\n            <h3 class=\"text-lg sm:text-xl font-extrabold text-white\">Quiz 3: Why Earliest Finish Works</h3>\n          </div>\n        </div>\n        <span class=\"px-2.5 py-1 rounded-full bg-slate-800 text-xs text-slate-300 font-semibold border border-white/10\">2 Items</span>\n      </div>\n\n      <div class=\"grid gap-4\">\n        <!-- Question 1 -->\n        <div class=\"p-4 rounded-xl bg-slate-900/80 border border-white/5 space-y-2\">\n          <div class=\"flex items-center justify-between flex-wrap gap-2\">\n            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wide\">Question 1 • Algorithm Implementation</span>\n            <span class=\"answer-badge bg-amber-500/20 text-amber-300 border border-amber-500/40\">CORE CONCEPT: Greedy Compatibility Filter</span>\n          </div>\n          <p class=\"text-xs sm:text-sm text-slate-200 font-semibold\">How does the Earliest Finish algorithm select the maximum number of non-overlapping activities in a program?</p>\n          <div class=\"text-xs text-slate-300 bg-slate-950/60 p-3 rounded-lg border border-slate-800 space-y-1.5 leading-relaxed\">\n            <p><b>1. Sort:</b> Sort all $n$ activities in ascending order of finish time ($f_1 \\le f_2 \\le \\dots \\le f_n$).</p>\n            <p><b>2. Initialize:</b> Select the first activity $A_1$ (which finishes earliest of all).</p>\n            <p><b>3. Scan:</b> For each subsequent activity $i$, check if its start time $s_i \\ge f_{last}$ (finish time of last chosen activity). If compatible, append activity $i$ and update $f_{last} = f_i$.</p>\n          </div>\n        </div>\n\n        <!-- Question 2 -->\n        <div class=\"p-4 rounded-xl bg-slate-900/80 border border-white/5 space-y-2\">\n          <div class=\"flex items-center justify-between flex-wrap gap-2\">\n            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wide\">Question 2 • Correctness & Efficiency</span>\n            <span class=\"answer-badge bg-amber-500/20 text-amber-300 border border-amber-500/40\">COMPLEXITY: O(n log n)</span>\n          </div>\n          <p class=\"text-xs sm:text-sm text-slate-200 font-semibold\">Why does sorting activities by their finish time help guarantee an optimal solution, and what is the algorithm's time complexity?</p>\n          <div class=\"text-xs text-slate-300 bg-slate-950/60 p-3 rounded-lg border border-slate-800 space-y-1.5 leading-relaxed\">\n            <p><b>Why It Guarantees Optimality:</b> By finishing as early as possible, the first chosen activity frees up the maximum possible remaining time window for future activities. Through the <b>Exchange Argument</b>, any optimal schedule that doesn't start with the earliest-finishing activity can replace its first item with the greedy choice without causing conflicts, proving the greedy choice is never worse than any alternative.</p>\n            <p><b>Time Complexity:</b> <b>$O(n \\log n)$</b> for sorting the activities, plus <b>$O(n)$</b> for the single linear scan. Total overall time is dominated by sorting: <b>$O(n \\log n)$</b>.</p>\n          </div>\n        </div>\n      </div>\n    </section>\n\n    <!-- ======================================================== -->\n    <!-- SECTION 4: QUIZ 4 (GREEDY ALGORITHMS LIMITATIONS) -->\n    <!-- ======================================================== -->\n    <section id=\"quiz-4-sec\" class=\"glass-card p-5 sm:p-7 space-y-6 border-emerald-500/25\">\n      <div class=\"flex items-center justify-between border-b border-white/10 pb-4 flex-wrap gap-2\">\n        <div class=\"flex items-center gap-3\">\n          <span class=\"w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 font-black text-sm flex items-center justify-center border border-emerald-500/30\">04</span>\n          <div>\n            <span class=\"text-[10px] font-bold text-emerald-400 uppercase tracking-wider\">Slide 12 · Multiple Choice Assessment</span>\n            <h3 class=\"text-lg sm:text-xl font-extrabold text-white\">Quiz 4: When Greedy Algorithms Fail</h3>\n          </div>\n        </div>\n        <span class=\"px-2.5 py-1 rounded-full bg-slate-800 text-xs text-slate-300 font-semibold border border-white/10\">2 Items</span>\n      </div>\n\n      <div class=\"grid gap-4\">\n        <!-- Question 1 -->\n        <div class=\"p-4 rounded-xl bg-slate-900/80 border border-white/5 space-y-2\">\n          <div class=\"flex items-center justify-between flex-wrap gap-2\">\n            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wide\">Question 1 • Local vs Global Optimum</span>\n            <span class=\"answer-badge bg-emerald-500/20 text-emerald-300 border border-emerald-500/40\">CORRECT OPTION: B</span>\n          </div>\n          <p class=\"text-xs sm:text-sm text-slate-200\"><b>Question:</b> Why do greedy algorithms sometimes fail to find the optimal solution?</p>\n          <p class=\"text-xs text-emerald-300 font-semibold\"><b>Correct Answer:</b> B) They make locally optimal choices that permanently lock them out of the global optimum.</p>\n          <p class=\"text-xs text-slate-400 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800 leading-relaxed\">\n            <b>Rationale:</b> Greedy algorithms decide strictly based on immediate, local gain. When a problem lacks the greedy-choice property, a short-sighted local choice permanently closes the door to a superior overall combination.\n          </p>\n        </div>\n\n        <!-- Question 2 -->\n        <div class=\"p-4 rounded-xl bg-slate-900/80 border border-white/5 space-y-2\">\n          <div class=\"flex items-center justify-between flex-wrap gap-2\">\n            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wide\">Question 2 • The 0/1 Knapsack Problem</span>\n            <span class=\"answer-badge bg-emerald-500/20 text-emerald-300 border border-emerald-500/40\">CORRECT OPTION: C</span>\n          </div>\n          <p class=\"text-xs sm:text-sm text-slate-200\"><b>Question:</b> In the 0/1 Knapsack problem, why does the greedy approach (sorting by best value-to-weight ratio) fail?</p>\n          <p class=\"text-xs text-emerald-300 font-semibold\"><b>Correct Answer:</b> C) It maximizes short-term ratio, potentially leaving empty space that a better combination of lower-ratio items could efficiently fill.</p>\n          <p class=\"text-xs text-slate-400 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800 leading-relaxed\">\n            <b>Rationale:</b> Because items cannot be divided (0 or 1), greedily grabbing the item with the highest density can leave unused weight capacity that cannot fit remaining large items, whereas Dynamic Programming explores all subsets to achieve the optimal payload.\n          </p>\n        </div>\n      </div>\n    </section>\n\n    <!-- Footer Link to Finale Interactive Video -->\n    <div class=\"glass-card p-5 flex items-center justify-between flex-wrap gap-4 border-sky-500/30\">\n      <div class=\"space-y-0.5\">\n        <span class=\"text-[10px] font-mono font-bold text-sky-400 uppercase tracking-wider\">Next & Final Segment</span>\n        <h4 class=\"text-base font-extrabold text-white\">Slide 14: Immersive Interactive Video</h4>\n      </div>\n      <button onclick=\"window.parent.postMessage({ type: 'GOTO_TOPIC', index: 13 }, '*')\"\n              class=\"px-5 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-xs sm:text-sm shadow-lg shadow-sky-500/25 transition-all flex items-center gap-2\">\n        <span>Watch Immersive Video Finale →</span>\n      </button>\n    </div>\n\n  </main>\n</body>\n</html>\n"},{"id":14,"tag":"Video Finale","title":"Immersive Interactive Video: Algorithm In Action","shortTitle":"Interactive Video","subtitle":"Dynamic Offline-Ready Video Simulation of Greedy Concepts","badge":"Video Finale","file":"interactive-video.html","preferSrc":true,"content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <title>Immersive Interactive Video · Group 2 Finale</title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n  <script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n  <style>\n    :root {\n      --font-mono: 'JetBrains Mono', ui-monospace, monospace;\n      --primary: #38bdf8;\n      --emerald: #10b981;\n    }\n    * {\n      box-sizing: border-box;\n    }\n    html, body {\n      background: #090d16;\n      color: #f1f5f9;\n      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;\n      min-height: 100%;\n      overflow-x: hidden;\n      overflow-y: auto !important;\n      -webkit-overflow-scrolling: touch;\n      background: radial-gradient(1200px 600px at 10% -10%, rgba(16, 185, 129, 0.12), transparent 60%),\n                  radial-gradient(900px 500px at 90% 10%, rgba(56, 189, 248, 0.12), transparent 55%),\n                  radial-gradient(800px 600px at 50% 100%, rgba(139, 92, 246, 0.12), transparent 60%),\n                  linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px) 0 0/48px 48px,\n                  linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px) 0 0/48px 48px,\n                  #090d16;\n      background-attachment: fixed;\n    }\n\n    .glass-panel {\n      background: linear-gradient(135deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.9));\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      border: 1px solid rgba(255, 255, 255, 0.08);\n      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);\n      border-radius: 1.25rem;\n    }\n\n    .video-glow-wrapper {\n      position: relative;\n      border-radius: 1rem;\n      background: #000;\n      box-shadow: 0 0 40px rgba(56, 189, 248, 0.15), 0 20px 40px -10px rgba(0, 0, 0, 0.7);\n      border: 1px solid rgba(56, 189, 248, 0.25);\n      overflow: hidden;\n    }\n\n    .video-glow-wrapper::before {\n      content: '';\n      position: absolute;\n      inset: -2px;\n      border-radius: 1.1rem;\n      background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(16, 185, 129, 0.2), rgba(139, 92, 246, 0.3));\n      z-index: -1;\n      opacity: 0.6;\n    }\n\n    .ctrl-btn {\n      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);\n    }\n    .ctrl-btn:hover {\n      transform: translateY(-1px);\n      background: rgba(255, 255, 255, 0.12);\n    }\n    .ctrl-btn:active {\n      transform: scale(0.97);\n    }\n\n    .speed-chip {\n      font-family: var(--font-mono);\n      font-size: 0.75rem;\n      padding: 0.25rem 0.6rem;\n      border-radius: 9999px;\n      border: 1px solid rgba(255, 255, 255, 0.1);\n      background: rgba(15, 23, 42, 0.6);\n      color: #94a3b8;\n      cursor: pointer;\n      transition: all 0.2s ease;\n    }\n    .speed-chip.active {\n      background: #38bdf8;\n      color: #0f172a;\n      font-weight: 800;\n      border-color: #38bdf8;\n      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);\n    }\n\n    /* Custom video player styling */\n    video {\n      width: 100%;\n      height: 100%;\n      object-fit: contain;\n      background: #000;\n      outline: none;\n    }\n\n    /* Range slider custom styling */\n    input[type=range] {\n      -webkit-appearance: none;\n      background: rgba(255, 255, 255, 0.1);\n      border-radius: 9999px;\n      height: 6px;\n      outline: none;\n    }\n    input[type=range]::-webkit-slider-thumb {\n      -webkit-appearance: none;\n      width: 14px;\n      height: 14px;\n      border-radius: 50%;\n      background: #38bdf8;\n      cursor: pointer;\n      box-shadow: 0 0 8px #38bdf8;\n    }\n  </style>\n</head>\n<body class=\"p-3 sm:p-6 lg:p-8\">\n\n  <main class=\"max-w-5xl mx-auto space-y-6\">\n\n    <!-- Top Slide Header -->\n    <header class=\"glass-panel p-5 sm:p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-sky-500/30\">\n      <div class=\"space-y-1\">\n        <div class=\"flex items-center gap-2\">\n          <span class=\"px-2.5 py-0.5 rounded-full text-[10px] font-mono font-black uppercase tracking-widest bg-sky-500/20 text-sky-400 border border-sky-500/30\">\n            Slide 14 · Grand Finale\n          </span>\n          <span class=\"px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5\">\n            <span class=\"w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse\"></span> Offline Ready\n          </span>\n        </div>\n        <h1 class=\"text-xl sm:text-2xl lg:text-3xl font-extrabold text-white tracking-tight\">\n          Immersive Interactive Video Presentation\n        </h1>\n        <p class=\"text-xs sm:text-sm text-slate-300\">\n          Visualizing Greedy Algorithms, Heuristic Selection & Optimal Substructure in Action\n        </p>\n      </div>\n\n      <div class=\"flex items-center gap-2 self-stretch md:self-auto justify-end flex-wrap\">\n        <a href=\"Immersive-Interactive-Warm-SnapYT.App.mp4\" download=\"Immersive-Interactive-Warm-SnapYT.App.mp4\"\n           class=\"px-3.5 py-2 rounded-xl text-xs font-bold text-slate-300 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 transition-all flex items-center gap-1.5 shadow-sm\">\n          <svg class=\"w-4 h-4 text-sky-400\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n            <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4\"></path>\n          </svg>\n          <span>Download Video</span>\n        </a>\n        <button onclick=\"openStandalone()\"\n                class=\"px-3.5 py-2 rounded-xl text-xs font-bold text-sky-300 bg-sky-950/60 hover:bg-sky-900/60 border border-sky-500/30 transition-all flex items-center gap-1.5 shadow-sm\">\n          <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n            <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14\"></path>\n          </svg>\n          <span>Pop-out Window</span>\n        </button>\n      </div>\n    </header>\n\n    <!-- Main Video Player Stage -->\n    <div class=\"glass-panel p-3 sm:p-5 space-y-4\">\n      \n      <!-- Video Element Container (16:9 ratio responsive) -->\n      <div class=\"video-glow-wrapper aspect-video w-full flex items-center justify-center relative\">\n        <video id=\"main-video\" controls playsinline preload=\"auto\">\n          <source src=\"Immersive-Interactive-Warm-SnapYT.App.mp4\" type=\"video/mp4\">\n          <source src=\"./Immersive-Interactive-Warm-SnapYT.App.mp4\" type=\"video/mp4\">\n          <p class=\"text-xs text-rose-400 p-4 text-center\">\n            Your browser does not support the HTML5 video element. You can \n            <a href=\"Immersive-Interactive-Warm-SnapYT.App.mp4\" class=\"underline text-sky-400\" download>download the video directly</a>.\n          </p>\n        </video>\n      </div>\n\n      <!-- Interactive Enhanced Playback Controls & Utility Bar -->\n      <div class=\"p-3 sm:p-4 rounded-xl bg-slate-900/70 border border-white/5 flex flex-wrap items-center justify-between gap-3\">\n        \n        <!-- Left: Quick Seek & Play Controls -->\n        <div class=\"flex items-center gap-2\">\n          <button onclick=\"togglePlay()\" id=\"btn-play-toggle\"\n                  class=\"ctrl-btn px-4 py-2 rounded-lg bg-sky-500/20 hover:bg-sky-500/30 border border-sky-500/40 text-sky-300 font-bold text-xs sm:text-sm flex items-center gap-2\">\n            <span id=\"play-icon\">▶</span>\n            <span id=\"play-text\">Play</span>\n          </button>\n          \n          <button onclick=\"seekRel(-10)\" title=\"Rewind 10 seconds\"\n                  class=\"ctrl-btn px-2.5 py-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white border border-white/10 text-xs font-mono font-bold\">\n            ↺ -10s\n          </button>\n          <button onclick=\"seekRel(10)\" title=\"Forward 10 seconds\"\n                  class=\"ctrl-btn px-2.5 py-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white border border-white/10 text-xs font-mono font-bold\">\n            +10s ↻\n          </button>\n\n          <!-- Current Time Display -->\n          <div class=\"hidden sm:flex items-center text-xs font-mono text-slate-400 pl-2\">\n            <span id=\"time-current\">00:00</span>\n            <span class=\"mx-1\">/</span>\n            <span id=\"time-duration\">--:--</span>\n          </div>\n        </div>\n\n        <!-- Middle: Speed Multiplier Controls -->\n        <div class=\"flex items-center gap-1.5 flex-wrap\">\n          <span class=\"text-[11px] font-bold text-slate-400 uppercase tracking-wider mr-1 hidden sm:inline\">Speed:</span>\n          <button class=\"speed-chip\" onclick=\"setSpeed(0.75, this)\">0.75x</button>\n          <button class=\"speed-chip active\" onclick=\"setSpeed(1.0, this)\">1x</button>\n          <button class=\"speed-chip\" onclick=\"setSpeed(1.25, this)\">1.25x</button>\n          <button class=\"speed-chip\" onclick=\"setSpeed(1.5, this)\">1.5x</button>\n          <button class=\"speed-chip\" onclick=\"setSpeed(2.0, this)\">2x</button>\n        </div>\n\n        <!-- Right: Theater / Fullscreen & Replay -->\n        <div class=\"flex items-center gap-2\">\n          <button onclick=\"restartVideo()\" title=\"Restart Video from Beginning\"\n                  class=\"ctrl-btn px-3 py-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white border border-white/10 text-xs font-semibold flex items-center gap-1.5\">\n            <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n              <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15\"></path>\n            </svg>\n            <span class=\"hidden sm:inline\">Restart</span>\n          </button>\n          \n          <button onclick=\"toggleVideoFullscreen()\" title=\"Toggle Fullscreen\"\n                  class=\"ctrl-btn px-3.5 py-2 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/30 text-emerald-300 text-xs font-bold flex items-center gap-1.5\">\n            <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n              <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4\"></path>\n            </svg>\n            <span>Fullscreen</span>\n          </button>\n        </div>\n\n      </div>\n\n    </div>\n\n    <!-- Presentation Summary & Companion Notes -->\n    <div class=\"grid md:grid-cols-3 gap-4\">\n      \n      <!-- Card 1 -->\n      <div class=\"glass-panel p-4 space-y-2 border-sky-500/20\">\n        <div class=\"flex items-center gap-2 text-sky-400\">\n          <span class=\"w-6 h-6 rounded-lg bg-sky-500/20 flex items-center justify-center font-mono font-bold text-xs\">01</span>\n          <h3 class=\"font-extrabold text-sm text-white\">Visual Intuition</h3>\n        </div>\n        <p class=\"text-xs text-slate-300 leading-relaxed\">\n          Witness how the greedy choice property operates in dynamic time. Every decision irrevocably locks in the immediate optimal selection, drastically simplifying the solution space.\n        </p>\n      </div>\n\n      <!-- Card 2 -->\n      <div class=\"glass-panel p-4 space-y-2 border-emerald-500/20\">\n        <div class=\"flex items-center gap-2 text-emerald-400\">\n          <span class=\"w-6 h-6 rounded-lg bg-emerald-500/20 flex items-center justify-center font-mono font-bold text-xs\">02</span>\n          <h3 class=\"font-extrabold text-sm text-white\">Earliest Finish Time</h3>\n        </div>\n        <p class=\"text-xs text-slate-300 leading-relaxed\">\n          Observe how picking the activity that ends first frees up maximum room for the remaining schedule, mathematically matching the induction proof from Topic 07.\n        </p>\n      </div>\n\n      <!-- Card 3 -->\n      <div class=\"glass-panel p-4 space-y-2 border-purple-500/20\">\n        <div class=\"flex items-center gap-2 text-purple-400\">\n          <span class=\"w-6 h-6 rounded-lg bg-purple-500/20 flex items-center justify-center font-mono font-bold text-xs\">03</span>\n          <h3 class=\"font-extrabold text-sm text-white\">Offline Self-Contained</h3>\n        </div>\n        <p class=\"text-xs text-slate-300 leading-relaxed\">\n          This video file (<code class=\"text-sky-300 font-mono text-[11px]\">Immersive-Interactive-Warm-SnapYT.App.mp4</code>) is packaged directly in the presentation directory with zero internet dependencies.\n        </p>\n      </div>\n\n    </div>\n\n    <!-- Bottom Navigation Controls -->\n    <footer class=\"glass-panel p-4 sm:p-5 flex items-center justify-between flex-wrap gap-4 border-white/10\">\n      <button onclick=\"goToSlide(12)\"\n              class=\"px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-white/10 text-xs sm:text-sm font-bold flex items-center gap-2 transition-all\">\n        <span>← Back to Master Answer Key</span>\n      </button>\n\n      <div class=\"flex items-center gap-2\">\n        <button onclick=\"goToSlide(0)\"\n                class=\"px-4 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-xs sm:text-sm shadow-lg shadow-sky-500/25 transition-all flex items-center gap-2\">\n          <span>↺ Restart Presentation (Topic 01)</span>\n        </button>\n      </div>\n    </footer>\n\n  </main>\n\n  <script>\n    const video = document.getElementById('main-video');\n    const btnPlay = document.getElementById('btn-play-toggle');\n    const playIcon = document.getElementById('play-icon');\n    const playText = document.getElementById('play-text');\n    const timeCurrent = document.getElementById('time-current');\n    const timeDuration = document.getElementById('time-duration');\n\n    function formatTime(seconds) {\n      if (isNaN(seconds) || seconds < 0) return '00:00';\n      const m = Math.floor(seconds / 60);\n      const s = Math.floor(seconds % 60);\n      return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);\n    }\n\n    // Video Event Listeners\n    video.addEventListener('timeupdate', () => {\n      timeCurrent.textContent = formatTime(video.currentTime);\n      if (!isNaN(video.duration)) {\n        timeDuration.textContent = formatTime(video.duration);\n      }\n    });\n\n    video.addEventListener('loadedmetadata', () => {\n      timeDuration.textContent = formatTime(video.duration);\n    });\n\n    video.addEventListener('play', () => {\n      playIcon.textContent = '⏸';\n      playText.textContent = 'Pause';\n      btnPlay.classList.add('bg-sky-500/40');\n    });\n\n    video.addEventListener('pause', () => {\n      playIcon.textContent = '▶';\n      playText.textContent = 'Play';\n      btnPlay.classList.remove('bg-sky-500/40');\n    });\n\n    function togglePlay() {\n      if (video.paused || video.ended) {\n        video.play().catch(e => console.log('Playback prevented:', e));\n      } else {\n        video.pause
