\n\n      const outcomeBox = document.getElementById('s2-outcome-box');\n      const prevBtn = document.getElementById('btn-s2-prev');\n      const nextBtn = document.getElementById('btn-s2-next');\n      const indicator = document.getElementById('s2-step-indicator');\n\n      if (s2Step === 1) {\n        outcomeBox.style.display = 'block';\n        document.getElementById('s2-a2-s').classList.add('cell-selected');\n        document.getElementById('s2-a2-f').classList.add('cell-selected');\n        document.getElementById('s2-a3-s').classList.add('cell-selected');\n        document.getElementById('s2-a3-f').classList.add('cell-selected');\n        document.getElementById('s2-a1-s').classList.add('cell-skipped');\n        document.getElementById('s2-a1-f').classList.add('cell-skipped');\n        indicator.textContent = \"Step 2 / 2\";\n      } else {\n        outcomeBox.style.display = 'none';\n        document.getElementById('s2-a2-s').classList.remove('cell-selected');\n        document.getElementById('s2-a2-f').classList.remove('cell-selected');\n        document.getElementById('s2-a3-s').classList.remove('cell-selected');\n        document.getElementById('s2-a3-f').classList.remove('cell-selected');\n        document.getElementById('s2-a1-s').classList.remove('cell-skipped');\n        document.getElementById('s2-a1-f').classList.remove('cell-skipped');\n        indicator.textContent = \"Step 1 / 2\";\n      }\n\n      prevBtn.disabled = (s2Step === 0);\n      nextBtn.disabled = (s2Step === s2Max);\n    }\n\n    // ================= SLIDE 4: STEP 1 DYNAMIC SORTING TABLE (TWO TABLES) =================\n    let s3SortedVisible = false;\n\n    function populateStep1Inputs() {\n      for (let i = 0; i < currentActivities.length; i++) {\n        const sEl = document.getElementById(`inp-start-${i}`);\n        const fEl = document.getElementById(`inp-finish-${i}`);\n        if (sEl) sEl.value = currentActivities[i].start;\n        if (fEl) fEl.value = currentActivities[i].finish;\n      }\n    }\n\n    function onStep1InputChange() {\n      for (let i = 0; i < currentActivities.length; i++) {\n        const sEl = document.getElementById(`inp-start-${i}`);\n        const fEl = document.getElementById(`inp-finish-${i}`);\n        if (!sEl || !fEl) continue;\n        const sVal = parseInt(sEl.value, 10);\n        const fVal = parseInt(fEl.value, 10);\n        currentActivities[i].start = isNaN(sVal) ? 0 : Math.max(0, sVal);\n        currentActivities[i].finish = isNaN(fVal) ? currentActivities[i].start : Math.max(0, fVal);\n      }\n      computeSortedAndTracingData();\n      if (s3SortedVisible) {\n        renderSortedTableData();\n      }\n    }\n\n    function renderSortedTableData() {\n      for (let i = 0; i < sortedActivities.length; i++) {\n        const actEl = document.getElementById(`s3-sort-act-${i}`);\n        const startEl = document.getElementById(`s3-sort-start-${i}`);\n        const finishEl = document.getElementById(`s3-sort-finish-${i}`);\n        if (actEl) actEl.textContent = sortedActivities[i].id;\n        if (startEl) startEl.textContent = sortedActivities[i].start;\n        if (finishEl) finishEl.textContent = sortedActivities[i].finish;\n      }\n      const expEl = document.getElementById('s3-sorted-explanation');\n      if (expEl) {\n        expEl.innerHTML = `Activities are ordered in non-decreasing order of finish times: <strong>${sortedActivities.map(a => `${a.id}(${a.finish})`).join(' &le; ')}</strong>. These values are passed to <strong>Step 2 & 3 Tracing</strong>.`;\n      }\n    }\n\n    function sortStep1Activities() {\n      computeSortedAndTracingData();\n      renderSortedTableData();\n      const sortedCard = document.getElementById('s3-sorted-card');\n      const sortBtn = document.getElementById('btn-s3-sort');\n      if (sortedCard) {\n        sortedCard.style.display = 'block';\n        s3SortedVisible = true;\n      }\n      if (sortBtn) {\n        sortBtn.innerHTML = '✓ Re-sort ▶';\n      }\n      const noteEl = document.getElementById('s3-info-note');\n      if (noteEl) {\n        noteEl.innerHTML = 'Activities sorted by finish time! See the sorted table below. Proceed to <strong>Slide 5</strong> to trace the algorithm.';\n      }\n    }\n\n    function stepSortingTable(delta) {\n      if (delta > 0) {\n        sortStep1Activities();\n      } else {\n        const sortedCard = document.getElementById('s3-sorted-card');\n        const sortBtn = document.getElementById('btn-s3-sort');\n        if (sortedCard) {\n          sortedCard.style.display = 'none';\n          s3SortedVisible = false;\n        }\n        if (sortBtn) {\n          sortBtn.innerHTML = 'Sort Activities ▶';\n        }\n        const noteEl = document.getElementById('s3-info-note');\n        if (noteEl) {\n          noteEl.innerHTML = 'You can edit the Start and Finish times in the table above. Click <strong>Sort Activities ▶</strong> to view the sorted activities table below.';\n        }\n      }\n    }\n\n    function resetStep1ToDefaults() {\n      currentActivities = JSON.parse(JSON.stringify(DEFAULT_ACTIVITIES));\n      populateStep1Inputs();\n      computeSortedAndTracingData();\n      const sortedCard = document.getElementById('s3-sorted-card');\n      const sortBtn = document.getElementById('btn-s3-sort');\n      if (sortedCard) {\n        sortedCard.style.display = 'none';\n        s3SortedVisible = false;\n      }\n      if (sortBtn) {\n        sortBtn.innerHTML = 'Sort Activities ▶';\n      }\n      const noteEl = document.getElementById('s3-info-note');\n      if (noteEl) {\n        noteEl.innerHTML = 'Values reset to default. Click <strong>Sort Activities ▶</strong> to view the sorted activities table below.';\n      }\n    }\n\n    // ================= COMPUTE SORTING & DYNAMIC SLIDE 5 TRACING =================\n    function computeSortedAndTracingData() {\n      // 1. Sort activities by finish time\n      sortedActivities = JSON.parse(JSON.stringify(currentActivities));\n      sortedActivities.sort((a, b) => {\n        if (a.finish !== b.finish) return a.finish - b.finish;\n        return a.start - b.start;\n      });\n\n      // 2. Compute Greedy Steps\n      traceData = [];\n      let lastFinish = 0;\n      let selectedActivities = [];\n      let selectedIndices = [];\n\n      for (let j = 0; j < sortedActivities.length; j++) {\n        const act = sortedActivities[j];\n        if (j === 0) {\n          lastFinish = act.finish;\n          selectedActivities.push(act.id);\n          selectedIndices.push(j);\n          traceData.push({\n            step: 0,\n            act: act.id,\n            start: act.start,\n            finish: act.finish,\n            check: \"First activity\",\n            decision: \"select\",\n            lastFinish: lastFinish,\n            note: `Step 0: ${act.id} selected as base activity with earliest finish time. last_finish = ${lastFinish}.`\n          });\n        } else {\n          const compatible = (act.start >= lastFinish);\n          if (compatible) {\n            lastFinish = act.finish;\n            selectedActivities.push(act.id);\n            selectedIndices.push(j);\n            traceData.push({\n              step: j,\n              act: act.id,\n              start: act.start,\n              finish: act.finish,\n              check: `${act.start} &ge; ${traceData[j-1].lastFinish}? Yes`,\n              decision: \"select\",\n              lastFinish: lastFinish,\n              note: `Step ${j}: ${act.id} start (${act.start}) &ge; last_finish (${traceData[j-1].lastFinish}) &rarr; Compatible! Select ${act.id}. last_finish = ${lastFinish}.`\n            });\n          } else {\n            traceData.push({\n              step: j,\n              act: act.id,\n              start: act.start,\n              finish: act.finish,\n              check: `${act.start} &ge; ${lastFinish}? No`,\n              decision: \"skip\",\n              lastFinish: lastFinish,\n              note: `Step ${j}: ${act.id} start (${act.start}) &lt; last_finish (${lastFinish}) &rarr; Overlaps! Skip ${act.id}. last_finish stays ${lastFinish}.`\n            });\n          }\n        }\n      }\n\n      traceMax = sortedActivities.length - 1;\n\n      // 3. Render Slide 5 Reference Bar\n      const sortedBar = document.getElementById('slide4-sorted-bar');\n      sortedBar.innerHTML = sortedActivities.map((a, idx) => `<span style=\"color: #67e8f9;\">[${idx}] ${a.id}(${a.start},${a.finish})</span>`).join(' ');\n\n      // 4. Render Slide 5 Tracing Table Rows\n      const tableBody = document.getElementById('traceTableBodyDynamic');\n      tableBody.innerHTML = '';\n      for (let i = 0; i < traceData.length; i++) {\n        const d = traceData[i];\n        const tr = document.createElement('tr');\n        tr.id = `trow-${i}`;\n        tr.className = (i === 0) ? 'active-trace-row' : 'hidden-trace-row';\n        tr.onclick = () => jumpToTraceStep(i);\n\n        const badgeClass = (d.decision === 'select') ? 'badge-pill badge-select' : 'badge-pill badge-skip';\n        const badgeText = (d.decision === 'select') ? 'Select' : 'Skip';\n        const finishColor = (d.decision === 'select') ? 'var(--cyan)' : 'var(--text-muted)';\n\n        tr.innerHTML = `\n          <td style=\"font-weight: 800; color: var(--cyan);\">${d.step}</td>\n          <td><strong style=\"color: #ffffff;\">${d.act}</strong> (${d.start}, ${d.finish})</td>\n          <td>${d.check}</td>\n          <td><span class=\"${badgeClass}\">${badgeText}</span></td>\n          <td><strong style=\"color: ${finishColor}; font-size: 0.98rem;\">${d.lastFinish}</strong></td>\n        `;\n        tableBody.appendChild(tr);\n      }\n\n      // Summary text\n      document.getElementById('traceSummaryText').innerHTML = `\n        Total activities performed: <strong style=\"color: #ffffff;\">${selectedActivities.join(', ')}: ${selectedActivities.length} Activities</strong> | Index: <code style=\"color: var(--cyan); font-weight: bold;\">${selectedIndices.join(', ')}</code>\n      `;\n\n      // 5. Render Timeline\n      renderDynamicTimeline();\n\n      // Reset trace step\n      traceStep = 0;\n      syncTracingState(0);\n    }\n\n    function renderDynamicTimeline() {\n      const maxFinish = Math.max(...sortedActivities.map(a => a.finish), 10);\n      const maxTime = Math.max(10, Math.ceil(maxFinish + (maxFinish % 2 === 0 ? 1 : 2)));\n\n      // Render Time Axis\n      const timeAxis = document.getElementById('timelineTimeAxis');\n      timeAxis.innerHTML = '';\n      for (let t = 0; t <= maxTime; t++) {\n        const tick = document.createElement('div');\n        tick.className = 'axis-tick';\n        tick.innerHTML = `<span>${t}</span>`;\n        timeAxis.appendChild(tick);\n      }\n\n      // Render Grid Lines\n      const gridLines = document.getElementById('timelineGridLines');\n      gridLines.innerHTML = '';\n      for (let t = 0; t <= maxTime; t++) {\n        const gl = document.createElement('div');\n        gl.className = 'grid-line';\n        gl.style.left = `${(t / maxTime) * 100}%`;\n        gridLines.appendChild(gl);\n      }\n\n      // Render Activity Rows\n      const rowsContainer = document.getElementById('timelineActivityRows');\n      rowsContainer.innerHTML = '';\n      for (let i = 0; i < sortedActivities.length; i++) {\n        const act = sortedActivities[i];\n        const row = document.createElement('div');\n        row.className = 'plot-row';\n\n        const leftPct = (act.start / maxTime) * 100;\n        const widthPct = Math.max(1.5, ((act.finish - act.start) / maxTime) * 100);\n\n        row.innerHTML = `\n          <span class=\"plot-row-label\">${act.id} (${act.start},${act.finish})</span>\n          <div class=\"plot-bar-track\">\n            <div class=\"interval-bar bar-idle\" id=\"bar-${act.id}\" style=\"left: ${leftPct}%; width: ${widthPct}%;\">\n              ${act.id} [${act.start}-${act.finish}]\n            </div>\n          </div>\n        `;\n        rowsContainer.appendChild(row);\n      }\n    }\n\n    // ================= SLIDE 5: TRACING TABLE CONTROLS =================\n    function stepTracingTable(delta) {\n      const newStep = Math.max(0, Math.min(traceMax, traceStep + delta));\n      syncTracingState(newStep);\n    }\n\n    function resetTracingTable() {\n      syncTracingState(0);\n    }\n\n    function jumpToTraceStep(stepIdx) {\n      syncTracingState(stepIdx);\n    }\n\n    function syncTracingState(stepIndex) {\n      traceStep = stepIndex;\n\n      // Update in-table controls\n      document.getElementById('trace-step-indicator').textContent = `Step ${stepIndex} / ${traceMax}`;\n      document.getElementById('btn-trace-prev').disabled = (traceStep === 0);\n      document.getElementById('btn-trace-next').disabled = (traceStep === traceMax);\n      document.getElementById('btn-trace-reset').disabled = (traceStep === 0);\n\n      // Table row visibility\n      for (let i = 0; i <= traceMax; i++) {\n        const row = document.getElementById(`trow-${i}`);\n        if (!row) continue;\n        if (i <= stepIndex) {\n          row.classList.remove('hidden-trace-row');\n          if (i === stepIndex) row.classList.add('active-trace-row');\n          else row.classList.remove('active-trace-row');\n        } else {\n          row.classList.add('hidden-trace-row');\n          row.classList.remove('active-trace-row');\n        }\n      }\n\n      // Synchronize Timeline Comparison\n      if (traceData.length > 0) {\n        const current = traceData[stepIndex];\n        document.getElementById('liveStatusExplanation').innerHTML = current.note;\n\n        const maxFinish = Math.max(...sortedActivities.map(a => a.finish), 10);\n        const maxTime = Math.max(10, Math.ceil(maxFinish + (maxFinish % 2 === 0 ? 1 : 2)));\n\n        const marker = document.getElementById('timelineMarker');\n        const timeRatio = current.lastFinish / maxTime;\n        marker.style.left = `calc(65px + (100% - 79px) * ${timeRatio})`;\n        marker.setAttribute('data-val', current.lastFinish);\n\n        // Interval Bars\n        for (let i = 0; i <= traceMax; i++) {\n          const item = traceData[i];\n          const bar = document.getElementById(`bar-${item.act}`);\n          if (!bar) continue;\n\n          if (i <= stepIndex) {\n            if (item.decision === 'select') {\n              bar.className = 'interval-bar bar-chosen';\n              bar.textContent = `${item.act} [${item.start}-${item.finish}] ✓`;\n            } else {\n              bar.className = 'interval-bar bar-rejected';\n              bar.textContent = `${item.act} [${item.start}-${item.finish}] ✕`;\n            }\n          } else {\n            bar.className = 'interval-bar bar-idle';\n            bar.textContent = `${item.act} [${item.start}-${item.finish}]`;\n          }\n        }\n\n        // Schedule pills\n        const tokenContainer = document.getElementById('liveSelectedTokens');\n        let tokenHtml = '';\n        for (let i = 0; i <= stepIndex; i++) {\n          if (traceData[i].decision === 'select') {\n            tokenHtml += `<span style=\"background: rgba(16, 185, 129, 0.25); color: var(--emerald-light); padding: 2px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: 700; border: 1px solid rgba(16, 185, 129, 0.4);\">${traceData[i].act} [${traceData[i].start} &rarr; ${traceData[i].finish}]</span>`;\n          }\n        }\n        tokenContainer.innerHTML = tokenHtml;\n\n        // Completion Card\n        const compCard = document.getElementById('trace-completion-card');\n        if (stepIndex === traceMax) {\n          compCard.style.display = 'block';\n        } else {\n          compCard.style.display = 'none';\n        }\n      }\n    }\n\n    // Fullscreen Toggle\n    function togglePresentationFullscreen() {\n      if (!document.fullscreenElement) {\n        document.documentElement.requestFullscreen().catch(() => {});\n      } else {\n        if (document.exitFullscreen) {\n          document.exitFullscreen();\n        }\n      }\n    }\n\n    // Keyboard Shortcuts\n    function setupKeyListeners() {\n      window.addEventListener('keydown', (e) => {\n        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;\n\n        if (e.code === 'Space' || e.key === 'ArrowRight' || e.key === 'PageDown') {\n          e.preventDefault();\n          proceedNextSlide();\n        }\n        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {\n          e.preventDefault();\n          proceedPrevSlide();\n        }\n        // In-table stepping shortcuts\n        else if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') {\n          e.preventDefault();\n          if (activeSlideIndex === 1) stepExampleTable(1);\n          else if (activeSlideIndex === 3) stepSortingTable(1);\n          else if (activeSlideIndex === 4) stepTracingTable(1);\n        }\n        else if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {\n          e.preventDefault();\n          if (activeSlideIndex === 1) stepExampleTable(-1);\n          else if (activeSlideIndex === 3) stepSortingTable(-1);\n          else if (activeSlideIndex === 4) stepTracingTable(-1);\n        }\n        else if (e.key.toLowerCase() === 'r') {\n          if (activeSlideIndex === 4) {\n            e.preventDefault();\n            resetTracingTable();\n          } else if (activeSlideIndex === 3) {\n            e.preventDefault();\n            resetStep1ToDefaults();\n          }\n        }\n        else if (e.key.toLowerCase() === 'f') {\n          togglePresentationFullscreen();\n        }\n      });\n    }\n\n    window.addEventListener('DOMContentLoaded', () => {\n      initDeck();\n    });\n  <\/script>\n</body>\n</html>\n"},{"id":6,"tag":"Topic 06","title":"Activity Selection Time Complexity","shortTitle":"Time Complexity","subtitle":"Asymptotic Analysis: Sorting O(n log n) vs Scan O(n)","badge":"Analysis","file":"activity_selection_time_complexity.html","content":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Topic 5 · Activity Selection Time Complexity</title>\n<style>\n:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;color:#253047;background:#f5f7fb;font-synthesis:none;--ink:#253047;--muted:#707c91;--line:#e4e9f1;--purple:#7149e8;--purple-light:#f0ecff;--mint:#19a88b;--mint-light:#e8f8f5;--coral:#e67965;--shadow:0 12px 35px #2530470c;--meta:140px}\n*{box-sizing:border-box}\nbody{margin:0;background:radial-gradient(ellipse at top left,#f1eaff 0,transparent 35%),#f5f7fb;color:var(--ink);line-height:1.55}\n.lesson{width:min(1120px,calc(100% - 36px));margin:48px auto 72px}\n.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--purple)}\nh1{font-size:clamp(2rem,4vw,3.1rem);letter-spacing:-.045em;line-height:1.1;margin:.45rem 0 1rem}\n.lead{font-size:1.1rem;color:#59667c;max-width:740px;margin:0 0 28px}\n.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}\n.card h2{font-size:1.1rem;margin:0 0 14px;letter-spacing:-.02em}\n.card p{color:#5c687c;margin:.5rem 0}\n.context{grid-column:1/-1;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center}\n.context ul{margin:.65rem 0;padding-left:1.2rem;color:#5c687c}\n.context li+li{margin-top:8px}\n.rule{background:#f4f0ff;border:1px solid #e8dfff;padding:17px 18px;border-radius:16px;color:#443276;font-weight:650}\n.rule strong{color:var(--purple)}\n.rule code{font:700 .9rem ui-monospace,SFMono-Regular,Consolas,monospace;background:#fff;padding:2px 6px;border-radius:6px;color:#5a35d6;white-space:nowrap}\n.code-card{padding:0;overflow:hidden;background:#171b2d;border-color:#171b2d;color:#f4f4fa}\n.code-head{display:flex;align-items:center;justify-content:space-
