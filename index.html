x}\n.preset-btn:hover{background:#e0e4f0}\n.preset-btn.on{background:var(--purple-light);color:#6540d6;box-shadow:inset 0 0 0 1.5px #cfc2fa}\n.add-button{background:var(--purple-light);color:#6540d6;padding:10px 14px;white-space:nowrap}\n.timeline-container{position:relative;margin-top:20px}\n.axis{display:flex;justify-content:space-between;color:#8a94a6;font-size:.72rem;margin-bottom:8px;padding:0 0 0 calc(var(--meta) + 12px);user-select:none}\n.cutoff-line{position:absolute;top:24px;bottom:0;width:2px;background:#7149e8;border-right:2px dashed #9a7aef;z-index:3;transition:left .3s cubic-bezier(.4,0,.2,1);pointer-events:none}\n.cutoff-badge{position:absolute;top:-20px;transform:translateX(-50%);background:var(--purple);color:#fff;font-size:.65rem;font-weight:800;padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 6px #7149e844}\n.ride-list{display:grid;gap:10px}\n.ride-row{display:grid;grid-template-columns:var(--meta) 1fr;gap:12px;align-items:center}\n.ride-meta{display:flex;align-items:center;justify-content:space-between}\n.ride-name{font-weight:750;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.delete-btn{background:transparent;border:0;color:#a0aab8;cursor:pointer;font-size:.9rem;padding:2px 6px;border-radius:4px;line-height:1}\n.delete-btn:hover{color:var(--coral);background:#fce8e4}\n.track{position:relative;height:36px;border-radius:10px;background:repeating-linear-gradient(90deg,#f2f4f8 0,#f2f4f8 calc(12.5% - 1px),#e5e9f0 calc(12.5% - 1px),#e5e9f0 12.5%);overflow:hidden}\n.bar{position:absolute;top:5px;height:26px;border-radius:8px;background:#c7cbd5;color:#50596b;font-size:.72rem;line-height:26px;text-align:center;font-weight:800;white-space:nowrap;overflow:hidden;transition:all .32s cubic-bezier(.4,0,.2,1)}\n.bar.accepted{background:#8de0c9;color:#116c58}\n.bar.current{background:#9a7aef;color:#fff;box-shadow:0 3px 12px #7149e866;animation:pulse 1.25s infinite;z-index:2}\n.bar.rejected{background:#e4e6eb;color:#9aa1b0;opacity:.65}\n.bar.pending{background:#dfe3eb;color:#727b8a}\n.legend{display:flex;gap:17px;margin-top:15px;color:#748095;font-size:.77rem;flex-wrap:wrap}\n.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#8de0c9}\n.dot.purple{background:#9a7aef}.dot.gray{background:#c7cbd5}\n.trace-info{margin-top:18px;border-radius:14px;padding:16px 18px;background:#f7f8fc;border:1px solid var(--line);min-height:78px}\n.trace-info strong{display:block;margin-bottom:4px;font-size:.95rem}\n.trace-info p{margin:0;color:#647086;font-size:.88rem}\n.trace-info .why{margin-top:6px;font-size:.8rem;color:var(--purple);font-weight:650}\n.controls{display:flex;gap:9px;margin-top:16px;align-items:center;flex-wrap:wrap}\n.controls button{background:var(--purple-light);color:#6040c7;padding:10px 16px}\n.controls button.primary{background:var(--purple);color:#fff}\n.controls button:disabled{opacity:.43;cursor:not-allowed;transform:none}\n.hint{color:#9aa3b2;font-size:.72rem;font-weight:600}\n.progress{color:#8b94a4;font-size:.82rem;margin-left:auto;align-self:center;font-weight:600}\n.ride-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}\n.ride-chip{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:#f4f5f8;color:#59657a;font-size:.76rem;font-weight:600}\n.badge{border-radius:999px;padding:2px 8px;background:#e9ebf0;color:#687285;font-size:.68rem;font-weight:800}\n.badge.accepted{background:#d9f5eb;color:#148367}\n.badge.rejected{background:#fce8e4;color:#ba5d4e}\n.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}\n.stat-card{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center}\n.stat-card .val{font-size:1.25rem;font-weight:800;color:var(--purple)}\n.stat-card .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}\n.result{margin-top:18px;padding:14px 16px;background:var(--mint-light);border:1px solid #d6f0e8;border-radius:14px;color:#24745f;font-weight:700;font-size:.9rem}\n.modal{position:fixed;inset:0;background:#19203380;display:grid;place-items:center;padding:18px;z-index:10}\n.modal[hidden]{display:none}\n.dialog{width:min(430px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 25px 90px #10172b40}\n.dialog-head{display:flex;justify-content:space-between;align-items:center}\n.dialog h2{margin:0}\n.close{border:0;background:#f1f2f6;border-radius:9px;padding:7px 10px;cursor:pointer;font-size:1rem}\n.form-grid{display:grid;gap:13px;margin-top:19px}\n.form-grid label{font-size:.82rem;font-weight:750;color:#4d5970}\n.form-grid input{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid #dce1ea;border-radius:10px;font:inherit;color:var(--ink)}\n.form-grid input:focus{outline:3px solid #7149e833;border-color:var(--purple)}\n.form-error{color:#b84a42;font-size:.82rem;min-height:1.2em}\n.form-submit{background:var(--purple);color:#fff;padding:11px 15px;border-radius:10px;border:0;font-weight:750;cursor:pointer}\n@keyframes pulse{50%{filter:brightness(1.08);transform:scaleY(1.06)}}\n@media(max-width:760px){\n:root{--meta:110px}\n.layout{grid-template-columns:1fr}\n.context{grid-column:auto;grid-template-columns:1fr}\n.sim{grid-column:auto}\n.card{padding:19px}.code-card{padding:0}\n.sim-top{align-items:center}\n.progress{width:100%;margin:4px 0 0}\n.hint{display:none}\n.stats-bar{grid-template-columns:1fr}\n}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}\n</style>\n</head>\n<body>\n<main id=\"topic-5\" class=\"lesson\">\n  <div class=\"eyebrow\">Algorithms · Time Complexity</div>\n  <h1>How Fast is Activity Selection?</h1>\n  <p class=\"lead\">Why the Earliest-Finish-Time (EFT) greedy strategy is so fast: break the work into two simple steps, count the checks, and see why it beats testing every combination.</p>\n\n  <div class=\"layout\">\n    <!-- 1. CONTEXT -->\n    <section class=\"card context\" aria-labelledby=\"context-title\">\n      <div>\n        <h2 id=\"context-title\">⏱️ 1. Context · Why Speed Matters</h2>\n        <p>Imagine choosing the most non-overlapping activities for a day. How many steps does the computer need as the list of <strong>n</strong> activities grows?</p>\n        <ul>\n          <li><strong>The Slow Way (Brute Force · <code>O(2ⁿ)</code>):</strong> Tests every possible mix of activities. For just 30 activities, that's over <strong>1 billion</strong> checks!</li>\n          <li><strong>The Fast Way (Greedy EFT · <code>O(n log n)</code>):</strong> Sort by finish time once, then walk through the list a single time. For 30 activities, it takes only <strong>~180 steps</strong>.</li>\n        </ul>\n      </div>\n      <div class=\"rule\">\n        The Complexity Rule: <strong>Total Time = Sorting + One Quick Pass.</strong><br><br>\n        Sorting takes <code>O(n log n)</code> and the loop takes <code>O(n)</code>, giving <code>O(n log n)</code> overall. And if the list is <em>already sorted</em>, it takes just <code>O(n)</code>!\n      </div>\n    </section>\n\n    <!-- 2. METHOD (CODE) -->\n    <section class=\"card code-card\" aria-labelledby=\"code-title\">\n      <div class=\"code-head\">\n        <span id=\"code-title\">2. Method · Cost of Each Code Step</span>\n        <button id=\"copy-code\" type=\"button\" aria-label=\"Copy Python code\">Copy code</button>\n      </div>\n      <div class=\"code-wrap\">\n        <pre aria-label=\"Python implementation with time complexity comments\"><code id=\"code-block\"></code></pre>\n      </div>\n    </section>\n\n    <!-- 3. EVIDENCE / PROOF -->\n    <section class=\"card\" aria-labelledby=\"how-title\">\n      <h2 id=\"how-title\">🧭 3. Evidence &amp; Proof · Why <code>O(n log n)</code>?</h2>\n      <p>We can prove the time complexity by counting the work in the two parts of the code:</p>\n      <div class=\"proof-steps\">\n        <div class=\"proof-step\">\n          <strong><span>Step 1 · Sorting the list</span> <span class=\"tag\">O(n log n)</span></strong>\n          Putting <code>n</code> activities in order of finish time takes about <code>n × log₂(n)</code> comparisons. (Skip this if already sorted!)\n        </div>\n        <div class=\"proof-step\">\n          <strong><span>Step 2 · Scanning the list once</span> <span class=\"tag mint\">O(n)</span></strong>\n          The <code>for</code> loop checks each activity <strong>only once</strong> (<code>start &gt;= last_finish</code>). It never goes backward or re-checks earlier activities, so <code>n</code> items = <code>n</code> checks.\n        </div>\n        <div class=\"proof-step\">\n          <strong><span>Step 3 · Add them together</span> <span class=\"tag\">O(n log n) Total</span></strong>\n          <code>O(n log n) + O(n) = O(n log n)</code> because in Big-O we keep the biggest term that grows fastest.\n        </div>\n      </div>\n      <div class=\"result\" style=\"margin-top:12px\">\n        Example with numbers: For <strong>1,000</strong> activities, Sorting ≈ <strong>10,000</strong> steps + Scanning = <strong>1,000</strong> checks → Only <strong>11,000</strong> total steps!\n      </div>\n    </section>\n\n    <!-- 4. INTERACTIVE SIMULATOR & EXAMPLES -->\n    <section class=\"card sim\" aria-labelledby=\"sim-title\">\n      <div class=\"sim-top\">\n        <div>\n          <h2 id=\"sim-title\">🎢 4. Interactive Examples · Count the Steps Live</h2>\n          <p>Pick an example below and click <strong>Next step</strong> to watch the algorithm sort, scan, and count every operation.</p>\n        </div>\n        <button class=\"add-button\" id=\"open-form\" type=\"button\">＋ Add custom activity</button>\n      </div>\n\n      <div class=\"preset-bar\">\n        <span class=\"preset-label\">Examples:</span>\n        <button class=\"preset-btn on\" data-preset=\"unsorted\" type=\"button\">Example 1: Unsorted List (O(n log n))</button>\n        <button class=\"preset-btn\" data-preset=\"sorted\" type=\"button\">Example 2: Already Sorted (O(n) Fast Case)</button>\n        <button class=\"preset-btn\" data-preset=\"trap\" type=\"button\">Example 3: Many Overlaps (Still O(n) Scan!)</button>\n      </div>\n\n      <div class=\"timeline-container\" id=\"timeline\">\n        <div class=\"axis\" aria-hidden=\"true\">\n          <span>1 PM</span><span>2 PM</span><span>3 PM</span><span>4 PM</span><span>5 PM</span><span>6 PM</span><span>7 PM</span><span>8 PM</span><span>9 PM</span>\n        </div>\n        <div id=\"cutoff-line\" class=\"cutoff-line\" style=\"display:none\">\n          <div id=\"cutoff-badge\" class=\"cutoff-badge\">Last finish</div>\n        </div>\n        <div id=\"ride-list\" class=\"ride-list\" role=\"group\" aria-label=\"Activity schedule timeline from 1 PM to 9 PM\"></div>\n      </div>\n\n      <div class=\"legend\" aria-label=\"Timeline legend\">\n        <span><i class=\"dot purple\"></i>Checking Now (1 op)</span>\n        <span><i class=\"dot\"></i>Accepted</span>\n        <span><i class=\"dot gray\"></i>Skipped / Upcoming</span>\n      </div>\n\n      <div id=\"trace-info\" class=\"trace-info\" aria-live=\"polite\" aria-atomic=\"true\"></div>\n\n      <div class=\"controls\" aria-label=\"Simulator controls\">\n        <button id=\"previous\" type=\"button\">← Previous</button>\n        <button id=\"next\" class=\"primary\" type=\"button\">Next step →</button>\n        <button id=\"play\" type=\"button\">▶ Auto-play</button>\n        <button id=\"reset\" type=\"button\">Reset</button>\n        <span class=\"hint\">Shortcuts: ← → R</span>\n        <span id=\"progress\" class=\"progress\" aria-live=\"polite\"></span>\n      </div>\n\n      <div id=\"ride-chips\" class=\"ride-chips\" aria-label=\"Activity statuses\"></div>\n\n      <div class=\"stats-bar\">\n        <div class=\"stat-card\"><div id=\"stat-sort\" class=\"val\">12 ops</div><div class=\"lbl\">Step 1 · Sort Cost (O(n log n))</div></div>\n        <div class=\"stat-card\"><div id=\"stat-scan\" class=\"val\">0 / 5</div><div class=\"lbl\">Step 2 · Loop Checks (O(n))</div></div>\n        <div class=\"stat-card\"><div id=\"stat-total\" class=\"val\">12 ops</div><div class=\"lbl\">Total Work Done</div></div>\n      </div>\n\n      <div id=\"result\" class=\"result\" aria-live=\"polite\"></div>\n    </section>\n  </div>\n</main>\n\n<div id=\"ride-modal\" class=\"modal\" hidden>\n  <section class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dialog-title\" aria-describedby=\"form-help\">\n    <div class=\"dialog-head\">\n      <h2 id=\"dialog-title\">Add an activity</h2>\n      <button class=\"close\" id=\"close-form\" type=\"button\" aria-label=\"Close dialog\">✕</button>\n    </div>\n    <p id=\"form-help\">Enter times between 1:00 PM and 9:00 PM. Finish must be after start time.</p>\n    <form id=\"ride-form\" class=\"form-grid\">\n      <label>Activity name<input name=\"name\" required maxlength=\"40\" placeholder=\"Skyline Flyer\"></label>\n      <label>Start time<input name=\"start\" type=\"time\" min=\"13:00\" max=\"21:00\" required value=\"15:00\"></label>\n      <label>Finish time<input name=\"finish\" type=\"time\" min=\"13:00\" max=\"21:00\" required value=\"16:00\"></label>\n      <div id=\"form-error\" class=\"form-error\" role=\"alert\"></div>\n      <button class=\"form-submit\" type=\"submit\">Add activity &amp; rerun</button>\n    </form>\n  </section>\n</div>\n\n<script>\n(() => {\n  const $ = id => document.getElementById(id);\n  const source = [\n    \"def select_activities(activities):\",\n    \"    solution = []                    # Cost: O(1)\",\n    \"    # Step 1: Sort by finish time    # Cost: O(n log n)\",\n    \"    ordered = sorted(activities, key=lambda a: a['finish'])\",\n    \"    last_finish = float('-inf')      # Cost: O(1)\",\n    \"    # Step 2: Loop through list once # Cost: O(n) total\",\n    \"    for act in ordered:\",\n    \"        if act['start'] >= last_finish:  # 1 quick check: O(1)\",\n    \"            solution.append(act)         # Instant add:   O(1)\",\n    \"            last_finish = act['finish']  # Instant save:  O(1)\",\n    \"    return solution\"\n  ];\n  const escapeHtml = s => String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\n  $('code-block').innerHTML = source.map((line, i) => {\n    const safe = escapeHtml(line)\n      .replace(/(#[^&]*$)/, '<span class=\"comment\">$1</span>')\n      .replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g, '<span class=\"str\">$1</span>')\n      .replace(/\\b(def|for|in|if|return|lambda)\\b/g, '<span class=\"kw\">$1</span>')\n      .replace(/\\b(select_activities|sorted|float)\\b/g, '<span class=\"fn\">$1</span>');\n    return `<span class=\"code-line\" data-line=\"${i + 1}\">${safe || ' '}</span>`;\n  }).join('');\n\n  const PRESETS = {\n    unsorted: {\n      preSorted: false,\n      items: [\n        { name: 'Mega Coaster', start: 13, finish: 17 },\n        { name: 'Water Splash', start: 13, finish: 14.5 },\n        { name: 'Haunted Manor', start: 14, finish: 16 },\n        { name: 'Ferris Wheel', start: 14.5, finish: 15.5 },\n        { name: 'Pirate Ship', start: 15.5, finish: 17 }\n      ]\n    },\n    sorted: {\n      preSorted: true,\n      items: [\n        { name: 'Haunted House', start: 13, finish: 14 },\n        { name: 'Laser Tag', start: 13.5, finish: 15 },\n        { name: 'Go Karts', start: 14, finish: 15.5 },\n        { name: '4D Theater', start: 15.5, finish: 17 },\n        { name: 'Arcade Rush', start: 17, finish: 19 }\n      ]\n    },\n    trap: {\n      preSorted: false,\n      items: [\n        { name: 'Bumper Cars', start: 13, finish: 14 },\n        { name: 'Overlap Ride A', start: 13.5, finish: 15 },\n        { name: 'Overlap Ride B', start: 13.5, finish: 16 },\n        { name: 'Overlap Ride C', start: 13.5, finish: 17 },\n        { name: 'Overlap Ride D', start: 13.5, finish: 18 },\n        { name: 'Night Parade', start: 18, finish: 19.5 }\n      ]\n    }\n  };\n\n  let isPreSorted = false;\n  let rides = [], order = [], step = -1, timer = null, uid = 0;\n\n  const load = type => {\n    isPreSorted = PRESETS[type].preSorted;\n    return PRESETS[type].items.map((r, i) => ({ ...r, id: `p-${type}-${i}` }));\n  };\n  rides = load('unsorted');\n\n  const list = $('ride-list'), info = $('trace-info'), chips = $('ride-chips');\n  const cutoffLine = $('cutoff-line'), cutoffBadge = $('cutoff-badge');\n\n  const fmt = t => {\n    let h = Math.floor(t), m = Math.round((t - h) * 60);\n    if (m === 60) { h++; m = 0; }\n    const period = h >= 12 ? 'PM' : 'AM';\n    return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${period}`;\n  };\n\n  let decisions = [];\n  function computeDecisions() {\n    decisions = [];\n    let last = null;\n    order.forEach(r => {\n      const ok = !last || r.start >= last.finish;\n      decisions.push({ ok, blocker: ok ? null : last, prev: last });\n      if (ok) last = r;\n    });\n  }\n  const acceptedThrough = k => order.filter((_, i) => i <= k && decisions[i].ok);\n\n  function highlightLine(nums) {\n    document.querySelectorAll('.code-line').forEach(l => l.classList.remove('active'));\n    [].concat(nums).forEach(n => document.querySelector(`.code-line[data-line=\"${n}\"]`)?.classList.add('active'));\n  }\n\n  function stopPlay() {\n    if (timer) { clearInterval(timer); timer = null; }\n    $('play').textContent = '▶ Auto-play';\n  }\n\n  function placeCutoff(last) {\n    if (!last || step < 0 || step >= order.length) { cutoffLine.style.display = 'none'; return; }\n    const track = list.querySelector('.track');\n    if (!track) return;\n    const t = track.getBoundingClientRect(), c = $('timeline').getBoundingClientRect();\n    cutoffLine.style.display = 'block';\n    cutoffLine.style.left = `${t.left - c.left + t.width * (last.finish - 13) / 8 - 1}px`;\n    cutoffBadge.textContent = `Last finish: ${fmt(last.finish)}`;\n  }\n\n  function draw() {\n    list.innerHTML = '';\n    const n = order.length;\n    const sortOps = (!n || isPreSorted) ? 0 : Math.round(n * Math.log2(n));\n    const scanOps = step < 0 ? 0 : Math.min(n, step + 1);\n    const totalOps = sortOps + scanOps;\n\n    const done = step >= n;\n    const acc = step < 0 ? [] : acceptedThrough(Math.min(step, n - 1));\n    const cur = step >= 0 && !done ? order[step] : null;\n    const dec = cur ? decisions[step] : null;\n\n    if (!rides.length) {\n      list.innerHTML = '<p style=\"color:#8a94a6;font-size:.9rem;margin:8px 0\">No activities yet. Add a custom activity or pick an example.</p>';\n    }\n\n    order.forEach(ride => {\n      const row = document.createElement('div');\n      row.className = 'ride-row';\n      const meta = document.createElement('div');\n      meta.className = 'ride-meta';\n      const name = document.createElement('div');\n      name.className = 'ride-name';\n      name.textContent = ride.name;\n      name.title = ride.name;\n      meta.append(name);\n      if (step === -1) {\n        const del = document.createElement('button');\n        del.className = 'delete-btn';\n        del.textContent = '✕';\n        del.title = del.ariaLabel = `Remove ${ride.name}`;\n        del.onclick = () => { rides = rides.filter(r => r.id !== ride.id); isPreSorted = false; run(); };\n        meta.append(del);\n      }\n      const track = document.createElement('div');\n      track.className = 'track';\n      const bar = document.createElement('div');\n      const idx = order.indexOf(ride);\n      let status = 'pending';\n      if (idx >= 0 && idx <= step) status = decisions[idx].ok ? 'accepted' : 'rejected';\n      bar.className = `bar ${status}${cur === ride ? ' current' : ''}`;\n      bar.style.left = `${((ride.start - 13) / 8) * 100}%`;\n      bar.style.width = `${Math.max(3, ((ride.finish - ride.start) / 8) * 100)}%`;\n      bar.textContent = `${fmt(ride.start)}–${fmt(ride.finish)}`;\n      bar.title = `${ride.name}: ${fmt(ride.start)}–${fmt(ride.finish)}`;\n      track.append(bar);\n      row.append(meta, track);\n      list.append(row);\n    });\n\n    chips.innerHTML = '';\n    order.forEach((ride, i) => {\n      const s = i > step ? 'pending' : decisions[i].ok ? 'accepted' : 'rejected';\n      const chip = document.createElement('span');\n      chip.className = 'ride-chip';\n      chip.innerHTML = `${escapeHtml(ride.name)} <span class=\"badge ${s}\">${s === 'accepted' ? 'Accepted (1 check)' : s === 'rejected' ? 'Skipped (1 check)' : 'Up next'}</span>`;\n      chips.append(chip);\n    });\n\n    placeCutoff(dec ? dec.prev : null);\n\n    if (!n) {\n      highlightLine([]);\n      info.innerHTML = '<strong>Nothing to schedule</strong><p>Add at least one activity to start the simulation.</p>';\n    } else if (step < 0) {\n      highlightLine([1, 2, 3, 4, 5]);\n      info.innerHTML = isPreSorted\n        ? `<strong>Step 1 Done: List is Already Sorted! (0 sort ops)</strong><p>Because these ${n} activities are already ordered by finish time, we skip sorting! Click <strong>Next step</strong> to do our single <code>O(n)</code> scan.</p><p class=\"why\">Work so far: 0 sort ops + 0 loop checks = 0 ops</p>`\n        : `<strong>Step 1 Done: Sorted ${n} Activities by Finish Time (${sortOps} sort ops)</strong><p>Sorting ${n} items takes about <code>n log₂(n) ≈ ${sortOps}</code> ops. Now click <strong>Next step</strong> to check each activity once in a single loop.</p><p class=\"why\">Work so far: ${sortOps} sort ops + 0 loop checks = ${sortOps} ops</p>`;\n    } else if (done) {\n      highlightLine(11);\n      info.innerHTML = `<strong>All Done! Checked ${n} activities in ${n} loop steps.</strong><p>The loop looked at each activity <strong>only once</strong> (${n} checks) and selected ${acc.length} activities. Compare our <strong>${totalOps} ops</strong> with Brute Force (<code>2^${n} = ${Math.pow(2, n)}</code> combinations)!</p><p class=\"why\">Final Count: ${sortOps} sort ops + ${n} loop checks = ${totalOps} total ops (${isPreSorted ? 'O(n)' : 'O(n log n)'})</p>`;\n    } else if (dec.ok) {\n      highlightLine([7, 8, 9, 10]);\n      info.innerHTML = `<strong>Loop Check ${step + 1} of ${n}: ${escapeHtml(cur.name)} · <span style=\"color:#148367\">Accepted (+1 check)</span></strong><p>${dec.prev\n        ? `1 simple check: Start time (${fmt(cur.start)}) ≥ Last finish (${fmt(dec.prev.finish)}). No conflict, so we accept it!`\n        : `1 simple check: First activity in sorted order finishes earliest (${fmt(cur.finish)}), so we accept it right away!`}</p><p class=\"why\">Work so far: ${sortOps} sort ops + ${scanOps} loop checks = ${totalOps} ops</p>`;\n    } else {\n      highlightLine([7, 8]);\n      info.innerHTML = `<strong>Loop Check ${step + 1} of ${n}: ${escapeHtml(cur.name)} · <span style=\"color:#ba5d4e\">Skipped (+1 check)</span></strong><p>1 simple check: Start time (${fmt(cur.start)}) &lt; Last finish (${fmt(dec.blocker.finish)}). Overlaps with <strong>${escapeHtml(dec.blocker.name)}</strong>, so we skip it in 1 step and move on!</p><p class=\"why\">Work so far: ${sortOps} sort ops + ${scanOps} loop checks = ${totalOps} ops</p>`;\n    }\n\n    $('previous').disabled = step < 0;\n    $('next').disabled = step >= n || !n;\n    $('play').disabled = $('next').disabled;\n    $('progress').textContent = !n ? '' : step < 0 ? 'Sorted & Ready' : done ? 'Completed' : `Check ${step + 1} of ${n}`;\n\n    $('stat-sort').textContent = isPreSorted ? '0 ops (Sorted!)' : `${sortOps} ops`;\n    $('stat-scan').textContent = `${scanOps} / ${n} checks`;\n    $('stat-total').textContent = `${totalOps} ops · ${isPreSorted ? 'O(n)' : 'O(n log n)'}`;\n    $('result').textContent = done\n      ? `Summary for n = ${n}: Greedy took ${totalOps} ops (${sortOps} sort + ${n} scan) vs Brute Force O(2ⁿ) = ${Math.pow(2, n)} checks. Selected: ${acc.map(r => r.name).join(' → ')}.`\n      : 'Click \"Next step →\" to see each O(1) check in the loop.';\n  }\n\n  function run() {\n    stopPlay();\n    order = [...rides].sort((a, b) => a.finish - b.finish || a.start - b.start || a.name.localeCompare(b.name));\n    computeDecisions();\n    step = -1;\n    draw();\n  }\n  function next() {\n    if (step + 1 > order.length || !order.length) return;\n    if (step >= order.length) return;\n    step++;\n    if (step >= order.length) stopPlay();\n    draw();\n  }\n  function prev() {\n    if (step < 0) return;\n    stopPlay();\n    step--;\n    draw();\n  }\n  function togglePlay() {\n    if (timer) { stopPlay(); return; }\n    if (step >= order.length) return;\n    $('play').textContent = '❚❚ Pause';\n    next();\n    if (step < order.length) timer = setInterval(next, 1300);\n  }\n\n  $('next').addEventListener('click', () => { stopPlay(); next(); });\n  $('previous').addEventListener('click', prev);\n  $('reset').addEventListener('click', run);\n  $('play').addEventListener('click', togglePlay);\n  window.addEventListener('resize', () => { if (step >= 0 && step < order.length) draw(); });\n\n  document.addEventListener('keydown', e => {\n    if (e.key === 'Escape' && !$('ride-modal').hidden) { closeModal(); return; }\n    if (!$('ride-modal').hidden || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;\n    if (e.key === 'ArrowRight') { stopPlay(); next(); }\n    if (e.key === 'ArrowLeft') prev();\n    if (e.key === 'r' || e.key === 'R') run();\n  });\n\n  document.querySelectorAll('.preset-btn').forEach(btn => btn.addEventListener('click', () => {\n    document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('on', b === btn));\n    rides = load(btn.dataset.preset);\n    run();\n  }));\n\n  $('copy-code').addEventListener('click', async e => {\n    const b = e.currentTarget;\n    try { await navigator.clipboard.writeText(source.join('\\n')); b.textContent = 'Copied!'; }\n    catch {\n      const ta = document.createElement('textarea');\n      ta.value = source.join('\\n');\n      document.body.appendChild(ta);\n      ta.select();\n      document.execCommand('copy');\n      ta.remove();\n      b.textContent = 'Copied!';\n    }\n    setTimeout(() => b.textContent = 'Copy code', 1500);\n  });\n\n  const modal = $('ride-modal'), form = $('ride-form'), error = $('form-error');\n  function closeModal() { modal.hidden = true; error.textContent = ''; $('open-form').focus(); }\n  $('open-form').addEventListener('click', () => { modal.hidden = false; form.elements.name.focus(); });\n  $('close-form').addEventListener('click', closeModal);\n  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });\n\n  form.addEventListener('submit', e => {\n    e.preventDefault();\n    const d = new FormData(form);\n    const name = String(d.get('name')).trim();\n    const toHour = v => { const [h, m] = String(v).split(':').map(Number); return h + m / 60; };\n    const start = toHour(d.get('start')), finish = toHour(d.get('finish'));\n    if (!name || !Number.isFinite(start) || !Number.isFinite(finish) || start < 13 || finish > 21 || finish <= start) {\n      error.textContent = 'Enter a valid name and times between 1 PM and 9 PM. Finish time must be after start time.';\n      return;\n    }\n    rides.push({ id: `custom-${++uid}`, name, start, finish });\n    isPreSorted = false;\n    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('on'));\n    form.reset();\n    run();\n    closeModal();\n  });\n\n  run();\n})();\n<\/script>\n</body>\n</html>"},{"id":7,"tag":"Topic 07","title":"Why Earliest Finish Works","shortTitle":"Proof of Correctness","subtitle":"Exchange Argument, Inductive Proof & Case Analysis","badge":"Mathematical Proof","file":"Why_earliest_finish_works_presentaion.html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"theme-color\" content=\"#101827\">\n  <title>Why Earliest Finish Works</title>\n  <style>\n    :root {\n      color-scheme: light;\n      --ink: #172033;\n      --muted: #5d687b;\n      --line: #dce3ed;\n      --paper: #ffffff;\n      --page: #f2f5fa;\n      --accent: #315ee8;\n      --accent-soft: #eaf0ff;\n      --code: #101827;\n      --good: #16794a;\n    }\n    * { box-sizing: border-box; }\n    body {\n      margin: 0;\n      background: var(--page);\n      color: var(--ink);\n      font: 16px/1.65 system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n    }\n    .hero {\n      padding: clamp(2rem, 6vw, 4.5rem) 1rem 2.5rem;\n      background: linear-gradient(135deg, #101827, #203a70);\n      color: white;\n    }\n    .hero-inner, main, footer { width: min(100% - 2rem, 1000px); margin-inline: auto; }\n    .eyebrow {\n      display: inline-block; margin: 0 0 .75rem; padding: .25rem .65rem;\n      border: 1px solid #8198d7; border-radius: 999px; color: #d9e4ff;\n      font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;\n    }\n    h1 { max-width: 780px; margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.12; letter-spacing: -.035em; }\n    .hero p { max-width: 720px; margin: 1rem 0 0; color: #e0e8fa; font-size: clamp(1rem, 2.4vw, 1.15rem); }\n    main { padding-block: 1.5rem 3rem; }\n    section {\n      margin: 1.2rem 0; padding: clamp(1rem, 3vw, 1.6rem);\n      background: var(--paper); border: 1px solid var(--line); border-radius: 18px;\n      box-shadow: 0 8px 24px rgb(21 35 62 / 5%);\n    }\n    h2 { margin: 0 0 .7rem; font-size: clamp(1.25rem, 3vw, 1.65rem); line-height: 1.25; }\n    h3 { margin: 1.25rem 0 .4rem; font-size: 1.05rem; }\n    p { margin: .5rem 0; }\n    .muted { color: var(--muted); }\n    .steps { padding-left: 1.25rem; margin-bottom: 0; }\n    .steps li { padding-left: .25rem; margin: .35rem 0; }\n    .code-head {\n      display: flex; align-items: center; justify-content: space-between; gap: .75rem;\n      flex-wrap: wrap; margin-bottom: .65rem;\n    }\n    .code-head h3 { margin: 0; }\n    button {\n      border: 0; border-radius: 9px; padding: .6rem .85rem; cursor: pointer;\n      background: var(--accent); color: white; font: inherit; font-weight: 650;\n    }\n    button:hover { filter: brightness(1.08); }\n    button:focus-visible { outline: 3px solid #91a9ff; outline-offset: 3px; }\n    pre {\n      margin: 0; padding: 1rem; overflow-x: auto; border-radius: 12px;\n      background: var(--code); color: #eaf0ff; font: .9rem/1.65 ui-monospace, SFMono-Regular, Consolas, monospace;\n      tab-size: 4; -webkit-overflow-scrolling: touch;\n    }\n    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }\n    .output { margin-top: .75rem; background: #f6f8fc; color: #1d2a40; border: 1px solid var(--line); }\n    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }\n    table { width: 100%; border-collapse: collapse; min-width: 360px; }\n    th, td { padding: .7rem .85rem; text-align: left; border-bottom: 1px solid var(--line); }\n    th { background: #f5f7fb; font-size: .9rem; }\n    tr:last-child td { border-bottom: 0; }\n    .picked { color: var(--good); font-weight: 750; }\n    .proof-list { list-style: none; padding: 0; margin: .8rem 0 0; counter-reset: proof; }\n    .proof-list li {\n      position: relative; padding: .7rem .75rem .7rem 3rem; margin: .55rem 0;\n      border: 1px solid var(--line); border-radius: 12px; counter-increment: proof;\n    }\n    .proof-list li::before {\n      content: counter(proof); position: absolute; left: .75rem; top: .7rem;\n      display: grid; place-items: center; width: 1.55rem; height: 1.55rem;\n      border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 800;\n    }\n    .callout { padding: .9rem 1rem; background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 8px; }\n    .complexity { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; margin-top: 1rem; }\n    .metric { padding: .85rem; background: #f6f8fc; border: 1px solid var(--line); border-radius: 12px; }\n    .metric strong { display: block; font-size: 1.15rem; }\n    footer { padding: 0 0 2rem; color: var(--muted); font-size: .9rem; }\n    @media (max-width: 520px) {\n      .hero-inner, main, footer { width: min(100% - 1rem, 1000px); }\n      .hero { padding-top: 2.2rem; }\n      section { border-radius: 13px; padding: 1rem; }\n      pre { font-size: .8rem; padding: .8rem; }\n      .complexity { grid-template-columns: 1fr; }\n    }\n    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }\n  </style>\n</head>\n<body>\n  <header class=\"hero\">\n    <div class=\"hero-inner\">\n      <p class=\"eyebrow\">Greedy algorithm · Python</p>\n      <h1>Why Earliest Finish Works</h1>\n      <p>Understand the Activity Selection Problem, see the Python code, and learn why choosing the activity that finishes first leads to an optimal result.</p>\n    </div>\n  </header>\n\n  <main>\n    <section aria-labelledby=\"context\">\n      <h2 id=\"context\">1. Context</h2>\n      <p>The <strong>Earliest Finish algorithm</strong> is a greedy algorithm that selects the maximum number of non-overlapping activities. Each activity has a start time and a finish time.</p>\n      <ol class=\"steps\">\n        <li>Sort activities by finish time, from earliest to latest.</li>\n        <li>Select the first activity.</li>\n        <li>Choose the next activity only if its start time is at or after the last selected activity's finish time.</li>\n        <li>Continue until all activities have been checked.</li>\n      </ol>\n    </section>\n\n    <section aria-labelledby=\"algorithm\">\n      <h2 id=\"algorithm\">2. Algorithmic Response (Coding)</h2>\n      <p class=\"muted\">This Python program sorts activities by finish time, selects compatible activities, and prints the result.</p>\n      <div class=\"code-head\">\n        <h3>Python implementation</h3>\n        <button type=\"button\" id=\"copy-code\">Copy code</button>\n      </div>\n      <pre><code id=\"python-code\">def activity_selection(activities):\n    # Sort activities by finish time\n    activities.sort(key=lambda activity: activity[1])\n\n    selected = []\n    last_finish = 0\n\n    for start, finish in activities:\n        if start &gt;= last_finish:\n            selected.append((start, finish))\n            last_finish = finish\n\n    return selected\n\n\nactivities = [(1, 3), (2, 5), (3, 4), (4, 6), (6, 8)]\n\nresult = activity_selection(activities)\n\nprint(\"Selected activities:\", result)\nprint(\"Total activities:\", len(result))</code></pre>\n      <p id=\"copy-status\" class=\"muted\" role=\"status\" aria-live=\"polite\"></p>\n\n      <h3>Example input</h3>\n      <div class=\"table-wrap\">\n        <table>\n          <thead><tr><th>Activity</th><th>Start</th><th>Finish</th><th>Selected?</th></tr></thead>\n          <tbody>\n            <tr><td>A</td><td>1</td><td>3</td><td class=\"picked\">Yes</td></tr>\n            <tr><td>B</td><td>2</td><td>5</td><td>No</td></tr>\n            <tr><td>C</td><td>3</td><td>4</td><td class=\"picked\">Yes</td></tr>\n            <tr><td>D</td><td>4</td><td>6</td><td class=\"picked\">Yes</td></tr>\n            <tr><td>E</td><td>6</td><td>8</td><td class=\"picked\">Yes</td></tr>\n          </tbody>\n        </table>\n      </div>\n      <h3>Program output</h3>\n      <pre class=\"output\"><code>Selected activities: [(1, 3), (3, 4), (4, 6), (6, 8)]\nTotal activities: 4</code></pre>\n      <p class=\"muted\">Activities may touch at endpoints: for example, one can finish at time 3 and the next can start at time 3.</p>\n    </section>\n\n    <section aria-labelledby=\"proof\">\n      <h2 id=\"proof\">3. Evidence / Proof</h2>\n      <p>The algorithm is correct because of the <strong>greedy-choice property</strong> and <strong>optimal substructure</strong>.</p>\n      <ol class=\"proof-list\">\n        <li><strong>Greedy choice:</strong> Let A be an activity with the earliest finish time. Choosing A leaves at least as much time for later activities as choosing any activity that finishes later.</li>\n        <li><strong>Exchange argument:</strong> If an optimal schedule starts with another activity B, replace B with A. Since A finishes no later than B, all activities after B remain compatible. The number of selected activities does not decrease.</li>\n        <li><strong>Optimal substructure:</strong> After choosing A, the remaining task is the same problem restricted to activities that start at or after A finishes.</li>\n        <li><strong>Repeat:</strong> Applying the same reasoning to the remaining activities shows that every greedy choice can be part of an optimal schedule. Therefore, the algorithm selects the maximum possible number of compatible activities.</li>\n      </ol>\n      <div class=\"complexity\">\n        <div class=\"metric\"><span class=\"muted\">Time complexity</span><strong>O(n log n)</strong><span class=\"muted\">Sorting + one linear scan</span></div>\n        <div class=\"metric\"><span class=\"muted\">Extra space</span><strong>O(n)</strong><span class=\"muted\">For the selected activities (excluding sorting details)</span></div>\n      </div>\n      <h3>Conclusion</h3>\n      <p class=\"callout\">Earliest Finish works because choosing the activity that ends first preserves the most time for the remaining activities. The exchange argument proves that this choice does not reduce the best possible answer.</p>\n    </section>\n  </main>\n\n  <footer>\n    <p>Responsive layout: designed for phones, tablets, and desktop screens. The code sample can be copied using the button above.</p>\n  </footer>\n\n  <script>\n    const copyButton = document.getElementById('copy-code');\n    const code = document.getElementById('python-code');\n    const status = document.getElementById('copy-status');\n\n    copyButton.addEventListener('click', async () => {\n      const text = code.innerText;\n      try {\n        await navigator.clipboard.writeText(text);\n        status.textContent = 'Code copied to clipboard.';\n      } catch (error) {\n        const range = document.createRange();\n        range.selectNodeContents(code);\n        const selection = window.getSelection();\n        selection.removeAllRanges();\n        selection.addRange(range);\n        status.textContent = 'Automatic copy was blocked. Select the highlighted code and copy it manually.';\n      }\n    });\n  <\/script>\n</body>\n</html>\n"},{"id":8,"tag":"Topic 08","title":"When Greedy Algorithms Fail","shortTitle":"Greedy Failures","subtitle":"Counterexamples, 0-1 Knapsack & When to Use Dynamic Programming","badge":"Limitations","file":"greedy_algorithms_presentation.html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>When Greedy Algorithms Fail - Presentation</title>\n    <!-- Load Tailwind CSS for modern, responsive styling -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <style>\n        /* Custom CSS for Slide Transitions and Base Styling */\n        body {\n            background-color: #0f172a; /* Slate 900 */\n            color: #f8fafc; /* Slate 50 */\n            font-family: 'Inter', sans-serif;\n            overflow: hidden; /* Prevent scrolling, act like a true presentation */\n            margin: 0;\n            padding: 0;\n            display: flex;\n            flex-direction: column;\n            height: 100vh;\n        }\n\n         #presentation-container {\n            position: relative;\n            flex-grow: 1;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            padding: 2rem;\n            width: 100%;\n            max-width: 1200px;\n            margin: 0 auto;\n            min-height: 0; /* Ensures flex container doesn't push the footer off screen */\n        }\n\n        .slide {\n            position: absolute;\n            top: 0;\n            left: 0;\n            width: 100%;\n            height: 100%;\n            opacity: 0;\n            visibility: hidden;\n            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;\n            display: flex;\n            flex-direction: column;\n            justify-content: flex-start; /* Changed from center to prevent top clipping on scroll */\n            padding: 3rem;\n            box-sizing: border-box;\n            overflow-y: auto; /* Makes the slide internally scrollable if content is too tall */\n        }\n\n        .slide.active {\n            opacity: 1;\n            visibility: visible;\n            position: relative; /* Take up space in the container when active */\n        }\n\n        /* Glassmorphism effect for the slide content */\n        .slide-content {\n            background: rgba(30, 41, 59, 0.7); /* Slate 800 with opacity */\n            backdrop-filter: blur(10px);\n            border: 1px solid rgba(255, 255, 255, 0.1);\n            border-radius: 1rem;\n            padding: 3rem;\n            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);\n            width: 100%;\n            max-width: 1000px;\n            margin: 0 auto;\n        }\n\n        .highlight {\n            color: #38bdf8; /* Sky 400 */\n        }\n\n        .fail-text {\n            color: #f87171; /* Red 400 */\n        }\n        \n        .success-text {\n            color: #4ade80; /* Green 400 */\n        }\n\n        /* Bottom Controls Bar */\n        #controls {\n            background-color: #1e293b; /* Slate 800 */\n            padding: 1rem 2rem;\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            border-top: 1px solid #334155; /* Slate 700 */\n        }\n\n        button:disabled {\n            opacity: 0.5;\n            cursor: not-allowed;\n        }\n    </style>\n    <!-- Load Google Font -->\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap\" rel=\"stylesheet\">\n</head>\n<body>\n\n    <!-- Main Presentation Area -->\n    <div id=\"presentation-container\">\n        \n        <!-- Slide 1: Title Slide -->\n        <div class=\"slide active\" id=\"slide-0\">\n            <div class=\"slide-content text-center\">\n                <h1 class=\"text-6xl font-bold mb-6\">When <span class=\"fail-text\">Greedy Algorithms</span> Fail</h1>\n                <div class=\"w-24 h-1 bg-sky-500 mx-auto mb-8 rounded\"></div>\n                <h2 class=\"text-2xl text-slate-300 font-light tracking-wide\"></h2>\n                <p class=\"text-lg text-slate-400 mt-2\">Algorithms & Complexity</p>\n            </div>\n        </div>\n\n        <!-- Slide 2: Context -->\n        <div class=\"slide\" id=\"slide-1\">\n            <div class=\"slide-content\">\n                <h2 class=\"text-4xl font-bold mb-2\">Context & Definition</h2>\n                <div class=\"w-16 h-1 bg-sky-500 mb-8 rounded\"></div>\n                \n                <p class=\"text-xl mb-6 leading-relaxed\">\n                    A greedy algorithm makes the <span class=\"highlight font-semibold\">locally optimal choice</span> at each stage with the hope of finding a global optimum. However, this approach fails when a problem's local decisions permanently lock you out of the best overall solution.\n                </p>\n                \n                <div class=\"bg-slate-900/50 p-6 rounded-lg border border-slate-700\">\n                    <h3 class=\"text-2xl font-semibold mb-3 highlight\">Requirements for Success:</h3>\n                    <ul class=\"list-disc list-inside text-lg text-slate-200 space-y-2\">\n                        <li><strong>Greedy-Choice Property:</strong> A global optimum can be arrived at by selecting a local optimum.</li>\n                        <li><strong>Optimal Substructure:</strong> An optimal solution to the problem contains optimal solutions to subproblems.</li>\n                    </ul>\n                    <p class=\"mt-4 text-slate-400 italic\">When these are absent, the algorithm acts \"short-sightedly\".</p>\n                </div>\n            </div>\n        </div>\n\n        <!-- Slide 3: Evidence 1 -->\n        <div class=\"slide\" id=\"slide-2\">\n            <div class=\"slide-content\">\n                <h2 class=\"text-4xl font-bold mb-2\">Evidence 1: The Coin Change Problem</h2>\n                <div class=\"w-16 h-1 bg-sky-500 mb-6 rounded\"></div>\n                \n                <p class=\"text-lg mb-6\">Goal: Make change for a specific amount using the fewest number of coins.</p>\n                \n                <div class=\"grid grid-cols-1 md:grid-cols-2 gap-6\">\n                    <div class=\"bg-slate-900/50 p-6 rounded-lg border border-slate-700\">\n                        <h3 class=\"text-xl font-semibold mb-2\">The Setup</h3>\n                        <ul class=\"list-disc list-inside text-slate-300\">\n                            <li>Available Coins: <span class=\"font-mono text-white\">1, 3, 4</span></li>\n                            <li>Target Amount: <span class=\"font-mono text-white\">6</span></li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"bg-red-900/20 p-6 rounded-lg border border-red-900\">\n                        <h3 class=\"text-xl font-semibold mb-2 fail-text\">Greedy Approach (Fails)</h3>\n                        <p class=\"text-slate-300 mb-2\">Pick the largest coin first.</p>\n                        <p class=\"font-mono bg-black/30 p-2 rounded\">4 &rarr; 1 &rarr; 1 <br><span class=\"text-sm\">(Total: 3 coins)</span></p>\n                    </div>\n                </div>\n\n                <div class=\"mt-6 bg-green-900/20 p-6 rounded-lg border border-green-900\">\n                    <h3 class=\"text-xl font-semibold mb-2 success-text\">The Optimal Solution</h3>\n                    <p class=\"text-slate-300\">The true optimal solution is to ignore the locally best '4' and select two '3's.</p>\n                    <p class=\"font-mono bg-black/30 p-2 rounded mt-2 inline-block\">3 &rarr; 3 <span class=\"text-sm\">(Total: 2 coins)</span></p>\n                </div>\n            </div>\n        </div>\n\n        <!-- Slide 4: Evidence 2 -->\n        <div class=\"slide\" id=\"slide-3\">\n            <div class=\"slide-content\">\n                <h2 class=\"text-4xl font-bold mb-2\">Evidence 2: 0/1 Knapsack Problem</h2>\n                <div class=\"w-16 h-1 bg-sky-500 mb-6 rounded\"></div>\n                \n                <p class=\"text-lg mb-4\">Goal: Maximize total value in a backpack without exceeding weight capacity.</p>\n                \n                <div class=\"flex flex-col md:flex-row gap-6\">\n                    <div class=\"flex-1 bg-slate-900/50 p-4 rounded-lg border border-slate-700 text-sm\">\n                        <h3 class=\"text-lg font-semibold mb-2\">Setup (Max Weight: 50kg)</h3>\n                        <table class=\"w-full text-left\">\n                            <tr class=\"border-b border-slate-700\"><th>Item</th><th>Weight</th><th>Value</th><th>Ratio</th></tr>\n                            <tr class=\"border-b border-slate-700\"><td>A</td><td>10 kg</td><td>$60</td><td class=\"highlight\">$6/kg</td></tr>\n                            <tr class=\"border-b border-slate-700\"><td>B</td><td>20 kg</td><td>$100</td><td>$5/kg</td></tr>\n                            <tr><td>C</td><td>30 kg</td><td>$120</td><td>$4/kg</td></tr>\n                        </table>\n                    </div>\n                    \n                    <div class=\"flex-1 flex flex-col gap-4\">\n                        <div class=\"bg-red-900/20 p-4 rounded-lg border border-red-900\">\n                            <h3 class=\"font-semibold fail-text\">Greedy (Sort by Ratio)</h3>\n                            <p class=\"text-sm text-slate-300\">Takes A (10kg) &rarr; B (20kg). Can't fit C.</p>\n                            <p class=\"font-mono mt-1\">Weight: 30kg | Value: $160</p>\n                        </div>\n                        <div class=\"bg-green-900/20 p-4 rounded-lg border border-green-900\">\n                            <h3 class=\"font-semibold success-text\">Optimal Solution</h3>\n                            <p class=\"text-sm text-slate-300\">Ignore best ratio (A), pack B + C.</p>\n                            <p class=\"font-mono mt-1\">Weight: 50kg | Value: $220</p>\n                        </div>\n                    </div>\n                </div>\n            </div>\n        </div>\n\n        <!-- Slide 5: Conclusion -->\n        <div class=\"slide\" id=\"slide-4\">\n            <div class=\"slide-content text-center\">\n                <h2 class=\"text-4xl font-bold mb-2\">Conclusion</h2>\n                <div class=\"w-16 h-1 bg-sky-500 mx-auto mb-8 rounded\"></div>\n                \n                <p class=\"text-2xl text-slate-200 mb-8 leading-relaxed\">\n                    Greedy algorithms are <span class=\"success-text font-semibold\">fast and memory-efficient</span> \n                    (often $O(n \\log n)$), but they are <span class=\"fail-text font-semibold\">dangerous if applied blindly</span>.\n                </p>\n                \n                <div class=\"bg-slate-900/60 p-6 rounded-lg border border-slate-700 inline-block text-left\">\n                    <h3 class=\"text-xl font-semibold mb-3 highlight\">The Takeaway:</h3>\n                    <p class=\"text-lg text-slate-300\">\n                        They fail when current optimal choices conflict with future optimal combinations. To guarantee correct results in these scenarios, exhaustive methods like <strong>Dynamic Programming</strong> are required to evaluate overlapping subproblems.\n                    </p>\n                </div>\n            </div>\n        </div>\n\n    </div>\n\n    <!-- Presentation Controls -->\n    <div id=\"controls\">\n        <button id=\"prev-btn\" class=\"px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded text-white font-semibold transition-colors shadow\" onclick=\"changeSlide(-1)\">\n            &larr; Previous\n        </button>\n        \n        <div class=\"text-slate-400 font-mono text-lg\">\n            Slide <span id=\"slide-counter\" class=\"text-white font-bold\">1</span> / 5\n        </div>\n        \n        <button id=\"next-btn\" class=\"px-6 py-2 bg-sky-600 hover:bg-sky-500 rounded text-white font-semibold transition-colors shadow\" onclick=\"changeSlide(1)\">\n            Next &rarr;\n        </button>\n    </div>\n\n    <!-- JavaScript for Slideshow Logic -->\n    <script>\n        let currentSlide = 0;\n        const totalSlides = 5; // Slide 0 to 4\n\n        function updateUI() {\n            // Hide all slides\n            const slides = document.querySelectorAll('.slide');\n            slides.forEach((slide, index) => {\n                if (index === currentSlide) {\n                    slide.classList.add('active');\n                } else {\n                    slide.classList.remove('active');\n                }\n            });\n\n            // Update counter\n            document.getElementById('slide-counter').innerText = currentSlide + 1;\n\n            // Update button states\n            document.getElementById('prev-btn').disabled = currentSlide === 0;\n            document.getElementById('next-btn').disabled = currentSlide === totalSlides - 1;\n        }\n\n        function changeSlide(direction) {\n            currentSlide += direction;\n            \n            // Boundary checks\n            if (currentSlide < 0) currentSlide = 0;\n            if (currentSlide >= totalSlides) currentSlide = totalSlides - 1;\n            \n            updateUI();\n        }\n\n        // Add keyboard navigation (Left/Right arrows)\n        document.addEventListener('keydown', (event) => {\n            if (event.key === 'ArrowRight') {\n                if(currentSlide < totalSlides - 1) changeSlide(1);\n            } else if (event.key === 'ArrowLeft') {\n                if(currentSlide > 0) changeSlide(-1);\n            }\n        });\n\n        // Initialize UI on load\n        window.onload = updateUI;\n    <\/script>\n</body>\n</html>"},{"id":9,"tag":"Quiz","title":"Topic 1 Quiz: 4 Pics & Matrix Pill Challenge","shortTitle":"Quiz 1","subtitle":"4-Item Interactive Quiz: 4 Pics 1 Word & Red/Blue Pill","badge":"Interactive Quiz","file":"quiz-1.html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <title>Topic 1 Quiz: Introduction to Greedy Algorithms</title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n  <script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n  <style>\n    :root {\n      --bg-base: #090d16;\n      --bg-surface: #0f172a;\n      --bg-elevated: #162036;\n      --border-subtle: rgba(255, 255, 255, 0.08);\n      --border-accent: rgba(56, 189, 248, 0.25);\n      --primary: #38bdf8;\n      --emerald: #10b981;\n      --amber: #f59e0b;\n      --rose: #f43f5e;\n      --font-mono: 'JetBrains Mono', ui-monospace, monospace;\n    }\n\n    * {\n      box-sizing: border-box;\n      user-select: none;\n    }\n\n    html, body {\n      min-height: 100%;\n      height: auto;\n      overflow-x: hidden;\n      overflow-y: auto !important;\n      -webkit-overflow-scrolling: touch;\n      background: #090d16;\n      color: #f1f5f9;\n      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;\n      background: radial-gradient(1200px 600px at 10% -10%, rgba(16, 185, 129, 0.12), transparent 60%),\n                  radial-gradient(900px 500px at 90% 10%, rgba(56, 189, 248, 0.12), transparent 55%),\n                  radial-gradient(800px 600px at 50% 100%, rgba(139, 92, 246, 0.08), transparent 60%),\n                  linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px) 0 0/48px 48px,\n                  linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px) 0 0/48px 48px,\n                  #090d16;\n      background-attachment: fixed;\n    }\n\n    /* Ambient animated orbs */\n    .ambient-glow {\n      position: fixed;\n      border-radius: 9999px;\n      filter: blur(100px);\n      pointer-events: none;\n      z-index: 0;\n      animation: float 16s ease-in-out infinite alternate;\n    }\n    .ambient-1 {\n      width: 420px;\n      height: 420px;\n      background: rgba(16, 185, 129, 0.14);\n      top: 5%;\n      left: -100px;\n    }\n    .ambient-2 {\n      width: 380px;\n      height: 380px;\n      background: rgba(56, 189, 248, 0.12);\n      bottom: 10%;\n      right: -80px;\n      animation-delay: -7s;\n    }\n    @keyframes float {\n      to { transform: translate(50px, -40px) scale(1.1); }\n    }\n\n    /* Glass card styles */\n    .glass-panel {\n      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.85));\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      border: 1px solid rgba(255, 255, 255, 0.09);\n      box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);\n      border-radius: 1.25rem;\n    }\n\n    /* 4-Pics Card Styling */\n    .pic-card {\n      background: rgba(15, 23, 42, 0.8);\n      border: 1px solid rgba(255, 255, 255, 0.08);\n      border-radius: 0.85rem;\n      overflow: hidden;\n      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);\n      position: relative;\n      cursor: pointer;\n    }\n    .pic-card:hover {\n      transform: translateY(-4px) scale(1.02);\n      border-color: rgba(56, 189, 248, 0.4);\n      box-shadow: 0 12px 28px -8px rgba(56, 189, 248, 0.25);\n    }\n    .pic-badge {\n      position: absolute;\n      top: 8px;\n      left: 8px;\n      background: rgba(15, 23, 42, 0.85);\n      backdrop-filter: blur(8px);\n      padding: 2px 8px;\n      border-radius: 9999px;\n      font-size: 0.65rem;\n      font-weight: 700;\n      color: #38bdf8;\n      border: 1px solid rgba(56, 189, 248, 0.3);\n      letter-spacing: 0.04em;\n    }\n\n    /* Letter Slot Boxes - Mobile First */\n    .letter-slot {\n      width: 36px;\n      height: 44px;\n      border-radius: 7px;\n      background: rgba(15, 23, 42, 0.85);\n      border: 2px dashed rgba(255, 255, 255, 0.25);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-family: var(--font-mono);\n      font-size: 1.25rem;\n      font-weight: 800;\n      color: #38bdf8;\n      text-transform: uppercase;\n      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);\n      cursor: pointer;\n    }\n    @media (min-width: 480px) {\n      .letter-slot {\n        width: 44px;\n        height: 52px;\n        font-size: 1.5rem;\n      }\n    }\n    @media (min-width: 640px) {\n      .letter-slot {\n        width: 52px;\n        height: 60px;\n        font-size: 1.75rem;\n        border-radius: 10px;\n      }\n    }\n    .letter-slot.filled {\n      border: 2px solid #38bdf8;\n      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(15, 23, 42, 0.9));\n      box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);\n      animation: popIn 0.2s cubic-bezier(0.2, 1.4, 0.4, 1);\n    }\n    .letter-slot.active-cursor {\n      border-color: #f59e0b;\n      box-shadow: 0 0 14px rgba(245, 158, 11, 0.4);\n    }\n    .letter-slot.correct {\n      border-color: #10b981 !important;\n      color: #10b981 !important;\n      background: rgba(16, 185, 129, 0.15) !important;\n      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4) !important;\n    }\n    .letter-slot.wrong {\n      border-color: #f43f5e !important;\n      color: #f43f5e !important;\n      background: rgba(244, 63, 94, 0.15) !important;\n      animation: shake 0.4s ease;\n    }\n\n    /* Letter Bank Tile - Mobile First */\n    .bank-tile {\n      width: 34px;\n      height: 40px;\n      border-radius: 6px;\n      background: linear-gradient(145deg, #1e293b, #0f172a);\n      border: 1px solid rgba(255, 255, 255, 0.2);\n      color: #f8fafc;\n      font-family: var(--font-mono);\n      font-size: 1.1rem;\n      font-weight: 700;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      cursor: pointer;\n      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);\n      transition: all 0.15s ease;\n      touch-action: manipulation;\n    }\n    @media (min-width: 480px) {\n      .bank-tile {\n        width: 42px;\n        height: 48px;\n        font-size: 1.25rem;\n        border-radius: 8px;\n      }\n    }\n    @media (min-width: 640px) {\n      .bank-tile {\n        width: 48px;\n        height: 52px;\n        font-size: 1.4rem;\n      }\n    }\n    .bank-tile:hover:not(:disabled) {\n      transform: translateY(-2px);\n      border-color: #38bdf8;\n      box-shadow: 0 6px 14px rgba(56, 189, 248, 0.35);\n      color: #38bdf8;\n    }\n    .bank-tile:active:not(:disabled) {\n      transform: scale(0.95);\n    }\n    .bank-tile:disabled {\n      opacity: 0.18;\n      cursor: not-allowed;\n      transform: scale(0.92);\n      border-style: dashed;\n    }\n\n    /* Red vs Blue Pill 3D Cards */\n    .pill-card {\n      position: relative;\n      border-radius: 1.25rem;\n      padding: 1.75rem;\n      cursor: pointer;\n      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);\n      border: 2px solid transparent;\n      overflow: hidden;\n    }\n    .pill-card::before {\n      content: \"\";\n      position: absolute;\n      inset: 0;\n      border-radius: 1.25rem;\n      pointer-events: none;\n      opacity: 0.15;\n      transition: opacity 0.3s ease;\n    }\n\n    /* Red Pill styling */\n    .pill-card.red {\n      background: radial-gradient(circle at 50% 0%, rgba(244, 63, 94, 0.2), rgba(15, 23, 42, 0.95) 75%);\n      border-color: rgba(244, 63, 94, 0.35);\n      box-shadow: 0 15px 35px -10px rgba(244, 63, 94, 0.2);\n    }\n    .pill-card.red:hover {\n      transform: translateY(-6px) scale(1.02);\n      border-color: #f43f5e;\n      box-shadow: 0 20px 45px -10px rgba(244, 63, 94, 0.45), 0 0 20px rgba(244, 63, 94, 0.3);\n    }\n\n    /* Blue Pill styling */\n    .pill-card.blue {\n      background: radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.2), rgba(15, 23, 42, 0.95) 75%);\n      border-color: rgba(14, 165, 233, 0.35);\n      box-shadow: 0 15px 35px -10px rgba(14, 165, 233, 0.2);\n    }\n    .pill-card.blue:hover {\n      transform: translateY(-6px) scale(1.02);\n      border-color: #0ea5e9;\n      box-shadow: 0 20px 45px -10px rgba(14, 165, 233, 0.45), 0 0 20px rgba(14, 165, 233, 0.3);\n    }\n\n    /* Pill 3D Capsule graphic */\n    .pill-capsule {\n      width: 72px;\n      height: 32px;\n      border-radius: 9999px;\n      position: relative;\n      overflow: hidden;\n      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.4);\n      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);\n    }\n    .pill-card:hover .pill-capsule {\n      transform: rotate(-10deg) scale(1.1);\n    }\n    .pill-capsule.red-cap {\n      background: linear-gradient(135deg, #fb7185 0%, #f43f5e 50%, #9f1239 100%);\n      box-shadow: 0 0 25px rgba(244, 63, 94, 0.6), inset 0 2px 5px rgba(255, 255, 255, 0.5);\n    }\n    .pill-capsule.blue-cap {\n      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 50%, #0c4a6e 100%);\n      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6), inset 0 2px 5px rgba(255, 255, 255, 0.5);\n    }\n    .pill-capsule::after {\n      content: \"\";\n      position: absolute;\n      top: 3px;\n      left: 10px;\n      width: 20px;\n      height: 6px;\n      background: rgba(255, 255, 255, 0.65);\n      border-radius: 9999px;\n      filter: blur(1px);\n    }\n\n    /* Pill reveal states */\n    .pill-card.selected-correct {\n      border-color: #10b981 !important;\n      background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.3), rgba(15, 23, 42, 0.95) 75%) !important;\n      box-shadow: 0 0 40px rgba(16, 185, 129, 0.5) !important;\n    }\n    .pill-card.selected-wrong {\n      border-color: #f43f5e !important;\n      background: radial-gradient(circle at 50% 0%, rgba(244, 63, 94, 0.25), rgba(15, 23, 42, 0.95) 75%) !important;\n      box-shadow: 0 0 40px rgba(244, 63, 94, 0.4) !important;\n      animation: shake 0.4s ease;\n    }\n    .pill-card.dimmed {\n      opacity: 0.35;\n      transform: scale(0.97);\n      pointer-events: none;\n    }\n\n    /* Keyframes */\n    @keyframes popIn {\n      0% { transform: scale(0.4); opacity: 0; }\n      100% { transform: scale(1); opacity: 1; }\n    }\n    @keyframes shake {\n      0%, 100% { transform: translateX(0); }\n      20%, 60% { transform: translateX(-6px); }\n      40%, 80% { transform: translateX(6px); }\n    }\n    @keyframes pulseGlow {\n      0%, 100% { opacity: 0.4; }\n      50% { opacity: 0.8; }\n    }\n\n    /* Zoom modal for pictures */\n    #zoom-modal.open {\n      opacity: 1;\n      visibility: visible;\n      pointer-events: auto;\n    }\n\n    /* Confetti canvas */\n    #confetti-canvas {\n      position: fixed;\n      top: 0;\n      left: 0;\n      width: 100%;\n      height: 100%;\n      pointer-events: none;\n      z-index: 100;\n    }\n  </style>\n</head>\n<body class=\"relative\">\n  <div class=\"ambient-glow ambient-1\"></div>\n  <div class=\"ambient-glow ambient-2\"></div>\n  <canvas id=\"confetti-canvas\"></canvas>\n\n  <!-- Top App Navigation / Header -->\n  <header class=\"sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-white/10 px-4 md:px-8 py-3\">\n    <div class=\"max-w-6xl mx-auto flex items-center justify-between gap-4 flex-wrap\">\n      <div class=\"flex items-center gap-3\">\n        <button id=\"btn-back-slide\" class=\"inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-semibold border border-white/10 transition-all\">\n          <span>←</span> <span>Back to Slide 1</span>\n        </button>\n        <div class=\"h-4 w-px bg-white/10 hidden sm:block\"></div>\n        <div>\n          <div class=\"text-[11px] font-bold uppercase tracking-wider text-emerald-400\">CS 05 · Chapter 06</div>\n          <h1 class=\"text-sm sm:text-base font-extrabold text-white flex items-center gap-2\">\n            <span>Topic 1 Checkpoint: Introduction Quiz</span>\n            <span class=\"px-2 py-0.5 rounded-full text-[10px] font-bold bg-sky-500/10 text-sky-400 border border-sky-500/20\">4 Items</span>\n          </h1>\n        </div>\n      </div>\n\n      <!-- Live Score & Streak & Audio HUD -->\n      <div class=\"flex items-center gap-3 ml-auto\">\n        <div class=\"flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900/90 border border-white/10\">\n          <div class=\"text-right\">\n            <div class=\"text-[10px] uppercase font-bold text-slate-400 tracking-wider\">Score</div>\n            <div id=\"hud-score\" class=\"text-sm font-black text-sky-400 font-mono\">0 pts</div>\n          </div>\n          <div class=\"h-6 w-px bg-white/10\"></div>\n          <div class=\"text-right\">\n            <div class=\"text-[10px] uppercase font-bold text-slate-400 tracking-wider\">Streak</div>\n            <div id=\"hud-streak\" class=\"text-sm font-black text-amber-400 font-mono\">0 🔥</div>\n          </div>\n        </div>\n\n        <button id=\"btn-sound\" class=\"p-2 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-white/10 text-slate-300 hover:text-white transition-all text-sm\" title=\"Toggle Sound\">\n          🔊\n        </button>\n      </div>\n    </div>\n\n    <!-- Stepper Progress Bar -->\n    <div class=\"max-w-6xl mx-auto mt-2\">\n      <div class=\"flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1\">\n        <span id=\"step-label\">Question 1 of 4: 4 Pics 1 Word</span>\n        <span id=\"progress-pct\" class=\"font-mono text-emerald-400\">25% Completed</span>\n      </div>\n      <div class=\"h-1.5 w-full bg-slate-800 rounded-full overflow-hidden\">\n        <div id=\"quiz-progress-bar\" class=\"h-full bg-gradient-to-r from-emerald-500 via-sky-500 to-indigo-500 w-1/4 transition-all duration-500 rounded-full\"></div>\n      </div>\n    </div>\n  </header>\n\n  <!-- Main Container -->\n  <main class=\"max-w-4xl mx-auto px-2 sm:px-4 py-3 sm:py-8 pb-36 sm:pb-20 relative z-10\">\n\n    <!-- ========================================== -->\n    <!-- ITEM 1: 4 PICS 1 WORD (GREEDY) -->\n    <!-- ========================================== -->\n    <section id=\"item-0\" class=\"quiz-item space-y-4 sm:space-y-6\">\n      <div class=\"text-center max-w-2xl mx-auto\">\n        <div class=\"inline-flex items-center gap-1.5 px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] sm:text-xs font-bold uppercase tracking-wider mb-1\">\n          <span>📸 Item 1 of 4</span>\n          <span>•</span>\n          <span>4-Pics Identification</span>\n        </div>\n        <h2 class=\"text-lg sm:text-3xl font-black text-white\">What Core Concept Do These 4 Pictures Describe?</h2>\n        <p class=\"text-xs sm:text-sm text-slate-400 mt-1\">\n          Tap any clue to enlarge. Form the algorithm word below:\n        </p>\n      </div>\n\n      <!-- 4 Pictures: Compact Single Row on Mobile, 4-Cols on Desktop -->\n      <div class=\"grid grid-cols-4 gap-1.5 sm:gap-4\">\n 0 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-200\">\n    <div class=\"glass-panel p-6 max-w-md w-full relative space-y-4 border-sky-500/30\">\n      <button onclick=\"closeZoom()\" class=\"absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-sm font-bold\">\n        ✕\n      </button>\n      <div id=\"zoom-content\" class=\"w-full aspect-square bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center p-4\"></div>\n      <div>\n        <h3 id=\"zoom-title\" class=\"text-base font-extrabold text-white\"></h3>\n        <p id=\"zoom-desc\" class=\"text-xs text-slate-400 mt-1 leading-relaxed\"></p>\n      </div>\n    </div>\n  </div>\n\n  <script>\n    // ==========================================\n    // SOUND FX SYSTEM (Web Audio API Synthesizer)\n    // ==========================================\n    let soundEnabled = true;\n    const AudioCtx = window.AudioContext || window.webkitAudioContext;\n    let actx = null;\n\n    function getAudioCtx() {\n      if (!actx) actx = new AudioCtx();\n      if (actx.state === 'suspended') actx.resume();\n      return actx;\n    }\n\n    function playTone(freq, type, duration, delay = 0) {\n      if (!soundEnabled) return;\n      try {\n        const ctx = getAudioCtx();\n        const osc = ctx.createOscillator();\n        const gain = ctx.createGain();\n        osc.type = type;\n        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);\n        gain.gain.setValueAtTime(0.12, ctx.currentTime + delay);\n        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);\n        osc.connect(gain);\n        gain.connect(ctx.destination);\n        osc.start(ctx.currentTime + delay);\n        osc.stop(ctx.currentTime + delay + duration);\n      } catch (e) {}\n    }\n\n    function soundLetterPlace() {\n      playTone(520, 'sine', 0.08);\n    }\n    function soundLetterRemove() {\n      playTone(320, 'sine', 0.08);\n    }\n    function soundCorrect() {\n      playTone(523.25, 'triangle', 0.12, 0);     // C5\n      playTone(659.25, 'triangle', 0.12, 0.09);  // E5\n      playTone(783.99, 'triangle', 0.18, 0.18);  // G5\n      playTone(1046.50, 'triangle', 0.35, 0.28); // C6\n    }\n    function soundWrong() {\n      playTone(220, 'sawtooth', 0.15, 0);\n      playTone(180, 'sawtooth', 0.25, 0.12);\n    }\n    function soundPillSwallow() {\n      playTone(400, 'sine', 0.12, 0);\n      playTone(800, 'triangle', 0.2, 0.08);\n    }\n    function soundFanfare() {\n      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];\n      notes.forEach((n, idx) => playTone(n, 'triangle', 0.25, idx * 0.1));\n    }\n\n    const btnSound = document.getElementById('btn-sound');\n    btnSound.onclick = () => {\n      soundEnabled = !soundEnabled;\n      btnSound.textContent = soundEnabled ? '🔊' : '🔇';\n      btnSound.title = soundEnabled ? 'Sound is ON' : 'Sound is MUTED';\n    };\n\n    // ==========================================\n    // QUIZ STATE & DATA\n    // ==========================================\n    let score = 0;\n    let streak = 0;\n    let maxStreak = 0;\n    let currentItemIdx = 0;\n\n    const quizItems = [\n      {\n        type: '4pic',\n        word: 'GREEDY',\n        tiles: ['O', 'D', 'P', 'E', 'A', 'Y', 'M', 'R', 'L', 'G', 'T', 'E'],\n        explanation: '🎯 Spot on! A <b>GREEDY</b> algorithm takes the most advantageous choice available at the immediate moment (a local optimum) and never backtracks, hoping it leads to a global optimum.'\n      },\n      {\n        type: '4pic',\n        word: 'BRUTEFORCE',\n        displaySeparators: [5], // Space after index 5 (BRUTE FORCE)\n        tiles: ['K', 'R', 'C', 'T', 'X', 'O', 'E', 'P', 'B', 'F', 'U', 'L', 'E', 'R'],\n        explanation: '🎯 Exactly! <b>BRUTE FORCE</b> checks all 2ⁿ subsets or n! permutations. As Slide 1 notes, with 30 items, 2³⁰ requires over 1 billion tries, becoming computationally impossible.'\n      },\n      {\n        type: 'pill',\n        correctPill: 'red',\n        explanationCorrect: '🔴 You took the Red Pill and saw the truth! Slide 1\\'s generic blueprint explicitly documents: <code># Permanent commitment: no undo / backtracking</code>. Once a choice is added, it is locked in permanently.',\n        explanationWrong: '🔵 You swallowed the Blue Pill of false comfort! A Greedy algorithm NEVER undoes choices or backtracks on previous decisions. Backtracking belongs to exhaustive recursion or Dynamic Programming!'\n      },\n      {\n        type: 'pill',\n        correctPill: 'red',\n        explanationCorrect: '🔴 Reality confirmed! Slide 1 points out that ₱20, ₱10, ₱5, and ₱1 divide neatly into each other. Replacing one ₱20 requires at least two ₱10 coins, so skipping the larger coin always requires more or equal total coins.',\n        explanationWrong: '🔵 You fell for the illusion! Slide 1 explicitly warns: <i>\"With odd coins (like 1, 3, 4) greedy can fail, which later slides explore.\"</i> For target 6 with {4, 3, 1}, greedy takes 4+1+1 (3 coins) while optimal is 3+3 (2 coins)!'\n      }\n    ];\n\n    // Per-item answers for 4-pic items\n    const answers = [\n      Array(6).fill(''),\n      Array(10).fill('')\n    ];\n    const usedBankTiles = [\n      Array(12).fill(false),\n      Array(14).fill(false)\n    ];\n\n    function updateHUD() {\n      document.getElementById('hud-score').textContent = score + ' pts';\n      document.getElementById('hud-streak').textContent = streak + ' 🔥';\n      if (streak > maxStreak) maxStreak = streak;\n\n      const pct = Math.round(((currentItemIdx + 1) / 4) * 100);\n      document.getElementById('progress-pct').textContent = (currentItemIdx >= 4 ? 100 : pct) + '% Completed';\n      document.getElementById('quiz-progress-bar').style.width = (currentItemIdx >= 4 ? 100 : pct) + '%';\n\n      if (currentItemIdx < 4) {\n        const itemType = quizItems[currentItemIdx].type === '4pic' ? '4 Pics 1 Word' : 'Red or Blue Pill';\n        document.getElementById('step-label').textContent = `Question ${currentItemIdx + 1} of 4: ${itemType}`;\n      } else {\n        document.getElementById('step-label').textContent = 'Completed!';\n      }\n    }\n\n    // ==========================================\n    // RENDER 4-PICS ITEMS (0 and 1)\n    // ==========================================\n    function render4PicItem(itemIdx) {\n      const data = quizItems[itemIdx];\n      const slotsContainer = document.getElementById('slots-' + itemIdx);\n      const bankContainer = document.getElementById('bank-' + itemIdx);\n\n      // Render Slots\n      slotsContainer.innerHTML = '';\n      if (data.displaySeparators) {\n        // Multi-word grouping (e.g. BRUTE and FORCE)\n        const part1 = document.createElement('div');\n        part1.className = 'flex items-center gap-1.5 sm:gap-2';\n        const part2 = document.createElement('div');\n        part2.className = 'flex items-center gap-1.5 sm:gap-2';\n\n        data.word.split('').forEach((letter, i) => {\n          const slot = document.createElement('div');\n          slot.className = 'letter-slot' + (answers[itemIdx][i] ? ' filled' : '');\n          slot.textContent = answers[itemIdx][i] || '';\n          slot.onclick = () => removeLetter(itemIdx, i);\n          if (i < data.displaySeparators[0]) {\n            part1.appendChild(slot);\n          } else {\n            part2.appendChild(slot);\n          }\n        });\n        slotsContainer.appendChild(part1);\n        slotsContainer.appendChild(part2);\n      } else {\n        data.word.split('').forEach((letter, i) => {\n          const slot = document.createElement('div');\n          slot.className = 'letter-slot' + (answers[itemIdx][i] ? ' filled' : '');\n          slot.textContent = answers[itemIdx][i] || '';\n          slot.onclick = () => removeLetter(itemIdx, i);\n          slotsContainer.appendChild(slot);\n        });\n      }\n\n      // Render Bank Tiles\n      bankContainer.innerHTML = '';\n      data.tiles.forEach((letter, tileIdx) => {\n        const btn = document.createElement('button');\n        btn.className = 'bank-tile';\n        btn.textContent = letter;\n        btn.disabled = usedBankTiles[itemIdx][tileIdx];\n        btn.onclick = () => placeLetter(itemIdx, tileIdx, letter);\n        bankContainer.appendChild(btn);\n      });\n    }\n\n    function placeLetter(itemIdx, tileIdx, letter) {\n      const data = quizItems[itemIdx];\n      // Find first empty slot\n      const emptySlotIdx = answers[itemIdx].findIndex(ch => ch === '');\n      if (emptySlotIdx === -1) return; // All full\n\n      answers[itemIdx][emptySlotIdx] = letter;\n      usedBankTiles[itemIdx][tileIdx] = true;\n      soundLetterPlace();\n\n      render4PicItem(itemIdx);\n      check4PicAnswer(itemIdx);\n    }\n\n    function removeLetter(itemIdx, slotIdx) {\n      if (!answers[itemIdx][slotIdx]) return;\n      const charToRemove = answers[itemIdx][slotIdx];\n      answers[itemIdx][slotIdx] = '';\n\n      // Free corresponding tile in bank\n      const data = quizItems[itemIdx];\n      for (let i = 0; i < data.tiles.length; i++) {\n        if (data.tiles[i] === charToRemove && usedBankTiles[itemIdx][i]) {\n          usedBankTiles[itemIdx][i] = false;\n          break;\n        }\n      }\n      soundLetterRemove();\n      render4PicItem(itemIdx);\n    }\n\n    function backspace(itemIdx) {\n      // Remove last filled letter\n      for (let i = answers[itemIdx].length - 1; i >= 0; i--) {\n        if (answers[itemIdx][i] !== '') {\n          removeLetter(itemIdx, i);\n          break;\n        }\n      }\n    }\n\n    function clearSlots(itemIdx) {\n      answers[itemIdx].fill('');\n      usedBankTiles[itemIdx].fill(false);\n      soundLetterRemove();\n      render4PicItem(itemIdx);\n    }\n\n    function giveHint(itemIdx) {\n      const data = quizItems[itemIdx];\n      // Find first slot where answer is empty or incorrect\n      let targetSlot = -1;\n      for (let i = 0; i < data.word.length; i++) {\n        if (answers[itemIdx][i] !== data.word[i]) {\n          targetSlot = i;\n          break;\n        }\n      }\n      if (targetSlot === -1) return;\n\n      // Deduct points for hint\n      score = Math.max(0, score - 20);\n      updateHUD();\n\n      // If already filled with wrong letter, free it\n      if (answers[itemIdx][targetSlot] !== '') {\n        removeLetter(itemIdx, targetSlot);\n      }\n\n      // Find unused matching letter in bank\n      const targetChar = data.word[targetSlot];\n      let foundBankIdx = -1;\n      for (let i = 0; i < data.tiles.length; i++) {\n        if (data.tiles[i] === targetChar && !usedBankTiles[itemIdx][i]) {\n          foundBankIdx = i;\n          break;\n        }\n      }\n\n      if (foundBankIdx !== -1) {\n        placeLetter(itemIdx, foundBankIdx, targetChar);\n      }\n    }\n\n    function check4PicAnswer(itemIdx) {\n      // Subtly play letter sound without revealing answer\n      const data = quizItems[itemIdx];\n      const currentWord = answers[itemIdx].join('');\n      if (currentWord.length === data.word.length) {\n        soundLetterPlace();\n      }\n    }\n\n    function submit4PicAndNext(itemIdx) {\n      const data = quizItems[itemIdx];\n      const currentWord = answers[itemIdx].join('');\n      if (currentWord === data.word) {\n        score += 100;\n        streak++;\n      } else {\n        streak = 0;\n      }\n      updateHUD();\n      advanceNextItem();\n    }\n\n    // Bind item 0 and item 1 buttons\n    document.getElementById('btn-backspace-0').onclick = () => backspace(0);\n    document.getElementById('btn-clear-0').onclick = () => clearSlots(0);\n    document.getElementById('btn-hint-0').onclick = () => giveHint(0);\n\n    document.getElementById('btn-backspace-1').onclick = () => backspace(1);\n    document.getElementById('btn-clear-1').onclick = () => clearSlo
