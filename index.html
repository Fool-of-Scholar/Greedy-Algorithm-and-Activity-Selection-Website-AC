g> a ride if it starts at or after your last accepted ride ends.</li>\n        </ul>\n      </div>\n      <div class=\"rule\">\n        The greedy choice: <strong>finish early, leave room for what’s next.</strong> EFT runs in <code>O(n log n)</code> time, bound primarily by sorting; the scan afterwards is just <code>O(n)</code>.\n      </div>\n    </section>\n\n    <section class=\"card code-card\" aria-labelledby=\"code-title\">\n      <div class=\"code-head\">\n        <span id=\"code-title\">Python · EFT schedule</span>\n        <button id=\"copy-code\" type=\"button\" aria-label=\"Copy Python code\">Copy code</button>\n      </div>\n      <div class=\"code-wrap\">\n        <pre aria-label=\"Python implementation with synchronized execution cursor\"><code id=\"code-block\"></code></pre>\n      </div>\n    </section>\n\n    <section class=\"card\" aria-labelledby=\"how-title\">\n      <h2 id=\"how-title\">🧭 How the greedy rule works</h2>\n      <p>Once rides are ordered by when they end, each choice preserves as much room as possible for the remaining schedule.</p>\n      <p>When a ride overlaps the last accepted one, skip it and check the next finish time. Ending exactly when the next ride starts is allowed.</p>\n      <p>Why not pick the shortest ride or the earliest start? Both can be fooled: a short ride in the middle can block two others, and an early start can lock you into a very long ride. Only the earliest <em>finish</em> never costs you future options.</p>\n      <div class=\"result\" style=\"margin-top:15px\">\n        Greedy stays ahead: every choice ends no later than any compatible alternative at that step.\n      </div>\n    </section>\n\n    <section class=\"card sim\" aria-labelledby=\"sim-title\">\n      <div class=\"sim-top\">\n        <div>\n          <h2 id=\"sim-title\">🎢 Interactive Ride Simulator</h2>\n          <p>Step through rides in finish-time order and watch the greedy schedule build.</p>\n        </div>\n        <button class=\"add-button\" id=\"open-form\" type=\"button\">＋ Add custom ride</button>\n      </div>\n\n      <div class=\"preset-bar\">\n        <span class=\"preset-label\">Presets:</span>\n        <button class=\"preset-btn on\" data-preset=\"default\" type=\"button\">Classic Theme Park</button>\n        <button class=\"preset-btn\" data-preset=\"trap\" type=\"button\">Greedy Coaster Trap</button>\n        <button class=\"preset-btn\" data-preset=\"dense\" type=\"button\">Tight Back-to-Back</button>\n      </div>\n\n      <div class=\"timeline-container\" id=\"timeline\">\n        <div class=\"axis\" aria-hidden=\"true\">\n          <span>1 PM</span><span>2 PM</span><span>3 PM</span><span>4 PM</span><span>5 PM</span><span>6 PM</span><span>7 PM</span><span>8 PM</span><span>9 PM</span>\n        </div>\n        <div id=\"cutoff-line\" class=\"cutoff-line\" style=\"display:none\">\n          <div id=\"cutoff-badge\" class=\"cutoff-badge\">Last finish</div>\n        </div>\n        <div id=\"ride-list\" class=\"ride-list\" role=\"group\" aria-label=\"Ride schedule timeline from 1 PM to 9 PM\"></div>\n      </div>\n\n      <div class=\"legend\" aria-label=\"Timeline legend\">\n        <span><i class=\"dot purple\"></i>Evaluating</span>\n        <span><i class=\"dot\"></i>Accepted</span>\n        <span><i class=\"dot gray\"></i>Skipped / Upcoming</span>\n      </div>\n\n      <div id=\"trace-info\" class=\"trace-info\" aria-live=\"polite\" aria-atomic=\"true\"></div>\n\n      <div class=\"controls\" aria-label=\"Simulator controls\">\n        <button id=\"previous\" type=\"button\">← Previous</button>\n        <button id=\"next\" class=\"primary\" type=\"button\">Next step →</button>\n        <button id=\"play\" type=\"button\">▶ Auto-play</button>\n        <button id=\"reset\" type=\"button\">Reset</button>\n        <span class=\"hint\">Shortcuts: ← → R</span>\n        <span id=\"progress\" class=\"progress\" aria-live=\"polite\"></span>\n      </div>\n\n      <div id=\"ride-chips\" class=\"ride-chips\" aria-label=\"Ride statuses\"></div>\n\n      <div class=\"stats-bar\">\n        <div class=\"stat-card\"><div id=\"stat-count\" class=\"val\">0 / 0</div><div class=\"lbl\">Rides Accepted</div></div>\n        <div class=\"stat-card\"><div id=\"stat-time\" class=\"val\">0 hrs</div><div class=\"lbl\">Ride Time spent</div></div>\n        <div class=\"stat-card\"><div id=\"stat-eff\" class=\"val\">0%</div><div class=\"lbl\">Park Efficiency</div></div>\n      </div>\n\n      <div id=\"result\" class=\"result\" aria-live=\"polite\"></div>\n    </section>\n  </div>\n</main>\n\n<div id=\"ride-modal\" class=\"modal\" hidden>\n  <section class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dialog-title\" aria-describedby=\"form-help\">\n    <div class=\"dialog-head\">\n      <h2 id=\"dialog-title\">Add a park ride</h2>\n      <button class=\"close\" id=\"close-form\" type=\"button\" aria-label=\"Close dialog\">✕</button>\n    </div>\n    <p id=\"form-help\">Enter times between 1:00 PM and 9:00 PM. Finish must be after start time.</p>\n    <form id=\"ride-form\" class=\"form-grid\">\n      <label>Ride name<input name=\"name\" required maxlength=\"40\" placeholder=\"Skyline Flyer\"></label>\n      <label>Start time<input name=\"start\" type=\"time\" min=\"13:00\" max=\"21:00\" required value=\"15:00\"></label>\n      <label>Finish time<input name=\"finish\" type=\"time\" min=\"13:00\" max=\"21:00\" required value=\"16:00\"></label>\n      <div id=\"form-error\" class=\"form-error\" role=\"alert\"></div>\n      <button class=\"form-submit\" type=\"submit\">Add ride &amp; rerun</button>\n    </form>\n  </section>\n</div>\n\n<script>\n(() => {\n  const $ = id => document.getElementById(id);\n  const source = [\n    \"def eft_ride_solver(rides):\",\n    \"    solution = []\",\n    \"    # 1. Sort by finish time ascending\",\n    \"    ordered = sorted(rides, key=lambda r: r['finish'])\",\n    \"    last_finish = float('-inf')\",\n    \"    for ride in ordered:\",\n    \"        # 2. Accept if ride starts after last finish\",\n    \"        if ride['start'] >= last_finish:\",\n    \"            solution.append(ride)\",\n    \"            last_finish = ride['finish']\",\n    \"    return solution\"\n  ];\n  const escapeHtml = s => String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\n  $('code-block').innerHTML = source.map((line, i) => {\n    const safe = escapeHtml(line)\n      .replace(/(#[^&]*$)/, '<span class=\"comment\">$1</span>')\n      .replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g, '<span class=\"str\">$1</span>')\n      .replace(/\\b(def|for|in|if|return)\\b/g, '<span class=\"kw\">$1</span>')\n      .replace(/\\b(eft_ride_solver|sorted|float)\\b/g, '<span class=\"fn\">$1</span>');\n    return `<span class=\"code-line\" data-line=\"${i + 1}\">${safe || ' '}</span>`;\n  }).join('');\n\n  const PRESETS = {\n    default: [\n      { name: 'Mega Coaster', start: 13, finish: 17 },\n      { name: 'Water Splash', start: 13, finish: 14.5 },\n      { name: 'Haunted Manor', start: 14, finish: 16 },\n      { name: 'Ferris Wheel', start: 14.5, finish: 15.5 },\n      { name: 'Pirate Ship', start: 15.5, finish: 17 }\n    ],\n    trap: [\n      { name: 'Monster Coaster (4hr)', start: 13, finish: 17 },\n      { name: 'Bumper Cars', start: 13, finish: 14 },\n      { name: 'Log Flume', start: 14, finish: 15 },\n      { name: 'Carousel', start: 15, finish: 16 },\n      { name: 'Drop Tower', start: 16, finish: 17 }\n    ],\n    dense: [\n      { name: 'Haunted House', start: 13, finish: 14 },\n      { name: 'Laser Tag', start: 13.5, finish: 15 },\n      { name: 'Go Karts', start: 14, finish: 15.5 },\n      { name: '4D Theater', start: 15.5, finish: 17 },\n      { name: 'Arcade Rush', start: 17, finish: 19 }\n    ]\n  };\n\n  const load = type => PRESETS[type].map((r, i) => ({ ...r, id: `p-${type}-${i}` }));\n  let rides = load('default'), order = [], step = -1, timer = null, uid = 0;\n\n  const list = $('ride-list'), info = $('trace-info'), chips = $('ride-chips');\n  const cutoffLine = $('cutoff-line'), cutoffBadge = $('cutoff-badge');\n\n  const fmt = t => {\n    let h = Math.floor(t), m = Math.round((t - h) * 60);\n    if (m === 60) { h++; m = 0; }\n    const period = h >= 12 ? 'PM' : 'AM';\n    return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${period}`;\n  };\n  const hrs = n => `${+n.toFixed(2)} ${n === 1 ? 'hr' : 'hrs'}`;\n\n  // Greedy decisions for every position in `order`, computed once per run.\n  let decisions = [];\n  function computeDecisions() {\n    decisions = [];\n    let last = null;\n    order.forEach(r => {\n      const ok = !last || r.start >= last.finish;\n      decisions.push({ ok, blocker: ok ? null : last, prev: last });\n      if (ok) last = r;\n    });\n  }\n  const acceptedThrough = k => order.filter((_, i) => i <= k && decisions[i].ok);\n\n  function highlightLine(nums) {\n    document.querySelectorAll('.code-line').forEach(l => l.classList.remove('active'));\n    [].concat(nums).forEach(n => document.querySelector(`.code-line[data-line=\"${n}\"]`)?.classList.add('active'));\n  }\n\n  function stopPlay() {\n    if (timer) { clearInterval(timer); timer = null; }\n    $('play').textContent = '▶ Auto-play';\n  }\n\n  function placeCutoff(last) {\n    if (!last || step < 0 || step >= order.length) { cutoffLine.style.display = 'none'; return; }\n    const track = list.querySelector('.track');\n    if (!track) return;\n    const t = track.getBoundingClientRect(), c = $('timeline').getBoundingClientRect();\n    cutoffLine.style.display = 'block';\n    cutoffLine.style.left = `${t.left - c.left + t.width * (last.finish - 13) / 8 - 1}px`;\n    cutoffBadge.textContent = `Last finish: ${fmt(last.finish)}`;\n  }\n\n  function draw() {\n    list.innerHTML = '';\n    const done = step >= order.length;\n    const acc = step < 0 ? [] : acceptedThrough(Math.min(step, order.length - 1));\n    const cur = step >= 0 && !done ? order[step] : null;\n    const dec = cur ? decisions[step] : null;\n\n    if (!rides.length) {\n      list.innerHTML = '<p style=\"color:#8a94a6;font-size:.9rem;margin:8px 0\">No rides yet. Add a custom ride or pick a preset.</p>';\n    }\n\n    rides.forEach(ride => {\n      const row = document.createElement('div');\n      row.className = 'ride-row';\n      const meta = document.createElement('div');\n      meta.className = 'ride-meta';\n      const name = document.createElement('div');\n      name.className = 'ride-name';\n      name.textContent = ride.name;\n      name.title = ride.name;\n      meta.append(name);\n      if (step === -1) {\n        const del = document.createElement('button');\n        del.className = 'delete-btn';\n        del.textContent = '✕';\n        del.title = del.ariaLabel = `Remove ${ride.name}`;\n        del.onclick = () => { rides = rides.filter(r => r.id !== ride.id); run(); };\n        meta.append(del);\n      }\n      const track = document.createElement('div');\n      track.className = 'track';\n      const bar = document.createElement('div');\n      const idx = order.indexOf(ride);\n      let status = 'pending';\n      if (idx >= 0 && idx <= step) status = decisions[idx].ok ? 'accepted' : 'rejected';\n      bar.className = `bar ${status}${cur === ride ? ' current' : ''}`;\n      bar.style.left = `${((ride.start - 13) / 8) * 100}%`;\n      bar.style.width = `${Math.max(3, ((ride.finish - ride.start) / 8) * 100)}%`;\n      bar.textContent = `${fmt(ride.start)}–${fmt(ride.finish)}`;\n      bar.title = `${ride.name}: ${fmt(ride.start)}–${fmt(ride.finish)}`;\n      track.append(bar);\n      row.append(meta, track);\n      list.append(row);\n    });\n\n    chips.innerHTML = '';\n    order.forEach((ride, i) => {\n      const s = i > step ? 'pending' : decisions[i].ok ? 'accepted' : 'rejected';\n      const chip = document.createElement('span');\n      chip.className = 'ride-chip';\n      chip.innerHTML = `${escapeHtml(ride.name)} <span class=\"badge ${s}\">${s === 'accepted' ? 'Accepted' : s === 'rejected' ? 'Rejected · Overlap' : 'Up next'}</span>`;\n      chips.append(chip);\n    });\n\n    placeCutoff(dec ? dec.prev : null);\n\n    if (!order.length) {\n      highlightLine([]);\n      info.innerHTML = '<strong>Nothing to schedule</strong><p>Add at least one ride to start the simulation.</p>';\n    } else if (step < 0) {\n      highlightLine([1, 2, 3, 4, 5]);\n      info.innerHTML = '<strong>Ready to evaluate</strong><p>Rides are sorted in ascending order of finish time. Click <strong>Next step</strong> to evaluate the first ride.</p>';\n    } else if (done) {\n      highlightLine(11);\n      const n = acc.length;\n      info.innerHTML = `<strong>Schedule complete!</strong><p>All rides have been evaluated. EFT is guaranteed to pick the maximum number of non-overlapping rides, here ${n} of ${order.length}.</p>`;\n    } else if (dec.ok) {\n      highlightLine([6, 8, 9, 10]);\n      info.innerHTML = `<strong>Step ${step + 1} of ${order.length}: ${escapeHtml(cur.name)} · <span style=\"color:#148367\">Accepted</span></strong><p>${dec.prev\n        ? `Start time (${fmt(cur.start)}) ≥ last finish time (${fmt(dec.prev.finish)}). Ride fits into schedule!`\n        : `First ride in queue! Nothing to conflict with, so it is accepted.`}</p><p class=\"why\">Accepting it moves the last finish to ${fmt(cur.finish)}.</p>`;\n    } else {\n      highlightLine([6, 8]);\n      info.innerHTML = `<strong>Step ${step + 1} of ${order.length}: ${escapeHtml(cur.name)} · <span style=\"color:#ba5d4e\">Skipped (Overlap)</span></strong><p>Start time (${fmt(cur.start)}) &lt; last finish time (${fmt(dec.blocker.finish)}). This ride overlaps with <strong>${escapeHtml(dec.blocker.name)}</strong>.</p>`;\n    }\n\n    $('previous').disabled = step < 0;\n    $('next').disabled = step >= order.length || !order.length;\n    $('play').disabled = $('next').disabled;\n    $('progress').textContent = !order.length ? '' : step < 0 ? 'Ready' : done ? 'Completed' : `Ride ${step + 1} of ${order.length}`;\n\n    const spent = acc.reduce((s, r) => s + (r.finish - r.start), 0);\n    $('stat-count').textContent = `${acc.length} / ${rides.length}`;\n    $('stat-time').textContent = hrs(spent);\n    $('stat-eff').textContent = `${Math.round((spent / 8) * 100)}%`;\n    $('result').textContent = done\n      ? `Final Schedule: ${acc.length ? acc.map(r => r.name).join(' → ') : 'No rides'} (${acc.length} ${acc.length === 1 ? 'ride' : 'rides'} selected).`\n      : 'Step through the timeline to evaluate ride choices.';\n  }\n\n  function run() {\n    stopPlay();\n    order = [...rides].sort((a, b) => a.finish - b.finish || a.start - b.start || a.name.localeCompare(b.name));\n    computeDecisions();\n    step = -1;\n    draw();\n  }\n  function next() {\n    if (step + 1 > order.length || !order.length) return;\n    if (step >= order.length) return;\n    step++;\n    if (step >= order.length) stopPlay();\n    draw();\n  }\n  function prev() {\n    if (step < 0) return;\n    stopPlay();\n    step--;\n    draw();\n  }\n  function togglePlay() {\n    if (timer) { stopPlay(); return; }\n    if (step >= order.length) return;\n    $('play').textContent = '❚❚ Pause';\n    next();\n    if (step < order.length) timer = setInterval(next, 1300);\n  }\n\n  $('next').addEventListener('click', () => { stopPlay(); next(); });\n  $('previous').addEventListener('click', prev);\n  $('reset').addEventListener('click', run);\n  $('play').addEventListener('click', togglePlay);\n  window.addEventListener('resize', () => { if (step >= 0 && step < order.length) draw(); });\n\n  document.addEventListener('keydown', e => {\n    if (e.key === 'Escape' && !$('ride-modal').hidden) { closeModal(); return; }\n    if (!$('ride-modal').hidden || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;\n    if (e.key === 'ArrowRight') { stopPlay(); next(); }\n    if (e.key === 'ArrowLeft') prev();\n    if (e.key === 'r' || e.key === 'R') run();\n  });\n\n  document.querySelectorAll('.preset-btn').forEach(btn => btn.addEventListener('click', () => {\n    document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('on', b === btn));\n    rides = load(btn.dataset.preset);\n    run();\n  }));\n\n  $('copy-code').addEventListener('click', async e => {\n    const b = e.currentTarget;\n    try { await navigator.clipboard.writeText(source.join('\\n')); b.textContent = 'Copied!'; }\n    catch { b.textContent = 'Copy unavailable'; }\n    setTimeout(() => b.textContent = 'Copy code', 1500);\n  });\n\n  const modal = $('ride-modal'), form = $('ride-form'), error = $('form-error');\n  function closeModal() { modal.hidden = true; error.textContent = ''; $('open-form').focus(); }\n  $('open-form').addEventListener('click', () => { modal.hidden = false; form.elements.name.focus(); });\n  $('close-form').addEventListener('click', closeModal);\n  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });\n\n  form.addEventListener('submit', e => {\n    e.preventDefault();\n    const d = new FormData(form);\n    const name = String(d.get('name')).trim();\n    const toHour = v => { const [h, m] = String(v).split(':').map(Number); return h + m / 60; };\n    const start = toHour(d.get('start')), finish = toHour(d.get('finish'));\n    if (!name || !Number.isFinite(start) || !Number.isFinite(finish) || start < 13 || finish > 21 || finish <= start) {\n      error.textContent = 'Enter a valid name and times between 1 PM and 9 PM. Finish time must be after start time.';\n      return;\n    }\n    rides.push({ id: `custom-${++uid}`, name, start, finish });\n    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('on'));\n    form.reset();\n    run();\n    closeModal();\n  });\n\n  run();\n})();\n<\/script>\n</body>\n</html>\n"},{"id":5,"tag":"Topic 05","title":"Tracing the Activity Selection Algorithm","shortTitle":"Interactive Trace","subtitle":"Deep-Dive Interactive Tracing, Visual State Matrix & Step Log","badge":"Visualizer","file":"activity_selection_presentation.html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Tracing the Activity Selection</title>\n  <style>\n    :root {\n      --bg-dark: #070b14;\n      --bg-surface: #0f172a;\n      --bg-surface-elevated: #1e293b;\n      --border-color: #1e293b;\n      --border-accent: #334155;\n      --primary: #6366f1;\n      --primary-hover: #4f46e5;\n      --primary-light: #a5b4fc;\n      --cyan: #06b6d4;\n      --cyan-light: #67e8f9;\n      --emerald: #10b981;\n      --emerald-light: #6ee7b7;\n      --rose: #f43f5e;\n      --rose-light: #fda4af;\n      --amber: #f59e0b;\n      --amber-light: #fde68a;\n      --text-white: #ffffff;\n      --text-high: #f8fafc;\n      --text-medium: #cbd5e1;\n      --text-muted: #94a3b8;\n      --text-low: #64748b;\n      --radius-sm: 4px;\n      --radius-md: 8px;\n      --radius-lg: 12px;\n      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n    }\n\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    html, body {\n      height: 100%;\n      width: 100%;\n      overflow: hidden; /* Zero page scroll */\n      background-color: var(--bg-dark);\n      color: var(--text-high);\n      font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Open Sans\", sans-serif;\n      user-select: text;\n    }\n\n    /* Top Accent Progress Bar */\n    .top-progress-accent {\n      height: 3px;\n      width: 100%;\n      background: #1e293b;\n      position: fixed;\n      top: 0;\n      left: 0;\n      z-index: 100;\n    }\n\n    .top-progress-fill {\n      height: 100%;\n      width: 9%;\n      background: linear-gradient(90deg, var(--cyan), var(--primary-light));\n      transition: width 0.3s ease;\n    }\n\n    /* Fixed Viewport Container (Optimized height: 100vh - 48px footer) */\n    .deck-viewport {\n      height: calc(100vh - 48px);\n      width: 100vw;\n      overflow: hidden;\n      display: flex;\n      flex-direction: column;\n      position: relative;\n    }\n\n    /* Slide Frame */\n    .slide-frame {\n      display: none;\n      height: 100%;\n      width: 100%;\n      max-width: 1480px;\n      margin: 0 auto;\n      padding: 16px 36px 10px 36px;\n      flex-direction: column;\n      justify-content: flex-start;\n      box-sizing: border-box;\n      overflow: hidden;\n    }\n\n    .slide-frame.active {\n      display: flex;\n      animation: fadeIn 0.2s ease-out;\n    }\n\n    @keyframes fadeIn {\n      from { opacity: 0; transform: translateY(4px); }\n      to { opacity: 1; transform: translateY(0); }\n    }\n\n    /* ================= VISIBLE TEXT HIERARCHY ================= */\n    /* Enlarged slide-hero-header for clear prominence */\n    .slide-hero-header {\n      margin-bottom: 14px;\n      padding-bottom: 6px;\n      border-bottom: 1px solid rgba(255, 255, 255, 0.08);\n      flex-shrink: 0;\n    }\n\n    /* Tier 1: Main Slide Titles (Enlarged) */\n    .slide-hero-title {\n      font-size: 2.15rem;\n      font-weight: 800;\n      letter-spacing: -0.03em;\n      color: var(--text-white);\n      display: flex;\n      align-items: center;\n      gap: 12px;\n      margin-bottom: 4px;\n      line-height: 1.2;\n    }\n\n    .slide-hero-title .tag {\n      font-size: 0.82rem;\n      padding: 4px 10px;\n      border-radius: 6px;\n      font-weight: 800;\n      text-transform: uppercase;\n      letter-spacing: 0.06em;\n      background: rgba(6, 182, 212, 0.16);\n      color: var(--cyan);\n      border: 1px solid rgba(6, 182, 212, 0.4);\n    }\n\n    /* Tier 2: Slide Subheadings */\n    .slide-lead-text {\n      font-size: 1.02rem;\n      font-weight: 400;\n      color: var(--text-muted);\n      line-height: 1.45;\n    }\n\n    /* Tier 3: Card Titles & Section Headings */\n    .card-title-text {\n      font-size: 1.15rem;\n      font-weight: 700;\n      color: var(--text-white);\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      letter-spacing: -0.01em;\n    }\n\n    /* Tier 4: Primary Content & Body Text */\n    .body-primary-text {\n      font-size: 1.04rem;\n      font-weight: 400;\n      color: var(--text-medium);\n      line-height: 1.55;\n    }\n\n    /* Tier 5: Key Values & Accents */\n    .key-term { color: var(--text-white); font-weight: 700; }\n    .accent-cyan-text { color: var(--cyan-light); font-weight: 700; }\n    .accent-emerald-text { color: var(--emerald-light); font-weight: 700; }\n    .accent-rose-text { color: var(--rose-light); font-weight: 700; }\n\n    /* Compact Cards */\n    .present-card {\n      background: var(--bg-surface);\n      border: 1px solid var(--border-color);\n      border-radius: var(--radius-md);\n      padding: 12px 18px;\n      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);\n      margin-bottom: 10px;\n      flex-shrink: 0;\n    }\n\n    .card-header-row {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      margin-bottom: 8px;\n    }\n\n    /* ================= VERTICAL STEPS (Greedy Approach) ================= */\n    .greedy-steps-vertical {\n      display: flex;\n      flex-direction: column;\n      gap: 8px;\n      flex: 1;\n    }\n\n    .step-card-row {\n      display: flex;\n      align-items: flex-start;\n      gap: 12px;\n      padding: 10px 16px;\n      margin-bottom: 0;\n    }\n\n    .step-num-circle {\n      width: 26px;\n      height: 26px;\n      border-radius: 50%;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-weight: 800;\n      font-size: 0.85rem;\n      flex-shrink: 0;\n      margin-top: 1px;\n    }\n\n    .step-text-wrap {\n      display: flex;\n      flex-direction: column;\n      gap: 3px;\n    }\n\n    .step-title-bold {\n      font-size: 1.05rem;\n      font-weight: 700;\n      color: #ffffff;\n    }\n\n    .step-desc-text {\n      font-size: 0.92rem;\n      color: var(--text-medium);\n      line-height: 1.45;\n    }\n\n    /* ================= IN-TABLE CONTROLS ================= */\n    .table-step-controls {\n      display: inline-flex;\n      align-items: center;\n      gap: 6px;\n      background: #090e18;\n      padding: 3px 8px;\n      border-radius: 6px;\n      border: 1px solid var(--border-accent);\n    }\n\n    .table-step-badge {\n      font-size: 0.78rem;\n      font-weight: 700;\n      color: var(--cyan-light);\n      padding: 1px 6px;\n    }\n\n    .btn-tbl {\n      background: #1e293b;\n      color: #cbd5e1;\n      border: 1px solid #334155;\n      padding: 4px 10px;\n      border-radius: 4px;\n      font-size: 0.78rem;\n      font-weight: 700;\n      cursor: pointer;\n      display: inline-flex;\n      align-items: center;\n      gap: 4px;\n      transition: all 0.15s ease;\n      user-select: none;\n    }\n\n    .btn-tbl:hover:not(:disabled) {\n      background: var(--primary);\n      border-color: var(--primary-light);\n      color: #ffffff;\n    }\n\n    .btn-tbl-primary {\n      background: linear-gradient(135deg, #0284c7, #0369a1);\n      color: #ffffff;\n      border-color: #38bdf8;\n    }\n\n    .btn-tbl-primary:hover:not(:disabled) {\n      background: linear-gradient(135deg, #0ea5e9, #0284c7);\n    }\n\n    .btn-tbl-reset {\n      background: #1e293b;\n      color: #fca5a5;\n      border-color: rgba(244, 63, 94, 0.35);\n    }\n\n    .btn-tbl-reset:hover:not(:disabled) {\n      background: rgba(244, 63, 94, 0.25);\n      border-color: var(--rose);\n      color: #ffffff;\n    }\n\n    .btn-tbl:disabled {\n      opacity: 0.3;\n      cursor: not-allowed;\n    }\n\n    /* Editable Time Inputs - Clean Borderless & No Spinners */\n    .time-input {\n      width: 100%;\n      max-width: 58px;\n      background: transparent;\n      border: none;\n      outline: none;\n      border-radius: 4px;\n      color: #ffffff;\n      font-family: inherit;\n      font-size: 0.95rem;\n      font-weight: 700;\n      text-align: center;\n      padding: 4px 2px;\n      -moz-appearance: textfield;\n      appearance: textfield;\n      transition: background-color 0.15s;\n      cursor: text;\n    }\n\n    /* Remove up and down spinner buttons across WebKit/Blink (Chrome, Edge, Safari, Opera) */\n    .time-input::-webkit-outer-spin-button,\n    .time-input::-webkit-inner-spin-button {\n      -webkit-appearance: none;\n      margin: 0;\n    }\n\n    .time-input:hover {\n      background: rgba(255, 255, 255, 0.06);\n    }\n\n    .time-input:focus {\n      background: rgba(6, 182, 212, 0.15);\n      border: none;\n      outline: none;\n    }\n\n    /* ================= PRESENTATION TABLES ================= */\n    .present-table {\n      width: 100%;\n      border-collapse: separate;\n      border-spacing: 0;\n      border-radius: 6px;\n      overflow: hidden;\n      border: 1px solid var(--border-color);\n      background: #090e1a;\n      font-size: 0.92rem;\n    }\n\n    .present-table th, .present-table td {\n      padding: 8px 14px;\n      text-align: center;\n      border-bottom: 1px solid rgba(255, 255, 255, 0.05);\n    }\n\n    .present-table th {\n      background: #131c2e;\n      color: #94a3b8;\n      font-weight: 700;\n      font-size: 0.82rem;\n      letter-spacing: 0.04em;\n      text-transform: uppercase;\n    }\n\n    .present-table tr:last-child td {\n      border-bottom: none;\n    }\n\n    .present-table tbody tr {\n      transition: background 0.15s ease;\n    }\n\n    .cell-selected {\n      background: rgba(16, 185, 129, 0.2) !important;\n      color: var(--emerald-light) !important;\n      font-weight: 700;\n    }\n\n    .cell-skipped {\n      background: rgba(244, 63, 94, 0.2) !important;\n      color: var(--rose-light) !important;\n      font-weight: 600;\n    }\n\n    .cell-highlight {\n      background: rgba(99, 102, 241, 0.25) !important;\n      color: #c7d2fe !important;\n      font-weight: 800;\n    }\n\n    .badge-pill {\n      display: inline-flex;\n      align-items: center;\n      padding: 2px 8px;\n      border-radius: 999px;\n      font-size: 0.78rem;\n      font-weight: 700;\n    }\n\n    .badge-select {\n      background: rgba(16, 185, 129, 0.2);\n      color: var(--emerald-light);\n      border: 1px solid rgba(16, 185, 129, 0.4);\n    }\n\n    .badge-skip {\n      background: rgba(244, 63, 94, 0.2);\n      color: var(--rose-light);\n      border: 1px solid rgba(244, 63, 94, 0.4);\n    }\n\n    /* ================= SLIDE 5: SPLIT LAYOUT (TRACING & TIMELINE) ================= */\n    .tracing-split-grid {\n      display: grid;\n      grid-template-columns: 1.05fr 1fr;\n      gap: 16px;\n      align-items: stretch;\n      flex: 1;\n      min-height: 0;\n    }\n\n    .trace-rows-table tr {\n      cursor: pointer;\n    }\n\n    .trace-rows-table tr.hidden-trace-row {\n      display: none;\n    }\n\n    .trace-rows-table tr.active-trace-row {\n      background: rgba(99, 102, 241, 0.25) !important;\n      box-shadow: inset 4px 0 0 var(--cyan);\n    }\n\n    /* Timeline Component */\n    .timeline-card {\n      background: var(--bg-surface);\n      border: 1px solid var(--border-color);\n      border-radius: var(--radius-md);\n      padding: 12px 16px;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);\n      flex: 1;\n      min-height: 0;\n    }\n\n    .timeline-plot {\n      background: #070c17;\n      border: 1px solid #1e293b;\n      border-radius: 6px;\n      padding: 12px 14px 30px 65px;\n      position: relative;\n      overflow: hidden;\n      flex: 1;\n      min-height: 200px;\n      max-height: 235px;\n    }\n\n    .timeline-grid-lines {\n      position: absolute;\n      top: 0;\n      bottom: 24px;\n      left: 65px;\n      right: 14px;\n      pointer-events: none;\n    }\n\n    .grid-line {\n      position: absolute;\n      top: 0;\n      bottom: 0;\n      width: 1px;\n      background: rgba(255, 255, 255, 0.05);\n    }\n\n    .plot-activity-rows {\n      position: relative;\n      z-index: 5;\n      display: flex;\n      flex-direction: column;\n      gap: 7px;\n    }\n\n    .plot-row {\n      position: relative;\n      height: 22px;\n      display: flex;\n      align-items: center;\n    }\n\n    .plot-row-label {\n      position: absolute;\n      left: -58px;\n      width: 52px;\n      text-align: right;\n      font-size: 0.78rem;\n      font-weight: 700;\n      color: #94a3b8;\n    }\n\n    .plot-bar-track {\n      position: relative;\n      width: 100%;\n      height: 100%;\n    }\n\n    .interval-bar {\n      position: absolute;\n      height: 20px;\n      top: 1px;\n      border-radius: 4px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-size: 0.75rem;\n      font-weight: 700;\n      color: #ffffff;\n      transition: all 0.22s ease;\n      white-space: nowrap;\n      overflow: hidden;\n      padding: 0 4px;\n    }\n\n    .bar-idle {\n      background: #1e293b;\n      color: #64748b;\n      border: 1px dashed #334155;\n    }\n\n    .bar-chosen {\n      background: linear-gradient(90deg, #059669, #10b981);\n      border: 1px solid #34d399;\n      color: #ffffff;\n      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);\n    }\n\n    .bar-rejected {\n      background: rgba(244, 63, 94, 0.22);\n      border: 1px dashed #f43f5e;\n      color: #fda4af;\n      text-decoration: line-through;\n      opacity: 0.75;\n    }\n\n    /* Vertical Marker */\n    .marker-last-finish {\n      position: absolute;\n      top: 0;\n      bottom: 24px;\n      width: 2px;\n      background: var(--cyan);\n      box-shadow: 0 0 10px var(--cyan);\n      z-index: 10;\n      transition: left 0.25s ease;\n      pointer-events: none;\n    }\n\n    .marker-last-finish::after {\n      content: 'last_finish = ' attr(data-val);\n      position: absolute;\n      top: 2px;\n      left: 5px;\n      background: var(--cyan);\n      color: #070c17;\n      font-size: 0.65rem;\n      font-weight: 800;\n      padding: 1px 5px;\n      border-radius: 3px;\n      white-space: nowrap;\n    }\n\n    .plot-time-axis {\n      position: absolute;\n      bottom: 0;\n      left: 65px;\n      right: 14px;\n      height: 24px;\n      border-top: 1px solid #334155;\n      display: flex;\n      justify-content: space-between;\n    }\n\n    .axis-tick {\n      position: relative;\n      width: 0;\n      font-size: 0.7rem;\n      font-weight: 600;\n      color: #64748b;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      padding-top: 3px;\n    }\n\n    .axis-tick::before {\n      content: '';\n      position: absolute;\n      top: 0;\n      width: 1px;\n      height: 4px;\n      background: #475569;\n    }\n\n    .timeline-live-summary {\n      margin-top: 8px;\n      background: rgba(16, 185, 129, 0.08);\n      border: 1px solid rgba(16, 185, 129, 0.25);\n      border-radius: 6px;\n      padding: 8px 12px;\n    }\n\n    /* ================= PYTHON CODE EDITOR BOX ================= */\n    .code-container-single {\n      background: #090e18;\n      border: 1px solid var(--border-color);\n      border-radius: var(--radius-md);\n      padding: 10px 18px;\n      font-family: var(--font-mono);\n      font-size: 0.78rem;\n      line-height: 1.35;\n      color: #e2e8f0;\n      overflow-x: auto;\n      overflow-y: hidden;\n      box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);\n      white-space: normal;\n    }\n\n    .py-comm { color: #64748b; font-style: italic; }\n    .py-kw { color: #818cf8; font-weight: 700; }\n    .py-fn { color: #34d399; font-weight: 700; }\n    .py-var { color: #f8fafc; }\n    .py-str { color: #fde68a; }\n    .py-num { color: #fb923c; }\n\n    /* Math Proof Cards */\n    .proof-card {\n      background: var(--bg-surface);\n      border: 1px solid var(--border-color);\n      border-radius: var(--radius-md);\n      padding: 12px 16px;\n      margin-bottom: 8px;\n    }\n\n    .proof-card-title {\n      font-weight: 700;\n      font-size: 0.98rem;\n      color: #a5b4fc;\n      margin-bottom: 4px;\n      display: flex;\n      align-items: center;\n      gap: 6px;\n    }\n\n    .math-symbol {\n      font-family: \"Cambria Math\", \"Times New Roman\", serif;\n      font-style: italic;\n      color: var(--cyan-light);\n      font-weight: 600;\n    }\n\n    /* Callouts */\n    .info-callout {\n      background: rgba(6, 182, 212, 0.08);\n      border-left: 3px solid var(--cyan);\n      border-radius: 0 var(--radius-md) var(--radius-md) 0;\n      padding: 8px 14px;\n      font-size: 0.92rem;\n      color: #e0f2fe;\n    }\n\n    .warning-callout {\n      background: rgba(245, 158, 11, 0.08);\n      border-left: 3px solid var(--amber);\n      border-radius: 0 var(--radius-md) var(--radius-md) 0;\n      padding: 8px 14px;\n      font-size: 0.92rem;\n      color: #fef3c7;\n    }\n\n    .success-callout {\n      background: rgba(16, 185, 129, 0.08);\n      border-left: 3px solid var(--emerald);\n      border-radius: 0 var(--radius-md) var(--radius-md) 0;\n      padding: 8px 14px;\n      font-size: 0.92rem;\n      color: #d1fae5;\n    }\n\n    /* Pinned Bottom Notes */\n    .slide-note-bottom {\n      margin-top: auto !important;\n      margin-bottom: 4px !important;\n      flex-shrink: 0;\n    }\n\n    /* ================= COMPACT BOTTOM CONTROL BAR ================= */\n    .deck-footer {\n      height: 48px;\n      background: #0b1120;\n      border-top: 1px solid var(--border-color);\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      padding: 0 24px;\n      z-index: 90;\n      flex-shrink: 0;\n      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.5);\n    }\n\n    /* Bottom Left: Slide Counter */\n    .footer-left {\n      display: flex;\n      align-items: center;\n      gap: 12px;\n    }\n\n    .slide-badge-bottom-left {\n      background: rgba(99, 102, 241, 0.16);\n      border: 1px solid rgba(99, 102, 241, 0.35);\n      color: var(--primary-light);\n      font-size: 0.82rem;\n      font-weight: 700;\n      padding: 4px 12px;\n      border-radius: 5px;\n    }\n\n    .dots-strip {\n      display: flex;\n      gap: 5px;\n      align-items: center;\n    }\n\n    .nav-pip {\n      width: 6px;\n      height: 6px;\n      border-radius: 50%;\n      background: #334155;\n      cursor: pointer;\n      transition: all 0.2s ease;\n    }\n\n    .nav-pip.active {\n      background: var(--cyan);\n      width: 16px;\n      border-radius: 999px;\n    }\n\n    /* Bottom Right: Compact Slide Navigation Buttons Side-by-Side */\n    .footer-right {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n    }\n\n    .btn-slide-nav {\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      gap: 6px;\n      padding: 6px 14px;\n      border-radius: 5px;\n      font-size: 0.82rem;\n      font-weight: 700;\n      cursor: pointer;\n      transition: all 0.15s ease;\n      border: 1px solid transparent;\n      outline: none;\n      white-space: nowrap;\n      user-select: none;\n    }\n\n    .btn-slide-nav:active {\n      transform: scale(0.97);\n    }\n\n    .btn-slide-prev {\n      background: #1e293b;\n      color: #cbd5e1;\n      border-color: #334155;\n    }\n\n    .btn-slide-prev:hover:not(:disabled) {\n      background: #28374d;\n      color: #ffffff;\n      border-color: #475569;\n    }\n\n    .btn-slide-next {\n      background: linear-gradient(135deg, #4f46e5, #4338ca);\n      color: #ffffff;\n      box-shadow: 0 1px 6px rgba(79, 70, 229, 0.4);\n    }\n\n    .btn-slide-next:hover:not(:disabled) {\n      background: linear-gradient(135deg, #6366f1, #4f46e5);\n      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.5);\n    }\n\n    .btn-slide-nav:disabled {\n      opacity: 0.3;\n      cursor: not-allowed;\n      box-shadow: none !important;\n    }\n\n    .btn-fs {\n      background: #141d2e;\n      border: 1px solid #334155;\n      color: #94a3b8;\n      padding: 6px 10px;\n      border-radius: 5px;\n      font-size: 0.82rem;\n      cursor: pointer;\n      transition: color 0.2s, background 0.2s;\n    }\n\n    .btn-fs:hover {\n      background: #1e293b;\n      color: #ffffff;\n    }\n  </style>\n</head>\n<body>\n\n  <!-- Top Accent Progress Bar -->\n  <div class=\"top-progress-accent\">\n    <div class=\"top-progress-fill\" id=\"topProgressFill\"></div>\n  </div>\n\n  <!-- FIXED VIEWPORT -->\n  <div class=\"deck-viewport\" id=\"viewport\">\n\n    <!-- ================= SLIDE 1: Title Slide ================= -->\n    <section class=\"slide-frame active\" id=\"slide-0\" style=\"justify-content: center; align-items: center; text-align: center;\">\n      <h1 style=\"font-size: 3.4rem; font-weight: 800; letter-spacing: -0.03em; color: var(--text-white); line-height: 1.2;\">\n        Tracing the Activity Selection\n      </h1>\n    </section>\n\n    <!-- ================= SLIDE 2: Problem Statement & Motivating Example ================= -->\n    <section class=\"slide-frame\" id=\"slide-1\">\n      <div class=\"slide-hero-header\">\n        <div class=\"slide-hero-title\">\n          <span class=\"tag\">Context</span>\n          The Problem Statement\n        </div>\n      </div>\n\n      <div class=\"present-card\">\n        <p class=\"body-primary-text\">\n          Given <span class=\"key-term\">n activities</span> with their start and finish times. \n          <br>Select the <span class=\"accent-cyan-text\">maximum number of activities</span> that can be performed by a single person, assuming, that a person can only work on a <span class=\"key-term\">single activity at a time</span>.\n        </p>\n      </div>\n\n      <!-- Table Card with In-Table Step Buttons -->\n      <div class=\"present-card\">\n        <div class=\"card-header-row\">\n          <div class=\"card-title-text\">\n            Example:\n          </div>\n          <!-- In-table previous and next buttons -->\n          <div class=\"table-step-controls\">\n            <button class=\"btn-tbl\" id=\"btn-s2-prev\" onclick=\"stepExampleTable(-1)\" disabled title=\"Previous Table Step\">\n              ◀ Prev\n            </button>\n            <span class=\"table-step-badge\" id=\"s2-step-indicator\">Step 1 / 2</span>\n            <button class=\"btn-tbl btn-tbl-primary\" id=\"btn-s2-next\" onclick=\"stepExampleTable(1)\" title=\"Next Table Step\">\n              Next Step ▶\n            </button>\n          </div>\n        </div>\n\n        <table class=\"present-table\" id=\"s2-table\">\n          <thead>\n            <tr>\n              <th style=\"width: 140px;\">Activity</th>\n              <th>A1</th>\n              <th>A2</th>\n              <th>A3</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr>\n              <td style=\"font-weight: 800; color: #94a3b8;\">Start</td>\n              <td id=\"s2-a1-s\">12</td>\n              <td id=\"s2-a2-s\">10</td>\n              <td id=\"s2-a3-s\">20</td>\n            </tr>\n            <tr>\n              <td style=\"font-weight: 800; color: #94a3b8;\">Finish</td>\n              <td id=\"s2-a1-f\">25</td>\n              <td id=\"s2-a2-f\">20</td>\n              <td id=\"s2-a3-f\">30</td>\n            </tr>\n          </tbody>\n        </table>\n\n        <!-- Revealed outcome on Table Step click -->\n        <div id=\"s2-outcome-box\" style=\"display: none; margin-top: 10px;\">\n          <div class=\"success-callout\">\n            <div style=\"font-size: 1rem; font-weight: 800; color: var(--emerald-light); margin-bottom: 3px;\">\n              Total activities performed: A2, A3: 2 activities\n            </div>\n            <div style=\"font-size: 0.9rem; color: #cbd5e1; line-height: 1.5;\">\n              • A2 runs from 10 to 20 (finish = 20)<br>\n              • A3 starts at 20 (compatible: 20 &ge; 20) and finishes at 30<br>\n              • A1 runs from 12 to 25, creating a collision with both A2 and A3!\n            </div>\n          </div>\n        </div>\n      </div>\n    </section>\n\n    <!-- ================= SLIDE 3: Method: Solution; Greedy Approach ================= -->\n    <section class=\"slide-frame\" id=\"slide-2\">\n      <div class=\"slide-hero-header\">\n        <div class=\"slide-hero-title\">\n          <span class=\"tag\">Method</span>\n          Solution; Greedy Approach\n        </div>\n      </div>\n\n      <!-- Vertical steps flow -->\n      <div class=\"greedy-steps-vertical\">\n        <div class=\"present-card step-card-row\" style=\"border-left: 4px solid var(--cyan);\">\n          <div class=\"step-num-circle\" style=\"background: rgba(6, 182, 212, 0.2); color: var(--cyan);\">1</div>\n          <div class=\"step-text-wrap\">\n            <strong class=\"step-title-bold\">SORT all activities by finish time</strong>\n            <p class=\"step-desc-text\">Order activities in non-decreasing (ascending) order of their finish times.</p>\n          </div>\n        </div>\n\n        <div class=\"present-card step-card-row\" style=\"border-left: 4px solid var(--emerald);\">\n          <div class=\"step-num-circle\" style=\"background: rgba(16, 185, 129, 0.2); color: var(--emerald);\">2</div>\n          <div class=\"step-text-wrap\">\n            <strong class=\"step-title-bold\">SELECT the first activity, set last_finish to its finish time.</strong>\n          </div>\n        </div>\n\n        <div class=\"present-card step-card-row\" style=\"border-left: 4px solid var(--primary-light);\">\n          <div class=\"step-num-circle\" style=\"background: rgba(99, 102, 241, 0.2); color: var(--primary-light);\">3</div>\n          <div class=\"step-text-wrap\">\n            <strong class=\"step-title-bold\">GO DOWN THE LIST: ask: is start &ge; last_finish?</strong>\n            <p class=\"step-desc-text\">\n              • <span class=\"accent-emerald-text\">Yes:</span> select it, and update <code style=\"color: var(--cyan);\">last_finish</code> to its finish time<br>\n              • <span class=\"accent-rose-text\">No:</span> skip it, <code style=\"color: var(--cyan);\">last_finish</code> stays the same\n            </p>\n          </div>\n        </div>\n\n        <div class=\"present-card step-card-row\" style=\"border-left: 4px solid var(--amber);\">\n          <div class=\"step-num-circle\" style=\"background: rgba(245, 158, 11, 0.2); color: var(--amber);\">4</div>\n          <div class=\"step-text-wrap\">\n            <strong class=\"step-title-bold\">Stop at the end of the list and the selected activities are the answer.</strong>\n          </div>\n        </div>\n      </div>\n\n      <!-- Note at bottom just above navigation -->\n      <div class=\"warning-callout slide-note-bottom\">\n        <strong style=\"color: var(--amber-light);\">Note:</strong> If the start time of the activity is greater than or equal to the finish time of previously selected activity, then select this activity and print it.\n      </div>\n    </section>\n\n    <!-- ================= SLIDE 4: Step 1 - SORT all activities (Editable Inputs & Live Dynamic Updates) ================= -->\n    <section class=\"slide-frame\" id=\"slide-3\">\n      <div class=\"slide-hero-header\">\n        <div class=\"slide-hero-title\">\n          1. SORT all activities by finish time\n        </div>\n      </div>\n\n      <!-- TABLE 1: Unsorted Input Table (Editable) -->\n      <div class=\"present-card\" style=\"margin-top: 8px; margin-bottom: 10px; padding: 10px 14px;\">\n        <div class=\"card-header-row\" style=\"margin-bottom: 6px;\">\n          <div class=\"card-title-text\" style=\"font-size: 0.95rem;\">\n            ACTIVITY Input List (Unsorted)\n          </div>\n          <!-- In-table controls: Reset to original + Sort button -->\n          <div class=\"table-step-controls\">\n            <button class=\"btn-tbl btn-tbl-reset\" id=\"btn-s3-reset\" onclick=\"resetStep1ToDefaults()\" title=\"Reset to original default values\">\n              Reset Default\n            </button>\n            <button class=\"btn-tbl btn-tbl-primary\" id=\"btn-s3-sort\" onclick=\"sortStep1Activities()\" title=\"Sort activities by finish time\">\n              Sort Activities ▶\n            </button>\n          </div>\n        </div>\n\n        <table class=\"present-table\" id=\"s3-unsorted-table\">\n          <thead>\n            <tr>\n              <th style=\"width: 130px;\">ACTIVITY</th>\n              <th>A1</th>\n              <th>A2</th>\n              <th>A3</th>\n              <th>A4</th>\n              <th>A5</th>\n              <th>A6</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr>\n              <td style=\"font-weight: 800; color: #94a3b8;\">Start</td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-start-0\" value=\"0\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-start-1\" value=\"3\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-start-2\" value=\"1\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-start-3\" value=\"5\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-start-4\" value=\"5\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-start-5\" value=\"8\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n            </tr>\n            <tr>\n              <td style=\"font-weight: 800; color: #94a3b8;\">Finish</td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-finish-0\" value=\"6\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-finish-1\" value=\"4\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-finish-2\" value=\"2\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-finish-3\" value=\"9\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-finish-4\" value=\"7\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n              <td><input type=\"number\" min=\"0\" max=\"99\" class=\"time-input\" id=\"inp-finish-5\" value=\"9\" onchange=\"onStep1InputChange()\" oninput=\"onStep1InputChange()\"></td>\n            </tr>\n          </tbody>\n        </table>\n      </div>\n\n      <!-- TABLE 2: Sorted Table (Shows below Table 1 when Sort button is clicked) -->\n      <div class=\"present-card\" id=\"s3-sorted-card\" style=\"display: none; margin-bottom: 8px; padding: 10px 14px; border-left: 3px solid var(--emerald); animation: fadeIn 0.25s ease-out;\">\n        <div class=\"card-header-row\" style=\"margin-bottom: 6px;\">\n          <div class=\"card-title-text\" style=\"font-size: 0.95rem; color: var(--emerald-light);\">\n            ACTIVITY List Sorted by Finish Time\n          </div>\n          <span class=\"table-step-badge\" id=\"s3-sorted-badge\" style=\"background: rgba(16, 185, 129, 0.2); color: var(--emerald-light); border-color: rgba(16, 185, 129, 0.4);\">\n            Sorted Order\n          </span>\n        </div>\n\n        <table class=\"present-table\" id=\"s3-sorted-table\">\n          <thead>\n            <tr id=\"s3-sorted-head-row\">\n              <th style=\"width: 130px;\">ACTIVITY</th>\n              <th id=\"s3-sort-act-0\">A3</th>\n              <th id=\"s3-sort-act-1\">A2</th>\n              <th id=\"s3-sort-act-2\">A1</th>\n              <th id=\"s3-sort-act-3\">A5</th>\n              <th id=\"s3-sort-act-4\">A6</th>\n              <th id=\"s3-sort-act-5\">A4</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr id=\"s3-sorted-start-row\">\n              <td style=\"font-weight: 800; color: #94a3b8;\">Start</td>\n              <td id=\"s3-sort-start-0\">1</td>\n              <td id=\"s3-sort-start-1\">3</td>\n              <td id=\"s3-sort-start-2\">0</td>\n              <td id=\"s3-sort-start-3\">5</td>\n              <td id=\"s3-sort-start-4\">8</td>\n              <td id=\"s3-sort-start-5\">5</td>\n            </tr>\n            <tr id=\"s3-sorted-finish-row\">\n              <td style=\"font-weight: 800; color: #94a3b8;\">Finish</td>\n              <td id=\"s3-sort-finish-0\" class=\"cell-highlight\">2</td>\n              <td id=\"s3-sort-finish-1\" class=\"cell-highlight\">4</td>\n              <td id=\"s3-sort-finish-2\" class=\"cell-highlight\">6</td>\n              <td id=\"s3-sort-finish-3\" class=\"cell-highlight\">7</td>\n              <td id=\"s3-sort-finish-4\" class=\"cell-highlight\">9</td>\n              <td id=\"s3-sort-finish-5\" class=\"cell-highlight\">9</td>\n            </tr>\n          </tbody>\n        </table>\n      </div>\n    </section>\n\n    <!-- ================= SLIDE 5: Step 2 & 3 - Interactive Tracing & Right Timeline Comparison (Uses dynamic sorted data) ================= -->\n    <section class=\"slide-frame\" id=\"slide-4\">\n      <div class=\"slide-hero-header\">\n        <div class=\"slide-hero-title\">\n          2. SELECT first activity & 3. GO DOWN THE LIST\n        </div>\n        <div class=\"slide-lead-text\">\n        <b>Ask:</b> is start &ge; last_finish? <b>Yes</b>: select, <b>No</b>: skip.\n        </div>\n      </div>\n\n      <!-- Sorted Bar Reference (Dynamically populated from Step 1) -->\n      <div style=\"background: #090e1a; border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; flex-shrink: 0;\">\n        <span style=\"color: var(--text-white); font-weight: 800; letter-spacing: 0.04em;\">SORTED ACTIVITIES:</span>\n        <div id=\"slide4-sorted-bar\" style=\"display: flex; gap: 12px; font-family: var(--font-mono); font-weight: 800;\">\n          <!-- Dynamically populated -->\n        </div>\n      </div>\n\n      <!-- Split Layout: Table on Left, Timeline on Right -->\n      <div class=\"tracing-split-grid\">\n\n        <!-- Left: Tracing Table with In-Table Previous, Next & RESET BUTTON -->\n        <div style=\"display: flex; flex-direction: column; min-height: 0;\">\n          <div class=\"present-card\" style=\"margin-bottom: 8px; padding: 10px 14px;\">\n            <div class=\"card-header-row\" style=\"margin-bottom: 8px;\">\n              <div class=\"card-title-text\" style=\"font-size: 0.98rem;\">\n                Tracing Table\n              </div>\n              <!-- IN-TABLE BUTTONS INCLUDING RESET BUTTON -->\n              <div class=\"table-step-controls\">\n                <button class=\"btn-tbl btn-tbl-reset\" id=\"btn-trace-reset\" onclick=\"resetTracingTable()\" title=\"Reset Tracing Table (Key: R)\">\n                  Reset\n                </button>\n                <button class=\"btn-tbl\" id=\"btn-trace-prev\" onclick=\"stepTracingTable(-1)\" disabled title=\"Previous Table Step (Key: ↑ or W)\">\n                  ◀ Prev\n                </button>\n                <span class=\"table-step-badge\" id=\"trace-step-indicator\">Step 0 / 5</span>\n                <button class=\"btn-tbl btn-tbl-primary\" id=\"btn-trace-next\" onclick=\"stepTracingTable(1)\" title=\"Next Table Step (Key: ↓ or S)\">\n                  Next ▶\n                </button>\n              </div>\n            </div>\n\n            <table class=\"present-table trace-rows-table\" id=\"tracingMainTable\">\n              <thead>\n                <tr>\n                  <th style=\"width: 44px;\">Step</th>\n                  <th>Activity (start / finish)</th>\n                  <th>Check</th>\n                  <th>Decision</th>\n                  <th>last_finish</th>\n                </tr>\n              </thead>\n              <tbody id=\"traceTableBodyDynamic\">\n                <!-- Dynamically generated rows -->\n              </tbody>\n            </table>\n          </div>\n\n          <!-- Final Summary Banner on Completion -->\n          <div id=\"trace-completion-card\" style=\"display: none;\">\n            <div class=\"success-callout\" style=\"padding: 6px 12px;\">\n              <strong style=\"color: var(--emerald-light); font-size: 0.88rem;\">\n                4. Stop at the end of the list and the selected activities are the answer.\n              </strong>\n              <div id=\"traceSummaryText\" style=\"font-size: 0.82rem; color: #cbd5e1; margin-top: 2px;\">\n                <!-- Dynamically generated summary -->\n              </div>\n            </div>\n          </div>\n        </div>\n\n        <!-- Right: Timeline Comparison (Dynamically synced) -->\n        <div class=\"timeline-card\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <div class=\"card-title-text\" style=\"font-size: 0.94rem;\">\n              Timeline Comparison\n            </div>\n            <div style=\"display: flex; gap: 10px; font-size: 0.74rem; font-weight: 700; color: var(--text-muted);\">\n              <span><span style=\"display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--emerald);\"></span> Selected</span>\n              <span><span style=\"display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rose);\"></span> Skip</span>\n              <span><span style=\"display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #334155;\"></span> Pending</span>\n            </div>\n          </div>\n\n          <!-- Visual Timeline Graphic -->\n          <div class=\"timeline-plot\">\n            <!-- Grid Lines -->\n            <div class=\"timeline-grid-lines\" id=\"timelineGridLines\">\n              <!-- Dynamically rendered -->\n            </div>\n\n            <!-- Dynamic Marker for last_finish -->\n            <div class=\"marker-last-finish\" id=\"timelineMarker\" style=\"left: calc(65px + (100% - 79px) * 0.2);\" data-val=\"2\"></div>\n\n            <!-- Activity Rows -->\n            <div class=\"plot-activity-rows\" id=\"timelineActivityRows\">\n              <!-- Dynamically populated rows -->\n            </div>\n\n            <!-- Time Axis Ticks -->\n            <div class=\"plot-time-axis\" id=\"timelineTimeAxis\">\n              <!-- Dynamically populated ticks -->\n            </div>\n          </div>\n\n          <!-- Active Schedule Sequence Track -->\n          <div class=\"timeline-live-summary\">\n            <div style=\"display: flex; justify-content: space-between; font-size: 0.76rem; font-weight: 800; color: var(--emerald-light); text-transform: uppercase; margin-bottom: 4px;\">\n              <span>Selected Activities Schedule</span>\n              <span id=\"liveStatusExplanation\" style=\"text-transform: none; color: #cbd5e1; font-weight: 500;\">Step 0</span>\n            </div>\n            <div id=\"liveSelectedTokens\" style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n              <!-- Dynamically populated tokens -->\n            </div>\n          </div>\n        </div>\n\n      </div>\n    </section>\n\n    <!-- ================= SLIDE 6: Python Code Implementation (Formatted with visual structure) ================= -->\n    <section class=\"slide-frame\" id=\"slide-5\">\n      <div class=\"slide-hero-header\">\n        <div class=\"slide-hero-title\">\n          <span class=\"tag\">Implementation</span>\n          Python Implementation\n        </div>\n      </div>\n\n      <div class=\"code-container-single\">\n        <span class=\"py-kw\">def</span> <span class=\"py-fn\">print_max_activities</span>(<span class=\"py-var\">s</span>, <span class=\"py-var\">f</span>, <span class=\"py-var\">n</span>):\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-comm\"># s[] = start times,</span>\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-comm\"># f[] = finish times (already sorted by finish time)</span>\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-fn\">print</span>(<span class=\"py-str\">\"Following activities are selected\"</span>)\n            <br>\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-comm\"># The first activity always gets selected</span>\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-var\">i</span> = <span class=\"py-num\">0</span>\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-fn\">print</span>(<span class=\"py-var\">i</span>, <span class=\"py-var\">end</span>=<span class=\"py-str\">\" \"</span>)\n            <br>\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-comm\"># Consider the rest of the activities</span>\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-kw\">for</span> <span class=\"py-var\">j</span> <span class=\"py-kw\">in</span> <span class=\"py-fn\">range</span>(<span class=\"py-num\">1</span>, <span class=\"py-var\">n</span>):\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-comm\"># If this activity starts at or after the last selected one finishes, select it</span>\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-kw\">if</span> <span class=\"py-var\">s</span>[<span class=\"py-var\">j</span>] &gt;= <span class=\"py-var\">f</span>[<span class=\"py-var\">i</span>]:\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-fn\">print</span>(<span class=\"py-var\">j</span>, <span class=\"py-var\">end</span>=<span class=\"py-str\">\" \"</span>)\n            <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class=\"py-var\">i</span> = <span class=\"py-var\">j</span>\n            <br>\n            <br>\n        <span class=\"py-comm\"># Your sorted data from the slides: A3, A2, A1, A5, A6, A4</span>\n        <br><span class=\"py-var\">s</span> = [<span class=\"py-num\">1</span>, <span class=\"py-num\">3</span>, <span class=\"py-num\">0</span>, <span class=\"py-num\">5</span>, <span class=\"py-num\">8</span>, <span class=\"py-num\">5</span>]\n        <br><span class=\"py-var\">f</span> = [<span class=\"py-num\">2</span>, <span class=\"py-num\">4</span>, <span class=\"py-num\">6</span>, <span class=\"py-num\">7</span>, <span class=\"py-num\">9</span>, <span class=\"py-num\">9</span>]\n        <br><span class=\"py-fn\">print_max_activities</span>(<span class=\"py-var\">s</span>, <span class=\"py-var\">f</span>, <span class=\"py-fn\">len</span>(<span class=\"py-var\">s</span>))\n      </div>\n\n      <!-- Note at bottom just above navigation -->\n      <div class=\"warning-callout slide-note-bottom\">\n        <strong style=\"color: var(--amber-light);\">Note:</strong> The code snippet assumes that the arrays are sorted.\n      </div>\n    </section>\n\n    <!-- ================= SLIDE 7: Proof Roadmap ================= -->\n    <section class=\"slide-frame\" id=\"slide-6\">\n      <div class=\"slide-hero-header\">\n        <div class=\"slide-hero-title\">\n          <span class=\"tag\">Proof</span>\n          Evidence / Proof: Greedy Stays Ahead\n        </div>\n        <div class=\"slide-lead-text\">\n          Establishing why the Greedy algorithm is mathematically guaranteed to be optimal.\n        </div>\n      </div>\n\n      <div class=\"present-card\" style=\"border-left: 3px solid var(--cyan); margin-bottom: 14px; padding: 14px 18px;\">\n        <div class=\"card-title-text\" style=\"font-size: 1.08rem; margin-bottom: 6px;\">\n          The Core Invariant\n        </div>\n        <p class=\"body-primary-text\" style=\"font-size: 1.15rem; color: #f8fafc; line-height: 1.55;\">\n          \"The <span class=\"math-symbol\">k</span>-th activity picked by the greedy algorithm finishes no later than the <span class=\"math-symbol\">k</span>-th activity in any other valid schedule.\"\n        </p>\n      </div>\n\n      <p class=\"body-primary-text\" style=\"font-size: 1.02rem; color: #cbd5e1; margin-bottom: 12px;\">\n        We need to show two things:\n      </p>\n\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 14px;\">\n        <div class=\"proof-card\" style=\"border-top: 3px solid var(--primary); padding: 14px 18px;\">\n          <div class=\"proof-card-title\">\n            <span style=\"background: rgba(99, 102, 241, 0.2); color: var(--primary-light); padding: 2px 8px; border-radius: 4px; font-size: 0.82rem;\">1</span>\n            The Lemma\n          </div>\n          <p class=\"body-primary-text\" style=\"font-size: 0.94rem; line-height: 1.5;\">\n            This statement is true: greedy is never behind any valid schedule at any position.\n          </p>\n        </div>\n\n        <div class=\"proof-card\" style=\"border-top: 3px solid var(--emerald); padding: 14px 18px;\">\n          <div class=\"proof-card-title\">\n            <span style=\"background: rgba(16, 185, 129, 0.2); color: var(--emerald-light); padding: 2px 8px; border-radius: 4px; font-size: 0.82rem;\">2</span>\n            The Theorem\n          </div>\n          <p class=\"body-primary-text\" style=\"font-size: 0.94rem; line-height: 1.5;\">\n            If it's true, the greedy algorithm must be optimal (no schedule can contain more activities).\n          </p>\n        </div>\n      </div>\n    </section>\n\n    <!-- ================= SLIDE 8: Notation & Setup ================= -->\n    <section class=\"slide-frame\" id=\"slide-7\">\n      <div class=\"slide-hero-header\">\n        <div class=\"slide-hero-title\">\n          Evidence / Proof: Greedy Stays Ahead\n        </div>\n        <div class=\"slide-lead-text\">\n          Notation definitions used across the induction and contradiction proofs.\n        </div>\n      </div>\n\n      <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;\">\n        <div class=\"present-card\" style=\"margin: 0; padding: 10px 14px;\">\n          <div style=\"font-family: var(--font-mono); font-size: 1.15rem; color: var(--cyan); font-weight: 800; margin-bottom: 3px;\">\n            S\n          </div>\n          <p class=\"body-primary-text\" style=\"font-size: 0.9rem;\">\n            The schedule produced by the greedy algorithm.\n          </p>\n        </div>\n\n        <div class=\"present-card\" style=\"margin: 0; padding: 10px 14px;\">\n          <div style=\"font-family: var(--font-mono); font-size: 1.15rem; color: var(--emerald-light); font-weight: 800; margin-bottom: 3px;\">\n            S*\n          </div>\n          <p class=\"body-primary-text\" style=\"font-size: 0.9rem;\">\n            An optimal (best possible) schedule.\n          </p>\n        </div>\n\n        <div class=\"present-card\" style=\"margin: 0; padding: 10px 14px;\">\n          <div style=\"font-family: var(--font-mono); font-size: 1.15rem; color: #f8fafc; font-weight: 800; margin-bottom: 3px;\">\n            |S| and |S*|\n          </div>\n          <p class=\"body-primary-text\" style=\"font-size: 0.9rem;\">\n            The number of activities in <span class=\"math-symbol\">S</span>. Likewise, <span class=\"math-symbol\">|S*|</span> is the number in <span class=\"math-symbol\">S*</span>.\n          </p>\n        </div>\n\n        <div class=\"present-card\" style=\"margin: 0; padding: 10px 14px;\">\n          <div style=\"font-family: var(--font-mono); font-size: 1.15rem; color: var(--amber-light); font-weight: 800; margin-bottom: 3px;\">\n            f(i, S)\n          </div>\n          <p class=\"body-primary-text\" style=\"font-size: 0.9rem;\">\n            The finish time of the <span class=\"math-symbol\">i</span>-th activity in schedule <span class=\"math-symbol\">S</span>.\n          </p>\n        </div>\n\n        <div class=\"present-card\" style=\"margin: 0; padding: 10px 14px; grid-column: span 2;\">\n          <div style=\"font-family: var(--font-mono); font-size: 1.15rem; color: #c084fc; font-weight: 800; margin-bottom: 3px;\">\n            U\n          </div>\n          <p class=\"body-primary-text\" style=\"font-size: 0.9rem;\">\n            The set of activities still available to pick, meaning those that don't overlap anything already chosen.\n          </p>\n        </div>\n      </div>\n\n      <div class=\"info-callout\" style=\"margin-top: 10px; font-size: 0.96rem;\">\n        Since <span class=\"math-symbol\">S*</span> is the best possible, <strong style=\"color: #ffffff;\">|S| &le; |S*|</strong>. We still need to show <strong style=\"color: var(--cyan);\">|S| &ge; |S*|</strong>.\n      </div>\n    </section>\n\n    <!-- ================= SLIDE 9: Lemma: greedy is never behind ================= -->\n    <section class=\"slide-frame\" id=\"slide-8\">\n      <div class=\"slide-hero-header\">\n        <div class=\"slide-hero-title\">\n          Lemma: greedy is never behind\n        </div>\n        <div class=\"slide-lead-text\">\n          Proof by induction that greedy's picks finish no later than optimal picks.\n        </div>\n      </div>\n\n      <div class=\"present-card\" style=\"background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.35); margin-bottom: 10px; padding: 10px 14px;\">\n        <div style=\"font-weight: 800; font-size: 1.05rem; color: #c7d2fe; margin-bottom: 2px;\">\n          Claim: For every position 1 &le; i &le; |S|, f(i, S) &le; f(i, S*)\n        </div>\n        <p class=\"body-primary-text\" style=\"font-size: 0.92rem;\">\n          The <span class=\"math-symbol\">i</span>-th activity of greedy finishes no later than the <span class=\"math-symbol\">i</span>-th activity of the optimal schedule.\n        </p>\n      </div>\n\n      <div class=\"proof-card\" style=\"padding: 10px 14px;\">\n        <div class=\"proof-card-title\">\n          Base case (i = 1):\n        </div>\n        <p class=\"body-primary-text\" style=\"font-size: 0.92rem; line-height: 1.5;\">\n          Greedy's first pick is the activity that finishes earliest of all, so it can't finish later than the first activity of <span class=\"math-symbol\">S*</span>.<br>\n          Therefore: <strong style=\"color: var(--emerald-light);\">f(1, S) &le; f(1, S*)</strong>.\n        </p>\n      </div>\n\n      <div class=\"proof-card\" style=\"padding: 10px 14px;\">\n        <div class=\"proof-card-title\">\n          Inductive step:\n        </div>\n        <div class=\"body-primary-text\" style=\"font-size: 0.92rem; line-height: 1.55;\">\n          • Assume the claim is true for some position <span class=\"math-symbol\">i &lt; |S|</span>, so greedy's <span class=\"math-symbol\">i</span>-th activity ends no later than <span class=\"math-symbol\">S*</span>'s <span class=\"math-symbol\">i</span>-th activity.<br>\n          • <span class=\"math-symbol\">S*</span>'s <span class=\"math-symbol\">(i+1)</span>-th activity starts at or after <span class=\"math-symbol\">S*</span>'s <span class=\"math-symbol\">i</span>-th activity ends.<br>\n          • That means it also starts at or after greedy's <span class=\"math-symbol\">i</span>-th activity ends.<br>\n          • So <span class=\"math-symbol\">S*</span>'s <span class=\"math-symbol\">(i+1)</span>-th activity is still in <span class=\"math-symbol\">U</span> when greedy makes its <span class=\"math-symbol\">(i+1)</span>-th pick.<br>\n          • Greedy picks the activity in <span class=\"math-symbol\">U</span> that finishes earliest, so <strong style=\"color: var(--cyan); font-size: 1rem;\">f(i+1, S) &le; f(i+1, S*)</strong>. ■\n        </div>\n      </div>\n    </section>\n\n    <!-- ================= SLIDE 10: Theorem: greedy is optimal ================= -->\n    <section class=\"slide-frame\" id=\"slide-9\">\n      <div class=\"slide-hero-header\">\n        <div class=\"slide-hero-title\">\n          Theorem: greedy is optimal\n        </div>\n        <div class=\"slide-lead-text\">\n          Proof by contradiction that greedy produces an optimal schedule.\n        </div>\n      </div>\n\n      <div class=\"present-card\" style=\"background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.35); margin-bottom: 10px; padding: 10px 14px;\">\n        <div style=\"font-weight: 800; font-size: 1.05rem; color: var(--emerald-light);\">\n          Claim: The greedy algorithm produces an optimal schedule (|S| = |S*|)\n        </div>\n      </div>\n\n      <div class=\"proof-card\" style=\"padding: 12px 16px;\">\n        <div class=\"proof-card-title\">\n          Proof (by contradiction):\n        </div>\n        <div class=\"body-primary-text\" style=\"font-size: 0.92rem; line-height: 1.6;\">\n          1. We already know <span class=\"math-symbol\">|S| &le; |S*|</span>. We need to prove <span class=\"math-symbol\">|S| &ge; |S*|</span>.<br>\n          2. Suppose instead that <strong style=\"color: var(--rose-light);\">|S| &lt; |S*|</strong>, and let <strong style=\"color: #ffffff;\">k = |S|</strong>.<br>\n          3. By the Lemma, <strong style=\"color: var(--cyan);\">f(k, S) &le; f(k, S*)</strong>.<br>\n          4. Since <span class=\"math-symbol\">S*</span> has more than <span class=\"math-symbol\">k</span> activities, it has a <span class=\"math-symbol\">(k+1)</span>-th activity.<br>\n          5. That activity starts at or after <span class=\"math-symbol\">f(k, S*)</span>, and so at or after <span class=\"math-symbol\">f(k, S)</span>.<br>\n          6. So, after greedy picked its <span class=\"math-symbol\">k</span>-th activity, the <span class=\"math-symbol\">(k+1)</span>-th activity of <span class=\"math-symbol\">S*</span> was still in <span class=\"math-symbol\">U</span>.<br>\n          7. But greedy stopped after <span class=\"math-symbol\">k</span> activities, which <strong style=\"color: var(--amber-light);\">only happens when U is empty</strong>.<br><br>\n          <div style=\"background: rgba(244, 63, 94, 0.16); border: 1px solid rgba(244, 63, 94, 0.4); border-radius: var(--radius-sm); padding: 8px 12px; color: #fecdd3; font-size: 0.95rem;\">\n            This is a contradiction! So the assumption was wrong. Therefore <strong style=\"color: #ffffff;\">|S| &ge; |S*|</strong>, and greedy is optimal. ■\n          </div>\n        </div>\n      </div>\n    </section>\n\n    <!-- ================= SLIDE 11: Sources & References ================= -->\n    <section class=\"slide-frame\" id=\"slide-10\">\n      <div class=\"slide-hero-header\">\n        <div class=\"slide-hero-title\">\n          Sources:\n        </div>\n        <div class=\"slide-lead-text\">\n          External resources and lecture citations.\n        </div>\n      </div>\n\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <div class=\"present-card\" style=\"margin: 0; padding: 12px 16px;\">\n          <div style=\"font-weight: 700; font-size: 0.98rem; color: #ffffff; margin-bottom: 4px;\">\n            YouTube Video Walkthrough\n          </div>\n          <a href=\"https://www.youtube.com/watch?v=poWB2UCuozA\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--cyan); text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;\">\n            https://www.youtube.com/watch?v=poWB2UCuozA ↗\n          </a>\n        </div>\n\n        <div class=\"present-card\" style=\"margin: 0; padding: 12px 16px;\">\n          <div style=\"font-weight: 700; font-size: 0.98rem; color: #ffffff; margin-bottom: 4px;\">\n            Northeastern University Course Notes\n          </div>\n          <a href=\"https://www.ccs.neu.edu/home/vip/teach/Algorithms/5_greedy/notes/Small13.pdf\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--cyan); text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;\">\n            https://www.ccs.neu.edu/home/vip/teach/Algorithms/5_greedy/notes/Small13.pdf ↗\n          </a>\n        </div>\n\n        <div class=\"present-card\" style=\"margin: 0; padding: 12px 16px;\">\n          <div style=\"font-weight: 700; font-size: 0.98rem; color: #ffffff; margin-bottom: 4px;\">\n            InterviewBit Guide\n          </div>\n          <a href=\"https://www.interviewbit.com/courses/programming/greedy-algorithm/activity-selection-problem/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--cyan); text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;\">\n            https://www.interviewbit.com/courses/programming/greedy-algorithm/activity-selection-problem/ ↗\n          </a>\n        </div>\n      </div>\n    </section>\n\n  </div>\n\n  <!-- ================= COMPACT BOTTOM PRESENTATION CONTROL BAR ================= -->\n  <footer class=\"deck-footer\">\n    <!-- Bottom Left: Slide Counter -->\n    <div class=\"footer-left\">\n      <div class=\"slide-badge-bottom-left\" id=\"bottomLeftSlideCounter\">\n        Slide 1 / 11\n      </div>\n      <div class=\"dots-strip\" id=\"dotsStrip\"></div>\n    </div>\n\n    <!-- Bottom Right: Compact Slide Navigation Buttons Side-by-Side -->\n    <div class=\"footer-right\">\n      <button class=\"btn-slide-nav btn-slide-prev\" id=\"btnSlidePrev\" onclick=\"proceedPrevSlide()\" title=\"Previous Slide (Arrow Left)\">\n        <span>◀</span> Prev Slide\n      </button>\n\n      <button class=\"btn-slide-nav btn-slide-next\" id=\"btnSlideNext\" onclick=\"proceedNextSlide()\" title=\"Next Slide (Arrow Right or Space)\">\n        <span id=\"btnSlideNextLabel\">Next Slide</span> <span>▶</span>\n      </button>\n\n      <button class=\"btn-fs\" onclick=\"togglePresentationFullscreen()\" title=\"Toggle Fullscreen (F)\">\n        ⛶\n      </button>\n    </div>\n  </footer>\n\n  <!-- SCRIPT -->\n  <script>\n    const TOTAL_SLIDES = 11;\n    let activeSlideIndex = 0;\n\n    // Per-slide in-table states\n    // Slide 1 (Index 1): Example Table (2 steps: 0, 1)\n    let s2Step = 0;\n    const s2Max = 1;\n\n    // Slide 3 (Index 3): Single Dynamic Sorting Table (2 steps: 0, 1)\n    let s3Step = 0;\n    const s3Max = 1;\n\n    // Default Activities dataset\n    const DEFAULT_ACTIVITIES = [\n      { id: \"A1\", start: 0, finish: 6 },\n      { id: \"A2\", start: 3, finish: 4 },\n      { id: \"A3\", start: 1, finish: 2 },\n      { id: \"A4\", start: 5, finish: 9 },\n      { id: \"A5\", start: 5, finish: 7 },\n      { id: \"A6\", start: 8, finish: 9 }\n    ];\n\n    // Current working activities in Step 1\n    let currentActivities = JSON.parse(JSON.stringify(DEFAULT_ACTIVITIES));\n    let sortedActivities = [];\n\n    // Tracing states for Slide 5\n    let traceStep = 0;\n    let traceMax = 5;\n    let traceData = [];\n\n    function initDeck() {\n      createDots();\n      populateStep1Inputs();\n      computeSortedAndTracingData();\n      displaySlide(0);\n      setupKeyListeners();\n    }\n\n    function createDots() {\n      const strip = document.getElementById('dotsStrip');\n      strip.innerHTML = '';\n      for (let i = 0; i < TOTAL_SLIDES; i++) {\n        const dot = document.createElement('div');\n        dot.className = `nav-pip ${i === 0 ? 'active' : ''}`;\n        dot.title = `Slide ${i + 1}`;\n        dot.onclick = () => displaySlide(i);\n        strip.appendChild(dot);\n      }\n    }\n\n    function displaySlide(idx) {\n      if (idx < 0 || idx >= TOTAL_SLIDES) return;\n      activeSlideIndex = idx;\n\n      const frames = document.querySelectorAll('.slide-frame');\n      frames.forEach((f, i) => {\n        if (i === activeSlideIndex) {\n          f.classList.add('active');\n        } else {\n          f.classList.remove('active');\n        }\n      });\n\n      // Bottom left slide counter update\n      document.getElementById('bottomLeftSlideCounter').textContent = `Slide ${activeSlideIndex + 1} / ${TOTAL_SLIDES}`;\n\n      // Top progress accent bar\n      const pct = ((activeSlideIndex + 1) / TOTAL_SLIDES) * 100;\n      document.getElementById('topProgressFill').style.width = `${pct}%`;\n\n      // Update dots\n      const dots = document.querySelectorAll('.nav-pip');\n      dots.forEach((d, i) => {\n        if (i === activeSlideIndex) d.classList.add('active');\n        else d.classList.remove('active');\n      });\n\n      // General Buttons\n      document.getElementById('btnSlidePrev').disabled = (activeSlideIndex === 0);\n      const nextBtn = document.getElementById('btnSlideNext');\n      const nextLabel = document.getElementById('btnSlideNextLabel');\n      if (activeSlideIndex === TOTAL_SLIDES - 1) {\n        nextLabel.textContent = \"Finished\";\n        nextBtn.disabled = true;\n      } else {\n        nextLabel.textContent = \"Next Slide\";\n        nextBtn.disabled = false;\n      }\n    }\n\n    function proceedNextSlide() {\n      if (activeSlideIndex < TOTAL_SLIDES - 1) {\n        displaySlide(activeSlideIndex + 1);\n      }\n    }\n\n    function proceedPrevSlide() {\n      if (activeSlideIndex > 0) {\n        displaySlide(activeSlideIndex - 1);\n      }\n    }\n\n    // ================= SLIDE 2: EXAMPLE TABLE =================\n    function stepExampleTable(delta) {\n      s2Step = Math.max(0, Math.min(s2Max, s2Step + delta));
