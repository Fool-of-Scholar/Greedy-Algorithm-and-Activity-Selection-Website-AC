<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CS 05 · Group 2 Presentation: Greedy Algorithms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #090d16;
      --bg-surface: #0f172a;
      --bg-surface-elevated: #1a243b;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(56, 189, 248, 0.25);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --accent-emerald: #10b981;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --header-h: 60px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Presentation Layout */
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Master Top Header */
    header.master-header {
      height: var(--header-h);
      flex: 0 0 var(--header-h);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      z-index: 50;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    }

    header.master-header.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    /* Brand Section */
    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .group-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(56, 189, 248, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
      white-space: nowrap;
    }

    .group-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .course-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .current-topic-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .current-topic-label .topic-tag {
      color: var(--primary);
      font-weight: 800;
      font-size: 0.8rem;
    }

    /* Center Navigation Tabs (Pills) */
    .nav-tabs-wrapper {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.25rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow-x: auto;
      max-width: 48vw;
      scrollbar-width: none;
    }
    .nav-tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .nav-tab-pill {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .nav-tab-pill:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-tab-pill.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.2);
    }

    .nav-tab-pill .pill-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .nav-tab-pill.active .pill-num {
      background: #38bdf8;
      color: #090d16;
    }

    /* Right Action Controls */
    .controls-section {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-nav:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-nav.primary {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: rgba(56, 189, 248, 0.4);
      color: #fff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }

    .btn-nav.primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #0369a1, #075985);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .icon-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Viewport Container for Slides */
    main#viewport-stage {
      flex: 1 1 0%;
      width: 100%;
      height: calc(100vh - var(--header-h));
      position: relative;
      overflow: hidden;
      background: #090d16;
    }

    header.master-header.hidden + main#viewport-stage {
      height: 100vh;
    }

    /* Presentation Iframes */
    .slide-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s;
      -webkit-overflow-scrolling: touch;
      overflow-y: auto;
    }

    .slide-frame.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 10;
    }

    /* Floating Quick Bar for Zen Mode / Quick Navigation */
    #floating-dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.35rem 0.65rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.2);
      z-index: 40;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #floating-dock.autohide {
      opacity: 0.25;
      transform: translateX(-50%) translateY(6px);
    }

    #floating-dock.autohide:hover {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .dock-indicator {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      user-select: none;
    }

    .dock-indicator span.num {
      color: #38bdf8;
      font-weight: 800;
    }

    .dock-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .dock-btn:hover:not(:disabled) {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .dock-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Floating Header Revealer (Visible when header is hidden) */
    #zen-revealer {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateY(-100%);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: none;
      padding: 0.3rem 0.85rem;
      border-radius: 0 0 12px 12px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 60;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    #zen-revealer.show {
      transform: translateX(-50%) translateY(0);
    }

    #zen-revealer:hover {
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.98);
    }

    /* Topic Index Modal / Drawer */
    #topics-modal {
      position: fixed;
      inset: 0;
      background: rgba(7, 11, 20, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    #topics-modal.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      width: min(860px, 100%);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 1px rgba(255, 255, 255, 0.2);
      overflow: hidden;
      transform: scale(0.96) translateY(10px);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #topics-modal.open .modal-content {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
    }

    .modal-header h2 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .modal-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .modal-body {
      padding: 1.25rem 1.5rem;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 0.85rem;
    }

    .topic-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 1rem 1.15rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      gap: 0.85rem;
      align-items: flex-start;
      position: relative;
    }

    .topic-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateY(-2px);
    }

    .topic-card.active {
      background: rgba(56, 189, 248, 0.1);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.15);
    }

    .topic-card-num {
      flex: 0 0 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .topic-card.active .topic-card-num {
      background: #38bdf8;
      color: #090d16;
    }

    .topic-card-info {
      flex: 1;
      min-width: 0;
    }

    .topic-card-tag {
      font-size: 0.68rem;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }

    .topic-card-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .topic-card-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .active-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Progress Indicator Bar at Bottom of Header */
    .presentation-progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, #10b981, #38bdf8, #8b5cf6);
      transition: width 0.3s ease;
      z-index: 55;
    }

    /* Mobile / Small Screens adjustments */
    @media (max-width: 900px) {
      .nav-tabs-wrapper {
        display: none;
      }
      .course-title {
        display: none;
      }
      .modal-body {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <div id="app-container">

    <header class="master-header" id="master-header">

    <!-- Zen Mode Revealer button (shown when header is collapsed) -->
    <div id="zen-revealer" title="Click to show presentation header">
      <span>▼ Show Presentation Controls</span>

    <!-- Main Presentation Stage (holds 8 sandboxed iframes) -->

      <div class="modal-content">
        <div class="modal-header">
          <div>

            <p>CS 05 · Design and Analysis of Greedy Algorithms</p>
          </div>
          <button class="icon-btn" id="modal-close" aria-label="Close modal">✕</button>
        </div>
        <div class="modal-body" id="modal-topics-list">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>

    // Embedded presentation data containing the exact 8 collaborative works
    const SLIDES_DATA = [{"id":1,"tag":"Topic 01","title":"Introduction to Greedy Algorithms","shortTitle":"Introduction","subtitle":"Coin Change Problem & Core Heuristic Principles","badge":"Overview & Heuristics","file":"introduction-greedy-slide-1.html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Slide 1: Introduction to Greedy Algorithms</title>\n<script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n<style>\n:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nbody{background:#09090b;color:#e4e4e7;font-family:ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}\n.coin{width:58px;height:58px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#022c22;background:radial-gradient(circle at 30% 30%,#a7f3d0,#10b981 60%,#047857);box-shadow:0 0 18px rgba(16,185,129,.55),inset 0 0 0 3px rgba(255,255,255,.25);animation:drop .5s cubic-bezier(.2,1.4,.4,1)}\n@keyframes drop{from{transform:translateY(-60px) scale(.4);opacity:0}to{transform:none;opacity:1}}\n.fade{animation:f .35s ease}@keyframes f{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}\ncode,pre{font-family:ui-monospace,Menlo,Consolas,monospace}\n.k{color:#f472b6}.c{color:#71717a}.f{color:#34d399}.s{color:#fbbf24}\n/* ===== Design layer ===== */\nbody{background:radial-gradient(1200px 600px at 10% -10%,rgba(16,185,129,.18),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(20,184,166,.14),transparent 55%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/40px 40px,#09090b;background-attachment:fixed;overflow-x:hidden}\nbody::before,body::after{content:\"\";position:fixed;border-radius:9999px;filter:blur(90px);pointer-events:none;z-index:0;animation:float 14s ease-in-out infinite alternate}\nbody::before{width:340px;height:340px;background:rgba(16,185,129,.22);left:-80px;bottom:8%}\nbody::after{width:300px;height:300px;background:rgba(251,191,36,.12);right:-60px;top:35%;animation-delay:-6s}\n@keyframes float{to{transform:translate(60px,-50px) scale(1.15)}}\nmain{position:relative;z-index:1}\n#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:4px;width:20%;z-index:50;background:linear-gradient(90deg,#10b981,#2dd4bf,#fbbf24);box-shadow:0 0 14px rgba(16,185,129,.8);transition:width .5s ease;border-radius:0 4px 4px 0}\n::selection{background:#10b981;color:#022c22}\n::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#065f46;border-radius:8px}\n.slide.fade{animation:sl .55s cubic-bezier(.2,.8,.2,1)}\n@keyframes sl{from{opacity:0;transform:translateY(22px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}\n.slide .bg-zinc-900{background:linear-gradient(145deg,rgba(39,39,42,.7),rgba(9,9,11,.75))!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(52,211,153,.22)!important;box-shadow:0 24px 70px -24px rgba(16,185,129,.35),inset 0 1px 0 rgba(255,255,255,.06);border-radius:1.5rem!important}\n.slide h1{background:linear-gradient(90deg,#fff 0%,#a7f3d0 45%,#2dd4bf 100%);-webkit-background-clip:text;background-clip:text;color:transparent!important;letter-spacing:-.02em;line-height:1.05;filter:drop-shadow(0 0 28px rgba(16,185,129,.35))}\n.slide h2{display:flex;align-items:center;gap:8px}\n.slide h2::before{content:\"\";width:22px;height:3px;border-radius:3px;background:linear-gradient(90deg,#10b981,#2dd4bf);box-shadow:0 0 10px rgba(16,185,129,.8)}\nblockquote{position:relative;box-shadow:0 0 50px -10px rgba(251,191,36,.3);background:linear-gradient(90deg,rgba(251,191,36,.16),rgba(251,191,36,.03))!important;border-radius:0 1.25rem 1.25rem 0!important}\nblockquote::before{content:\"\\201C\";position:absolute;top:-18px;left:12px;font-size:4rem;line-height:1;color:#fbbf24;opacity:.5;font-style:normal}\nbutton{transition:transform .15s,box-shadow .25s,background .2s}\nbutton:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 10px 22px -8px rgba(16,185,129,.6)}\nbutton:not(:disabled):active{transform:scale(.96)}\nbutton:disabled{cursor:not-allowed;opacity:.6}\n.rounded-xl.overflow-hidden{box-shadow:0 0 40px -12px rgba(52,211,153,.4)}\n.coin{position:relative;overflow:hidden;transition:transform .25s}\n.coin:hover{transform:rotateY(180deg) scale(1.1)}\n.coin::after{content:\"\";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3s infinite}\n@keyframes shine{60%,100%{transform:translateX(120%)}}\n#rem{text-shadow:0 0 30px rgba(16,185,129,.7);transition:transform .2s}\n#tray{background:radial-gradient(circle at 50% 100%,rgba(16,185,129,.1),transparent 70%)}\ninput[type=number]{border:1px solid rgba(52,211,153,.25);outline:none}\ninput[type=number]:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.25)}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}\n</style>\n</head>\n<body class=\"min-h-screen\">\n<div id=\"bar\"></div>\n<main class=\"max-w-7xl mx-auto px-4 md:px-8 py-6\">\n  <header class=\"mb-6\">\n    <div class=\"flex items-center justify-between gap-3 flex-wrap\">\n      <span class=\"text-xs tracking-widest text-emerald-400 font-semibold\">CS 05 · CHAPTER 06: GREEDY ALGORITHMS · SLIDE 01</span>\n      <div class=\"flex gap-2\">\n        <button id=\"prev\" class=\"px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-500 text-sm\" disabled>← Prev</button>\n        <button id=\"next\" class=\"px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-500 text-sm\" disabled>Next →</button>\n        <button id=\"btn-open-quiz\" class=\"px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-sm font-semibold flex items-center gap-1 shadow-md shadow-sky-600/25\">🎯 Quiz (4 Items)</button>\n        <button id=\"full\" class=\"px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold\">⛶ Present</button>\n      </div>\n    </div>\n  </header>\n  <section class=\"slide\" data-s=\"0\"><div class=\"min-h-[60vh] flex items-center\"><h1 class=\"text-4xl md:text-7xl font-extrabold text-white\">1. Introduction to Greedy Algorithms</h1></div></section>\n  <section class=\"slide hidden\" data-s=\"1\"><div class=\"min-h-[60vh] flex items-center\">\n    <blockquote class=\"border-l-4 border-amber-400 bg-amber-400/10 rounded-r-xl p-6 text-xl md:text-4xl leading-snug text-amber-100 italic\">\n      “Why should we commit permanently to a short-sighted narrowed choice right now instead of us calculating every possible future outcomes?”\n    </blockquote></div></section>\n\n  <section class=\"slide hidden\" data-s=\"2\"><div class=\"bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4\">\n      <div>\n        <h2 class=\"text-emerald-400 font-bold text-sm uppercase tracking-wide\">Context</h2>\n        <p class=\"mt-1 text-zinc-300\">Many computational problems require finding the best configuration out of an astronomical number of possibilities (e.g., maximizing profit, minimizing latency, or packing items).</p>\n      </div>\n      <div>\n        <h2 class=\"text-emerald-400 font-bold text-sm uppercase tracking-wide\">For Example</h2>\n        <p class=\"mt-1 text-zinc-300\">An exhaustive <b>brute-force search</b> explores all 2<sup>n</sup> subsets or n! permutations, which becomes computationally impossible as input size <i>n</i> scales higher and higher.</p>\n        <p class=\"mt-2 text-zinc-300\">A <b class=\"text-emerald-300\">Greedy Algorithm</b> takes the most advantageous choice available at the immediate moment (a <b>local optimum</b>) and never backtracks or reconsiders, hoping that this sequence of local decisions leads to a <b>global optimum</b>.</p>\n      </div>\n      <div class=\"rounded-xl bg-emerald-500/5 border border-emerald-500/20 p-3 text-sm text-zinc-300\">\n        <b class=\"text-emerald-300\">ⓘ Beginner words:</b>\n        <b>Brute force</b> = try every option. <b>2<sup>n</sup></b> = doubles with each extra item (30 items → over 1 billion tries). <b>Local optimum</b> = best choice <i>right now</i>. <b>Global optimum</b> = best answer overall. <b>Backtrack</b> = undo a choice and try another.\n      </div>\n</div></section>\n  <section class=\"slide hidden\" data-s=\"3\"><div class=\"bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4\">\n      <div>\n        <h2 class=\"text-emerald-400 font-bold text-sm uppercase tracking-wide mb-2\">Algorithmic Blueprint</h2>\n        <div class=\"rounded-xl overflow-hidden border border-zinc-700 bg-zinc-950\">\n          <div class=\"flex items-center gap-1.5 px-3 py-2 bg-zinc-800\">\n            <i class=\"w-3 h-3 rounded-full bg-red-400\"></i><i class=\"w-3 h-3 rounded-full bg-amber-400\"></i><i class=\"w-3 h-3 rounded-full bg-emerald-400\"></i>\n            <span class=\"ml-2 text-xs text-zinc-400\">greedy.py</span>\n          </div>\n<pre class=\"p-4 text-[13px] leading-6 overflow-x-auto\"><span class=\"k\">def</span> <span class=\"f\">generic_greedy_solver</span>(candidates):\n    solution = []\n    <span class=\"c\"># Sort or prioritize candidates based on a specific local heuristic</span>\n    ordered_candidates = <span class=\"f\">prioritize</span>(candidates)\n\n    <span class=\"k\">for</span> candidate <span class=\"k\">in</span> ordered_candidates:\n        <span class=\"k\">if</span> <span class=\"f\">is_compatible</span>(solution, candidate):\n            solution.<span class=\"f\">append</span>(candidate)  <span class=\"c\"># Permanent commitment: no undo / backtracking</span>\n\n    <span class=\"k\">return</span> solution</pre>\n        </div>\n      </div>\n    </div></section>\n\n  <section class=\"slide hidden\" data-s=\"4\"><div class=\"bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4\">\n      <div>\n        <h2 class=\"text-emerald-400 font-bold text-sm uppercase tracking-wide\">Interactive Sandbox · Coin Change</h2>\n        <p class=\"text-sm text-zinc-400\">Coins available: <b class=\"text-white\">₱20, ₱10, ₱5, ₱1</b>. Make the target using the fewest coins.</p>\n      </div>\n      <div class=\"flex flex-wrap gap-2 items-center\" id=\"presets\"></div>\n      <div class=\"flex items-center gap-3\">\n        <input id=\"slider\" type=\"range\" min=\"1\" max=\"99\" value=\"36\" class=\"flex-1 accent-emerald-500\">\n        <input id=\"num\" type=\"number\" min=\"1\" max=\"99\" value=\"36\" class=\"w-20 bg-zinc-800 rounded-lg px-2 py-1 text-center\">\n      </div>\n      <div class=\"flex flex-wrap gap-2\">\n        <button id=\"step\" class=\"px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm\">▶ Run Greedy Step-by-Step</button>\n        <button id=\"auto\" class=\"px-4 py-2 rounded-lg bg-teal-700 hover:bg-teal-600 text-white font-semibold text-sm\">⏵⏵ Auto-Play</button>\n        <button id=\"reset\" class=\"px-4 py-2 rounded-lg bg-zinc-700 hover:bg-zinc-600 text-white font-semibold text-sm\">↺ Reset</button>\n      </div>\n\n      <div class=\"rounded-xl bg-zinc-950 border border-zinc-800 p-4 text-center\">\n        <div class=\"text-xs uppercase tracking-widest text-zinc-500\">Current Balance / Remaining</div>\n        <div class=\"text-5xl font-black text-emerald-400 tabular-nums\" id=\"rem\">₱36</div>\n      </div>\n\n      <div>\n        <div class=\"text-xs uppercase tracking-widest text-zinc-500 mb-1\">⌘ Step-by-Step Log</div>\n        <ol id=\"log\" class=\"space-y-1 text-sm min-h-[96px]\"><li class=\"text-zinc-500\">Press “Run Greedy Step-by-Step” to begin.</li></ol>\n      </div>\n\n      <div>\n        <div class=\"text-xs uppercase tracking-widest text-zinc-500 mb-1\">Selected Solution Tray · <span id=\"cnt\">0</span> coins</div>\n        <div id=\"tray\" class=\"min-h-[84px] rounded-xl border-2 border-dashed border-emerald-500/30 p-3 flex flex-wrap gap-2 items-center\"></div>\n      </div>\n\n      <div class=\"rounded-xl border border-zinc-700 p-4 space-y-3\">\n        <h3 class=\"font-bold text-white\">Why Greedy Wins</h3>\n        <div class=\"grid sm:grid-cols-2 gap-3 text-sm\">\n          <div class=\"rounded-lg bg-emerald-500/10 border border-emerald-500/30 p-3\">\n            <div class=\"text-emerald-300 font-semibold\">✔ Greedy Choice</div>\n            <div id=\"gtxt\" class=\"mt-1\"></div>\n            <div class=\"text-xs text-emerald-400 mt-1\">Optimal minimum</div>\n          </div>\n          <div class=\"rounded-lg bg-amber-400/10 border border-amber-400/30 p-3\">\n            <div class=\"text-amber-300 font-semibold\">⚠ Non-Greedy Alternative</div>\n            <div id=\"atxt\" class=\"mt-1\"></div>\n            <div class=\"text-xs text-amber-300 mt-1\">Always same or worse</div>\n          </div>\n        </div>\n        <p class=\"text-sm text-zinc-300\">Replacing one 20-coin requires at least two 10-coins; replacing one 5-coin requires five 1-coins. Each greedy choice minimizes total coin count.</p>\n        <p class=\"text-xs text-zinc-500\">Note: this works because ₱20, ₱10, ₱5, ₱1 each divide neatly into the next bigger coin. With odd coins (like 1, 3, 4) greedy can fail, which later slides explore.</p>\n\n        <div class=\"mt-4 pt-3 border-t border-zinc-800 flex items-center justify-between flex-wrap gap-3 bg-zinc-950/60 p-4 rounded-xl border border-emerald-500/30\">\n          <div>\n            <div class=\"text-sm font-bold text-white flex items-center gap-2\">\n              <span class=\"text-base\">🎯</span>\n              <span>Topic 1 Knowledge Check: Interactive Quiz</span>\n              <span class=\"text-[10px] font-bold px-2 py-0.5 rounded bg-sky-500/20 text-sky-400 border border-sky-500/30\">4 Items</span>\n            </div>\n            <div class=\"text-xs text-zinc-400 mt-0.5\">2x 4-Pics identification challenges + 2x Matrix Red vs Blue Pill dilemmas.</div>\n          </div>\n          <button id=\"btn-launch-quiz-bottom\" class=\"px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 via-teal-500 to-sky-500 hover:from-emerald-400 hover:to-sky-400 text-zinc-950 font-black text-xs shadow-lg shadow-emerald-500/25 transition-all hover:scale-105 active:scale-95\">\n            Launch Topic 1 Quiz →\n          </button>\n        </div>\n      </div>\n    </div></section>\n</main>\n\n<script>\nconst COINS=[20,10,5,1];\nlet target=36,rem=36,picked=[],timer=null;\nconst $=id=>document.getElementById(id);\nfunction greedy(t,coins){const r=[];for(const c of coins){while(t>=c){r.push(c);t-=c}}return r}\nfunction render(){\n  $('rem').textContent='₱'+rem;\n  $('cnt').textContent=picked.length;\n  $('tray').innerHTML=picked.map(c=>'<div class=\"coin\">₱'+c+'</div>').join('')||'<span class=\"text-zinc-600 text-sm\">Empty: coins will drop here</span>';\n  let t=target;\n  $('log').innerHTML=picked.length?picked.map((c,i)=>{const b=t;t-=c;return '<li class=\"fade\">Step '+(i+1)+': Target ₱'+b+' → Largest coin ≤ '+b+' is <b class=\"text-emerald-300\">'+c+'</b>. Remaining: <b>'+t+'</b></li>'}).join(''):'<li class=\"text-zinc-500\">Press “Run Greedy Step-by-Step” to begin.</li>';\n  if(rem===0)$('log').innerHTML+='<li class=\"text-emerald-400 font-semibold fade\">✔ Done in '+picked.length+' coins.</li>';\n  const g=greedy(target,COINS);\n  $('gtxt').innerHTML='{'+g.join(', ')+'} = <b>'+g.length+' coins</b>';\n  let alt=greedy(target,[10,5,1]);\n  if(alt.length===g.length)alt=greedy(target,[5,1]);\n  if(alt.length===g.length)alt=greedy(target,[1]);\n  let extra=target===36?'<div class=\"text-xs text-zinc-400 mt-1\">Also: 20+5+5+5+1 = 5 coins… or 10+5×5+1 = 7 coins</div>':'';\n  $('atxt').innerHTML=alt.length===g.length?'None: ₱'+target+' needs just '+g.length+' coin(s) anyway.':'{'+alt.join(', ')+'} = <b>'+alt.length+' coins</b>'+extra;\n}\nfunction stepOnce(){\n  if(rem<=0){stop();return false}\n  const c=COINS.find(x=>x<=rem);picked.push(c);rem-=c;render();\n  if(rem<=0)stop();return true;\n}\nfunction stop(){clearInterval(timer);timer=null;$('auto').textContent='⏵⏵ Auto-Play'}\nfunction reset(){stop();rem=target;picked=[];render()}\nfunction setTarget(v){v=Math.max(1,Math.min(99,parseInt(v)||1));target=v;$('slider').value=v;$('num').value=v;reset();hl()}\nfunction hl(){document.querySelectorAll('#presets button').forEach(b=>{const on=+b.dataset.v===target;b.className='px-3 py-1.5 rounded-lg text-sm font-semibold '+(on?'bg-emerald-500 text-zinc-950':'bg-zinc-800 hover:bg-zinc-700')})}\n[36,28,43,67].forEach(v=>{const b=document.createElement('button');b.textContent=v;b.dataset.v=v;b.onclick=()=>setTarget(v);$('presets').appendChild(b)});\n$('slider').oninput=e=>setTarget(e.target.value);\n$('num').onchange=e=>setTarget(e.target.value);\n$('step').onclick=()=>{stop();if(rem<=0)reset();stepOnce()};\n$('auto').onclick=()=>{if(timer){stop();return}if(rem<=0)reset();$('auto').textContent='⏸ Pause';timer=setInterval(stepOnce,900)};\n$('reset').onclick=reset;\n$('full').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};\nlet cur=0;const N=5;\nfunction go(i){cur=Math.max(0,Math.min(N-1,i));document.querySelectorAll('.slide').forEach(s=>{const on=+s.dataset.s===cur;s.classList.toggle('hidden',!on);if(on)s.classList.add('fade')});\n  const p=$('prev'),n=$('next');p.disabled=cur===0;n.disabled=cur===N-1;\n  p.className='px-3 py-1.5 rounded-lg text-sm '+(p.disabled?'bg-zinc-800 text-zinc-500':'bg-zinc-700 hover:bg-zinc-600 text-white');\n  n.className='px-3 py-1.5 rounded-lg text-sm '+(n.disabled?'bg-zinc-800 text-zinc-500':'bg-zinc-700 hover:bg-zinc-600 text-white');\n  $('bar').style.width=((cur+1)/N*100)+'%';n.textContent='Next ('+(cur+1)+'/'+N+') →'}\n$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);\naddEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;\n  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&cur<4)){e.preventDefault();go(cur+1)}\n  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}\n  else if(e.key===' '&&cur===4){e.preventDefault();$('step').click()}\n  else if(e.key==='r'&&cur===4)reset()});\ngo(0);\nsetTarget(36);\n\nfunction openQuiz(){\n  if(window.parent && window.parent !== window){\n    window.parent.postMessage({type:'GOTO_TOPIC',file:'quiz-1.html'},'*');\n  } else {\n    window.location.href = 'quiz-1.html';\n  }\n}\nif($('btn-open-quiz')) $('btn-open-quiz').onclick = openQuiz;\nif($('btn-launch-quiz-bottom')) $('btn-launch-quiz-bottom').onclick = openQuiz;\n<\/script>\n</body>\n</html>\n"},{"id":2,"tag":"Topic 02","title":"Greedy-Choice Property & Optimal Substructure","shortTitle":"Greedy Choice & Substructure","subtitle":"The Two Mathematical Pillars of Greedy Algorithms","badge":"Foundations","file":"Greedy-choice property and optimal substructure.html","content":"\r\n<!DOCTYPE html>\r\n<html lang=\"en\">\r\n<head>\r\n<meta charset=\"UTF-8\">\r\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n<title>Greedy-Choice Property and Optimal Substructure</title>\r\n\r\n<style>\r\n:root {\r\n    --bg: #F8F5FF;\r\n    --white: #FFFFFF;\r\n    --purple: #7C3AED;\r\n    --dark-purple: #5B21B6;\r\n    --light-purple: #EDE9FE;\r\n    --text: #281747;\r\n    --muted: #716582;\r\n    --border: #E5DDFB;\r\n}\r\n\r\n* {\r\n    margin: 0;\r\n    padding: 0;\r\n    box-sizing: border-box;\r\n}\r\n\r\nbody {\r\n    font-family: Arial, Helvetica, sans-serif;\r\n    background: var(--bg);\r\n    color: var(--text);\r\n    min-height: 100vh;\r\n}\r\n\r\n.progress-track {\r\n    position: fixed;\r\n    top: 0;\r\n    left: 0;\r\n    width: 100%;\r\n    height: 6px;\r\n    background: var(--border);\r\n    z-index: 10;\r\n}\r\n\r\n.progress {\r\n    height: 100%;\r\n    width: 0;\r\n    background: var(--purple);\r\n    transition: width 0.3s ease;\r\n}\r\n\r\n.presentation {\r\n    min-height: 100vh;\r\n    padding: 55px 7% 115px;\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: center;\r\n}\r\n\r\n.slide {\r\n    display: none;\r\n    width: 100%;\r\n    max-width: 1100px;\r\n    animation: fadeIn 0.35s ease;\r\n}\r\n\r\n.slide.active {\r\n    display: block;\r\n}\r\n\r\n@keyframes fadeIn {\r\n    from {\r\n        opacity: 0;\r\n        transform: translateY(10px);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: translateY(0);\r\n    }\r\n}\r\n\r\n.eyebrow {\r\n    color: var(--purple);\r\n    font-size: 1rem;\r\n    font-weight: bold;\r\n    letter-spacing: 3px;\r\n    text-transform: uppercase;\r\n    margin-bottom: 20px;\r\n}\r\n\r\nh1 {\r\n    font-size: clamp(3rem, 7vw, 5.6rem);\r\n    line-height: 1.08;\r\n    letter-spacing: -2px;\r\n    margin-bottom: 25px;\r\n}\r\n\r\nh2 {\r\n    font-size: clamp(2.3rem, 5vw, 4rem);\r\n    line-height: 1.15;\r\n    margin-bottom: 25px;\r\n}\r\n\r\nh3 {\r\n    color: var(--dark-purple);\r\n    font-size: 1.5rem;\r\n    margin-bottom: 13px;\r\n}\r\n\r\np, li {\r\n    font-size: clamp(1.1rem, 2vw, 1.35rem);\r\n    line-height: 1.7;\r\n}\r\n\r\np {\r\n    margin-bottom: 17px;\r\n}\r\n\r\nul {\r\n    padding-left: 25px;\r\n}\r\n\r\nli {\r\n    margin-bottom: 8px;\r\n}\r\n\r\n.highlight {\r\n    color: var(--purple);\r\n}\r\n\r\n.subtitle {\r\n    color: var(--muted);\r\n    font-size: clamp(1.3rem, 2.5vw, 1.7rem);\r\n    max-width: 850px;\r\n}\r\n\r\n.question {\r\n    background: var(--light-purple);\r\n    border-left: 6px solid var(--purple);\r\n    border-radius: 0 18px 18px 0;\r\n    padding: 25px;\r\n    margin-top: 28px;\r\n    font-size: clamp(1.35rem, 2.7vw, 2rem);\r\n    line-height: 1.5;\r\n    font-weight: bold;\r\n}\r\n\r\n.grid {\r\n    display: grid;\r\n    grid-template-columns: repeat(2, minmax(0, 1fr));\r\n    gap: 22px;\r\n    margin-top: 25px;\r\n}\r\n\r\n.card {\r\n    background: var(--white);\r\n    border: 1px solid var(--border);\r\n    border-radius: 20px;\r\n    padding: 27px;\r\n    box-shadow: 0 8px 25px #4C1D950A;\r\n}\r\n\r\n.card p:last-child {\r\n    margin-bottom: 0;\r\n}\r\n\r\n.tag {\r\n    display: inline-block;\r\n    padding: 8px 13px;\r\n    background: var(--light-purple);\r\n    color: var(--dark-purple);\r\n    border-radius: 50px;\r\n    font-size: 0.95rem;\r\n    font-weight: bold;\r\n    margin-bottom: 15px;\r\n}\r\n\r\n.steps {\r\n    display: grid;\r\n    gap: 15px;\r\n    margin-top: 25px;\r\n}\r\n\r\n.step {\r\n    display: grid;\r\n    grid-template-columns: 55px 1fr;\r\n    align-items: center;\r\n    gap: 18px;\r\n    padding: 20px;\r\n    background: var(--white);\r\n    border: 1px solid var(--border);\r\n    border-radius: 17px;\r\n}\r\n\r\n.step-number {\r\n    width: 50px;\r\n    height: 50px;\r\n    display: grid;\r\n    place-items: center;\r\n    border-radius: 15px;\r\n    background: var(--light-purple);\r\n    color: var(--dark-purple);\r\n    font-size: 1.4rem;\r\n    font-weight: bold;\r\n}\r\n\r\n.step p {\r\n    margin: 0;\r\n}\r\n\r\n.diagram {\r\n    display: grid;\r\n    gap: 18px;\r\n    justify-items: center;\r\n    margin: 30px auto;\r\n}\r\n\r\n.diagram-box {\r\n    width: min(100%, 410px);\r\n    padding: 20px;\r\n    text-align: center;\r\n    border: 2px solid #C4B5FD;\r\n    border-radius: 16px;\r\n    background: var(--white);\r\n    font-size: 1.2rem;\r\n    font-weight: bold;\r\n}\r\n\r\n.diagram-box.main {\r\n    background: var(--light-purple);\r\n    border-color: var(--purple);\r\n    color: var(--dark-purple);\r\n}\r\n\r\n.arrow {\r\n    color: var(--purple);\r\n    font-size: 2rem;\r\n    font-weight: bold;\r\n}\r\n\r\n.branch-grid {\r\n    display: grid;\r\n    grid-template-columns: repeat(2, minmax(0, 1fr));\r\n    gap: 18px;\r\n    width: 100%;\r\n}\r\n\r\n.branch {\r\n    padding: 22px;\r\n    text-align: center;\r\n    background: var(--white);\r\n    border: 1px solid var(--border);\r\n    border-radius: 16px;\r\n}\r\n\r\n.branch strong {\r\n    color: var(--dark-purple);\r\n    font-size: 1.2rem;\r\n}\r\n\r\n.visual-list {\r\n    display: flex;\r\n    flex-wrap: wrap;\r\n    align-items: center;\r\n    gap: 12px;\r\n    margin: 22px 0;\r\n}\r\n\r\n.visual-item {\r\n    flex: 1 1 140px;\r\n    min-width: 0;\r\n    padding: 20px 12px;\r\n    background: var(--light-purple);\r\n    border: 1px solid #D8CCFC;\r\n    border-radius: 16px;\r\n    text-align: center;\r\n}\r\n\r\n.visual-item strong {\r\n    display: block;\r\n    font-size: 1.6rem;\r\n    color: var(--dark-purple);\r\n    margin-bottom: 7px;\r\n}\r\n\r\n.visual-item span {\r\n    font-size: 1rem;\r\n    color: var(--muted);\r\n}\r\n\r\n.code {\r\n    padding: 24px;\r\n    margin-top: 20px;\r\n    overflow-x: auto;\r\n    background: #24183B;\r\n    color: #F5F0FF;\r\n    border-radius: 17px;\r\n    font: 1rem/1.8 Consolas, Monaco, monospace;\r\n    white-space: pre;\r\n}\r\n\r\n.result {\r\n    padding: 25px;\r\n    margin-top: 23px;\r\n    background: var(--light-purple);\r\n    border-radius: 18px;\r\n}\r\n\r\n.result strong {\r\n    color: var(--dark-purple);\r\n    font-size: 1.5rem;\r\n}\r\n\r\n.result p:last-child {\r\n    margin-bottom: 0;\r\n}\r\n\r\n.proof-label {\r\n    display: inline-block;\r\n    background: #F3E8FF;\r\n    color: var(--dark-purple);\r\n    padding: 7px 12px;\r\n    border-radius: 8px;\r\n    font-weight: bold;\r\n    margin-bottom: 12px;\r\n}\r\n\r\n.note {\r\n    color: var(--muted);\r\n    font-size: 1rem;\r\n    margin-top: 14px;\r\n}\r\n\r\n.controls {\r\n    position: fixed;\r\n    bottom: 0;\r\n    left: 0;\r\n    width: 100%;\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: space-between;\r\n    gap: 12px;\r\n    padding: 15px 7%;\r\n    background: #FFFFFFF2;\r\n    border-top: 1px solid var(--border);\r\n    backdrop-filter: blur(12px);\r\n}\r\n\r\nbutton {\r\n    border: none;\r\n    border-radius: 12px;\r\n    padding: 13px 23px;\r\n    background: var(--purple);\r\n    color: white;\r\n    font-size: 1rem;\r\n    font-weight: bold;\r\n    cursor: pointer;\r\n    transition: 0.2s;\r\n}\r\n\r\nbutton:hover {\r\n    background: var(--dark-purple);\r\n    transform: translateY(-2px);\r\n}\r\n\r\nbutton:disabled {\r\n    opacity: 0.35;\r\n    cursor: not-allowed;\r\n    transform: none;\r\n}\r\n\r\n#slideCount {\r\n    color: var(--muted);\r\n    font-weight: bold;\r\n}\r\n\r\n@media (max-width: 700px) {\r\n    .presentation {\r\n        align-items: flex-start;\r\n        padding: 40px 6% 105px;\r\n    }\r\n\r\n    .grid, .branch-grid {\r\n        grid-template-columns: 1fr;\r\n    }\r\n\r\n    .card {\r\n        padding: 22px;\r\n    }\r\n\r\n    .step {\r\n        grid-template-columns: 43px 1fr;\r\n        gap: 12px;\r\n        padding: 15px;\r\n    }\r\n\r\n    .step-number {\r\n        width: 40px;\r\n        height: 40px;\r\n    }\r\n\r\n    .controls {\r\n        padding: 12px 5%;\r\n    }\r\n\r\n    button {\r\n        padding: 12px 15px;\r\n    }\r\n\r\n    .code {\r\n        font-size: 0.85rem;\r\n    }\r\n}\r\n</style>\r\n</head>\r\n\r\n<body>\r\n\r\n<div class=\"progress-track\">\r\n    <div class=\"progress\" id=\"progress\"></div>\r\n</div>\r\n\r\n<main class=\"presentation\">\r\n\r\n    <!-- SLIDE 1: INTRODUCTION -->\r\n    <section class=\"slide active\">\r\n        <div class=\"eyebrow\">01 / Introduction</div>\r\n\r\n        <h1>\r\n            Greedy-Choice Property\r\n            <span class=\"highlight\">and</span>\r\n            Optimal Substructure\r\n        </h1>\r\n\r\n        <p class=\"subtitle\">\r\n            Two important properties used to design and understand\r\n            efficient algorithms for optimization problems.\r\n        </p>\r\n\r\n        <div class=\"question\">\r\n            How can we make a good decision now and still guarantee\r\n            the best possible overall solution?\r\n        </div>\r\n    </section>\r\n\r\n    <!-- SLIDE 2: CONTEXT -->\r\n    <section class=\"slide\">\r\n        <div class=\"eyebrow\">02 / Context</div>\r\n\r\n        <h2>Why Do These Properties <span class=\"highlight\">Matter?</span></h2>\r\n\r\n        <p>\r\n            Optimization problems involve finding the best solution\r\n            while following certain rules or limitations.\r\n        </p>\r\n\r\n        <div class=\"grid\">\r\n            <div class=\"card\">\r\n                <span class=\"tag\">Property 1</span>\r\n                <h3>Greedy-Choice Property</h3>\r\n                <p>\r\n                    A globally optimal solution can be reached by making\r\n                    a locally optimal choice at each step.\r\n                </p>\r\n            </div>\r\n\r\n            <div class=\"card\">\r\n                <span class=\"tag\">Property 2</span>\r\n                <h3>Optimal Substructure</h3>\r\n                <p>\r\n                    An optimal solution can be constructed from optimal\r\n                    solutions to smaller subproblems.\r\n                </p>\r\n            </div>\r\n        </div>\r\n\r\n        <div class=\"question\">\r\n            The first property focuses on making a choice.\r\n            The second focuses on how smaller solutions form a larger one.\r\n        </div>\r\n    </section>\r\n\r\n    <!-- SLIDE 3: GREEDY-CHOICE EXAMPLE -->\r\n    <section class=\"slide\">\r\n        <div class=\"eyebrow\">03 / Example</div>\r\n\r\n        <h2>Greedy-Choice Property in <span class=\"highlight\">Action</span></h2>\r\n\r\n        <p>\r\n            Consider a fractional knapsack problem. A bag can carry\r\n            25 kg, and we want to maximize the value of the items inside it.\r\n        </p>\r\n\r\n        <div class=\"card\">\r\n            <h3>Available items</h3>\r\n\r\n            <div class=\"visual-list\">\r\n                <div class=\"visual-item\">\r\n                    <strong>Gold</strong>\r\n                    <span>10 kg · $60/kg</span>\r\n                </div>\r\n\r\n                <div class=\"visual-item\">\r\n                    <strong>Silver</strong>\r\n                    <span>20 kg · $50/kg</span>\r\n                </div>\r\n\r\n                <div class=\"visual-item\">\r\n                    <strong>Bronze</strong>\r\n                    <span>30 kg · $40/kg</span>\r\n                </div>\r\n            </div>\r\n\r\n            <p>\r\n                Greedy rule: Choose the available item with the highest\r\n                value per kilogram first.\r\n            </p>\r\n        </div>\r\n\r\n        <div class=\"result\">\r\n            <h3>Greedy selection</h3>\r\n            <p>Take 10 kg of gold and then 15 kg of silver.</p>\r\n            <strong>$600 + $750 = $1,350</strong>\r\n            <p>All 25 kg of capacity is used.</p>\r\n        </div>\r\n    </section>\r\n\r\n    <!-- SLIDE 4: GREEDY METHOD -->\r\n    <section class=\"slide\">\r\n        <div class=\"eyebrow\">04 / Method</div>\r\n\r\n        <h2>How the Greedy-Choice Property <span class=\"highlight\">Works</span></h2>\r\n\r\n        <div class=\"steps\">\r\n            <div class=\"step\">\r\n                <div class=\"step-number\">1</div>\r\n                <p>\r\n                    <strong>Define the goal.</strong><br>\r\n                    Maximize the total value of items in the bag.\r\n                </p>\r\n            </div>\r\n\r\n            <div class=\"step\">\r\n                <div class=\"step-number\">2</div>\r\n                <p>\r\n                    <strong>Choose a local rule.</strong><br>\r\n                    Prefer the item with the highest value per kilogram.\r\n                </p>\r\n            </div>\r\n\r\n            <div class=\"step\">\r\n                <div class=\"step-number\">3</div>\r\n                <p>\r\n                    <strong>Make the best immediate choice.</strong><br>\r\n                    Take the available gold first because it has the highest value density.\r\n                </p>\r\n            </div>\r\n\r\n            <div class=\"step\">\r\n                <div class=\"step-number\">4</div>\r\n                <p>\r\n                    <strong>Continue with the remaining capacity.</strong><br>\r\n                    Take silver until the bag reaches 25 kg.\r\n                </p>\r\n            </div>\r\n        </div>\r\n    </section>\r\n\r\n    <!-- SLIDE 5: GREEDY PROOF -->\r\n    <section class=\"slide\">\r\n        <div class=\"eyebrow\">05 / Evidence and Proof</div>\r\n\r\n        <h2>Why Does the Greedy Choice <span class=\"highlight\">Work?</span></h2>\r\n\r\n        <div class=\"card\">\r\n            <span class=\"proof-label\">Exchange Argument</span>\r\n\r\n            <p>\r\n                In the fractional knapsack problem, suppose a solution\r\n                takes some lower-value-density material while a higher-value-density\r\n                item is still available.\r\n            </p>\r\n\r\n            <p>\r\n                We can replace a small amount of the lower-density material\r\n                with the same weight of the higher-density material.\r\n                This increases the total value without exceeding the bag's capacity.\r\n            </p>\r\n\r\n            <p>\r\n                Therefore, choosing the highest value per kilogram first\r\n                is safe for this problem.\r\n            </p>\r\n        </div>\r\n\r\n        <div class=\"diagram\">\r\n            <div class=\"diagram-box\">\r\n                Highest value per kilogram\r\n            </div>\r\n\r\n            <div class=\"arrow\">↓</div>\r\n\r\n            <div class=\"diagram-box\">\r\n                Replace lower-value material when possible\r\n            </div>\r\n\r\n            <div class=\"arrow\">↓</div>\r\n\r\n            <div class=\"diagram-box main\">\r\n                No worse solution is needed\r\n            </div>\r\n        </div>\r\n\r\n        <p class=\"note\">\r\n            This proof applies to the fractional knapsack problem.\r\n            The same greedy rule does not always work for 0/1 knapsack.\r\n        </p>\r\n    </section>\r\n\r\n    <!-- SLIDE 6: OPTIMAL SUBSTRUCTURE EXAMPLE -->\r\n    <section class=\"slide\">\r\n        <div class=\"eyebrow\">06 / Example</div>\r\n\r\n        <h2>Optimal Substructure in <span class=\"highlight\">Action</span></h2>\r\n\r\n        <p>\r\n            Imagine finding the shortest route from Town A to Town C\r\n            through Town B.\r\n        </p>\r\n\r\n        <div class=\"diagram\">\r\n            <div class=\"diagram-box main\">Town A → Town C</div>\r\n\r\n            <div class=\"arrow\">↓</div>\r\n\r\n            <div class=\"branch-grid\">\r\n                <div class=\"branch\">\r\n                    <strong>Subproblem 1</strong>\r\n                    <p>Find the shortest route from A to B.</p>\r\n                </div>\r\n\r\n                <div class=\"branch\">\r\n                    <strong>Subproblem 2</strong>\r\n                    <p>Find the shortest route from B to C.</p>\r\n                </div>\r\n            </div>\r\n\r\n            <div class=\"arrow\">↓</div>\r\n\r\n            <div class=\"diagram-box\">\r\n                Combine both shortest routes\r\n            </div>\r\n        </div>\r\n\r\n        <div class=\"result\">\r\n            <h3>Main idea</h3>\r\n            <p>\r\n                If the route from A to C through B is optimal, its A-to-B\r\n                and B-to-C portions must also be shortest paths for their\r\n                respective endpoints.\r\n            </p>\r\n        </div>\r\n    </section>\r\n\r\n    <!-- SLIDE 7: OPTIMAL SUBSTRUCTURE METHOD -->\r\n    <section class=\"slide\">\r\n        <div class=\"eyebrow\">07 / Method</div>\r\n\r\n        <h2>How Optimal Substructure <span class=\"highlight\">Works</span></h2>\r\n\r\n        <div class=\"steps\">\r\n            <div class=\"step\">\r\n                <div class=\"step-number\">1</div>\r\n                <p>\r\n                    <strong>Identify the main problem.</strong><br>\r\n                    Find the shortest route from A to C.\r\n                </p>\r\n            </div>\r\n\r\n            <div class=\"step\">\r\n                <div class=\"step-number\">2</div>\r\n                <p>\r\n                    <strong>Break it into smaller problems.</strong><br>\r\n                    Find the shortest routes from A to B and from B to C.\r\n                </p>\r\n            </div>\r\n\r\n            <div class=\"step\">\r\n                <div class=\"step-number\">3</div>\r\n                <p>\r\n                    <strong>Solve the subproblems optimally.</strong><br>\r\n                    Find the best route for each smaller section.\r\n                </p>\r\n            </div>\r\n\r\n            <div class=\"step\">\r\n                <div class=\"step-number\">4</div>\r\n                <p>\r\n                    <strong>Combine the solutions.</strong><br>\r\n                    Join the shortest sections to form the full route.\r\n                </p>\r\n            </div>\r\n        </div>\r\n    </section>\r\n\r\n    <!-- SLIDE 8: OPTIMAL SUBSTRUCTURE PROOF -->\r\n    <section class=\"slide\">\r\n        <div class=\"eyebrow\">08 / Evidence and Proof</div>\r\n\r\n        <h2>Why Is It <span class=\"highlight\">Optimal Substructure?</span></h2>\r\n\r\n        <div class=\"card\">\r\n            <span class=\"proof-label\">Proof by Contradiction</span>\r\n\r\n            <p>\r\n                Assume the route from A to C is the shortest route through B,\r\n                but the section from A to B is not the shortest possible route.\r\n            </p>\r\n\r\n            <p>\r\n                Then a shorter route from A to B must exist. Replacing the\r\n                original section with that shorter route would make the\r\n                entire A-to-C route shorter.\r\n            </p>\r\n\r\n            <p>\r\n                This contradicts the assumption that the original route\r\n                was the shortest.\r\n            </p>\r\n\r\n            <p>\r\n                Therefore, an optimal solution must contain optimal\r\n                solutions to its subproblems.\r\n            </p>\r\n        </div>\r\n\r\n        <div class=\"question\">\r\n            If a smaller part of an optimal solution could be improved,\r\n            then the whole solution could be improved too.\r\n        </div>\r\n    </section>\r\n\r\n    <!-- SLIDE 9: COMPARISON -->\r\n    <section class=\"slide\">\r\n        <div class=\"eyebrow\">09 / Comparison</div>\r\n\r\n        <h2>Greedy Choice vs. <span class=\"highlight\">Optimal Substructure</span></h2>\r\n\r\n        <div class=\"grid\">\r\n            <div class=\"card\">\r\n                <span class=\"tag\">Choosing</span>\r\n                <h3>Greedy-Choice Property</h3>\r\n                <p>\r\n                    Focuses on making the best immediate choice that can\r\n                    safely lead to an optimal overall solution.\r\n                </p>\r\n                <p><strong>Question:</strong> Which choice should we make now?</p>\r\n            </div>\r\n\r\n            <div class=\"card\">\r\n                <span class=\"tag\">Building</span>\r\n                <h3>Optimal Substructure</h3>\r\n                <p>\r\n                    Focuses on constructing an optimal solution from\r\n                    optimal solutions to smaller subproblems.\r\n                </p>\r\n                <p><strong>Question:</strong> How do smaller optimal solutions form the whole?</p>\r\n            </div>\r\n        </div>\r\n\r\n        <div class=\"result\">\r\n            <h3>Remember</h3>\r\n            <p>\r\n                Greedy algorithms commonly rely on both properties.\r\n                Optimal substructure alone does not guarantee that a greedy\r\n                strategy will work; the greedy-choice property must also hold.\r\n            </p>\r\n        </div>\r\n    </section>\r\n\r\n    <!-- SLIDE 10: CONCLUSION -->\r\n    <section class=\"slide\">\r\n        <div class=\"eyebrow\">10 / Conclusion</div>\r\n\r\n        <h2>Key <span class=\"highlight\">Takeaways</span></h2>\r\n\r\n        <div class=\"steps\">\r\n            <div class=\"step\">\r\n                <div class=\"step-number\">1</div>\r\n                <p>\r\n                    <strong>Greedy-choice property</strong><br>\r\n                    A suitable local choice can be part of a globally optimal solution.\r\n                </p>\r\n            </div>\r\n\r\n            <div class=\"step\">\r\n                <div class=\"step-number\">2</div>\r\n                <p>\r\n                    <strong>Optimal substructure</strong><br>\r\n                    An optimal solution can be built from optimal subproblem solutions.\r\n                </p>\r\n            </div>\r\n\r\n            <div class=\"step\">\r\n                <div class=\"step-number\">3</div>\r\n                <p>\r\n                    <strong>Proof matters</strong><br>\r\n                    Examples help explain an algorithm, but a proof establishes why it works.\r\n                </p>\r\n            </div>\r\n        </div>\r\n\r\n        <div class=\"question\">\r\n            A good algorithm does not just find an answer.\r\n            It has a clear reason why that answer is correct.\r\n        </div>\r\n    </section>\r\n\r\n</main>\r\n\r\n<footer class=\"controls\">\r\n    <button id=\"prevBtn\" onclick=\"changeSlide(-1)\">← Previous</button>\r\n    <span id=\"slideCount\">1 / 10</span>\r\n    <button id=\"nextBtn\" onclick=\"changeSlide(1)\">Next →</button>\r\n</footer>\r\n\r\n<script>\r\nconst slides = document.querySelectorAll(\".slide\");\r\nconst progress = document.getElementById(\"progress\");\r\nconst slideCount = document.getElementById(\"slideCount\");\r\nconst prevBtn = document.getElementById(\"prevBtn\");\r\nconst nextBtn = document.getElementById(\"nextBtn\");\r\n\r\nlet currentSlide = 0;\r\n\r\nfunction showSlide(index) {\r\n    if (index < 0 || index >= slides.length) {\r\n        return;\r\n    }\r\n\r\n    slides[currentSlide].classList.remove(\"active\");\r\n    currentSlide = index;\r\n    slides[currentSlide].classList.add(\"active\");\r\n\r\n    slideCount.textContent =\r\n        (currentSlide + 1) + \" / \" + slides.length;\r\n\r\n    progress.style.width =\r\n        ((currentSlide + 1) / slides.length * 100) + \"%\";\r\n\r\n    prevBtn.disabled = currentSlide === 0;\r\n    nextBtn.disabled = currentSlide === slides.length - 1;\r\n\r\n    window.scrollTo({\r\n        top: 0,\r\n        behavior: \"smooth\"\r\n    });\r\n}\r\n\r\nfunction changeSlide(direction) {\r\n    showSlide(currentSlide + direction);\r\n}\r\n\r\ndocument.addEventListener(\"keydown\", function(event) {\r\n    if (event.key === \"ArrowRight\" || event.key === \"PageDown\") {\r\n        changeSlide(1);\r\n    }\r\n\r\n    if (event.key === \"ArrowLeft\" || event.key === \"PageUp\") {\r\n        changeSlide(-1);\r\n    }\r\n\r\n    if (event.key === \"Home\") {\r\n        showSlide(0);\r\n    }\r\n\r\n    if (event.key === \"End\") {\r\n        showSlide(slides.length - 1);\r\n    }\r\n});\r\n\r\nshowSlide(0);\r\n<\/script>\r\n\r\n</body>\r\n</html>\r\n"},{"id":3,"tag":"Topic 03","title":"Activity Selection / Unweighted Interval Scheduling","shortTitle":"Activity Selection","subtitle":"Problem Formulation, Compatibility & Maximizing Events","badge":"Core Problem","file":"Activity Selection _ Unweighted Interval Scheduling.html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Activity Selection / Unweighted Interval Scheduling</title>\n<style>\n:root{--bg:#0a1428;--panel:rgba(18,36,71,.78);--line:#2a4073;--text:#f4f7fb;--mut:#a9b8d4;--mint:#4fe3b5;--gray:#56657f;--bad:#f2a1a1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*,*::before,*::after{box-sizing:inherit}\nhtml,body{height:100%;margin:0}\nbody{background:var(--bg) radial-gradient(900px 500px at 85% -5%,#1b3a73 0,transparent 60%);color:var(--text);font:400 16px/1.6 system-ui,-apple-system,\"Segoe UI\",sans-serif;display:flex;flex-direction:column;overflow:hidden}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}\n#deck{flex:1;min-height:0;position:relative}\n.slide{position:absolute;inset:0;overflow-y:auto;padding:20px;opacity:0;visibility:hidden;transition:opacity .4s}\n.slide.on{opacity:1;visibility:visible}\n.box{max-width:960px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 32px}\nh1{font:700 clamp(2rem,5vw,3.2rem)/1.15 Georgia,serif;margin:0 0 14px}\nh2{font:700 clamp(1.5rem,3.4vw,2.2rem)/1.2 Georgia,serif;margin:0 0 6px}\nh3{font-size:1.05rem;margin:0 0 6px;color:var(--mint)}\n.rule{width:56px;height:4px;background:var(--mint);border-radius:4px;margin:8px 0 18px}\np{margin:0 0 12px}.mut{color:var(--mut)}\n.center{text-align:center}.center .rule{margin-inline:auto}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.card{background:rgba(7,16,34,.55);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.mint{color:var(--mint)}.bad{color:var(--bad)}\ncode,pre,.mono{font-family:ui-monospace,Menlo,Consolas,monospace}\npre{background:#071022;border:1px solid var(--line);border-radius:10px;padding:14px;margin:0;overflow-x:auto;font-size:.88rem;line-height:1.55}\n.k{color:var(--mint)}\nol{margin:0;padding-left:1.2em}li{margin-bottom:4px}\n.note{border-left:4px solid var(--mint);background:rgba(79,227,181,.09);padding:10px 14px;border-radius:0 10px 10px 0;margin:0 0 14px}\n.tw{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;min-width:480px;font-size:.9rem}\nth,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}th{color:var(--mut)}\ntr.s td:first-child{box-shadow:inset 4px 0 var(--mint)}tr.r td{color:var(--gray)}tr.r td:first-child{box-shadow:inset 4px 0 var(--gray)}tr.d td{opacity:.3}\n.tag{border-radius:6px;padding:0 8px;font-weight:600;font-size:.82rem}.tag.s{background:var(--mint);color:#04261d}.tag.r{background:#2a3855;color:var(--bad)}\n.tl{background:#071022;border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;margin-bottom:10px}\n.tlin{min-width:460px;position:relative}\n.row{display:grid;grid-template-columns:26px 1fr;height:30px;align-items:center}\n.track{position:relative;height:100%;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#1c2c52 calc(10% - 1px) 10%)}\n.bar{position:absolute;top:4px;height:22px;border-radius:5px;background:#2b3a5a;border:1px dashed #3f5078;color:#7d8cab;font-size:.75rem;display:flex;align-items:center;padding:0 7px;transition:background .3s}\n.bar.s{background:var(--mint);border:1px solid var(--mint);color:#04261d;font-weight:600}.bar.r{background:#3a4458;border:1px solid #3a4458;color:#8a96ad;text-decoration:line-through}\n.ticks{display:grid;grid-template-columns:26px repeat(10,1fr);font-size:.75rem;color:var(--mut)}\n.lf{position:absolute;top:0;bottom:18px;border-left:2px dashed #fff;opacity:.6;transition:left .3s}\nbutton{font:inherit;font-weight:600;border:0;border-radius:9px;padding:8px 16px;cursor:pointer;background:var(--mint);color:#04261d}\nbutton.g{background:transparent;color:var(--mint);border:1px solid var(--mint)}button:disabled{opacity:.4;cursor:default}\nbutton:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}\n.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}\ninput{font:inherit;background:#071022;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:90px}\nform{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{display:flex;flex-direction:column;font-size:.82rem;color:var(--mut)}\na{color:var(--mint)}\n#bar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:#0d1c3a;border-top:1px solid var(--line)}\n#ttl{color:var(--mut);font-size:.9rem;text-align:center;flex:1}\n@media(max-width:600px){.box{padding:18px}#ttl{display:none}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n</style>\n</head>\n<body>\n<div id=\"deck\">\n\n<div class=\"slide on\"><div class=\"box center\">\n<h1>Activity Selection / Unweighted Interval Scheduling</h1><div class=\"rule\"></div>\n<p class=\"mut\">Algorithm Complexity</p></div></div>\n\n<div class=\"slide\"><div class=\"box\">\n<h2>Context</h2><div class=\"rule\"></div>\n<p>Several activities want one shared room. Each has a <b>start</b> and a <b>finish</b> time, and two activities cannot overlap. Touching at one moment is fine: one ending at 6 and another starting at 6 are compatible.</p>\n<div class=\"note\"><b>Goal:</b> select the maximum number of mutually compatible activities.</div>\n<div class=\"grid\">\n<div class=\"card\"><h3>Unweighted</h3>Every activity has equal value, so we maximize the <b>count</b>, not total profit or weight.</div>\n<div class=\"card\"><h3>Greedy idea</h3>Take the best-looking choice now and never reconsider it.</div>\n<div class=\"card\"><h3>Which choice?</h3>The activity that <b>finishes earliest</b> frees the room soonest, leaving the most time for later activities.</div>\n</div></div></div>\n\n<div class=\"slide\"><div class=\"box\">\n<h2>Method: Earliest-Finish-Time-First</h2><div class=\"rule\"></div>\n<div class=\"grid\">\n<div><ol>\n<li>Sort all activities by increasing finish time.</li>\n<li>Select the activity that finishes earliest.</li>\n<li>Examine the remaining activities in sorted order.</li>\n<li>Select one only if its start ≥ the finish of the last selected activity.</li>\n<li>Continue until every activity has been examined.</li></ol></div>\n<pre><span class=\"k\">ActivitySelection</span>(activities):\n  sort activities by increasing finish time\n  selected = []\n  last_finish = -infinity\n\n  for activity in activities:\n    if activity.start &gt;= last_finish:\n      selected.append(activity)\n      last_finish = activity.finish\n\n  return selected</pre></div>\n<div class=\"card\" style=\"margin-top:14px\"><b>In plain terms:</b> <code>last_finish</code> is the moment the room becomes free. Each activity is tested once against it: starts in time, take it and update <code>last_finish</code>; otherwise skip it. The algorithm <b>never backtracks</b>, and the sorting happens once, before any selection.</div>\n</div></div>\n\n<div class=\"slide\"><div class=\"box\">\n<h2>Evidence / Proof of correctness</h2><div class=\"rule\"></div>\n<div class=\"note\"><b>Simple version:</b> if a best schedule starts with some other activity X, swap X for the earliest-finishing activity G. G ends no later, so nothing breaks and the schedule is just as big. Picking G first never hurts.</div>\n<p><b>Greedy-choice property:</b> a locally best first choice can always be extended to an optimal solution. Exchange argument:</p>\n<ol>\n<li>Take an optimal schedule whose first activity is X.</li>\n<li>Let G be the activity with the earliest finish time.</li>\n<li>If X ≠ G, replace X with G.</li>\n<li>Since f(G) ≤ f(X), every other activity (which starts at or after f(X)) is still compatible with G.</li>\n<li>The swap keeps the same number of activities, so the schedule is still optimal.</li>\n<li>Repeat on the remaining activities that start at or after f(G).</li></ol>\n<p class=\"mint\" style=\"margin-top:12px\"><b>Conclusion:</b> earliest-finish-time-first returns a maximum-size compatible schedule.</p>\n</div></div>\n\n<div class=\"slide\"><div class=\"box\">\n<h2>Summary and references</h2><div class=\"rule\"></div>\n<div class=\"grid\">\n<div class=\"card\"><h3>Problem</h3>Choose the most mutually compatible activities for one resource.</div>\n<div class=\"card\"><h3>Strategy</h3>Sort by finish time; take each activity that starts at or after the last finish.</div>\n<div class=\"card\"><h3>Correctness</h3>Exchange argument: the earliest finisher can replace any optimal first choice.</div></div>\n<h3 style=\"margin-top:16px\">References</h3>\n<ul style=\"margin:0;padding-left:1.2em\">\n<li><a href=\"https://i.cs.hku.hk/~hkual/Notes/Greedy/ActivitySelectionProblem.html\" target=\"_blank\" rel=\"noopener\">University of Hong Kong, Activity Selection Problem</a></li>\n<li><a href=\"https://www.math.ucla.edu/~allen/math182_lecture_notes.pdf\" target=\"_blank\" rel=\"noopener\">UCLA Math 182 Lecture Notes</a></li></ul>\n</div></div>\n\n</div>\n<div id=\"bar\"><button id=\"pv\">← Previous</button><div id=\"ttl\"></div><div class=\"mono mut\">Slide <b id=\"ct\" style=\"color:#fff\">1</b> / 5</div><button id=\"nx\">Next →</button></div>\n\n<script>\nvar names=[\"Title\",\"Context\",\"Method\",\"Evidence / Proof\",\"Summary\"],cur=0,S=document.querySelectorAll('.slide');\nfunction go(n){cur=Math.max(0,Math.min(S.length-1,n));S.forEach(function(s,i){s.classList.toggle('on',i===cur)});S[cur].scrollTop=0;\n document.getElementById('ct').textContent=cur+1;document.getElementById('ttl').textContent=names[cur];\n document.getElementById('pv').disabled=cur===0;document.getElementById('nx').disabled=cur===S.length-1}\ndocument.getElementById('pv').onclick=function(){go(cur-1)};document.getElementById('nx').onclick=function(){go(cur+1)};\ndocument.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});\ngo(0);\n\n<\/script>\n</body>\n</html>\n"},{"id":4,"tag":"Topic 04","title":"Earliest-Finish-Time Strategy","shortTitle":"EFT Strategy","subtitle":"Step-by-Step Simulation, Activity Timeline & Cutoff Rules","badge":"Strategy & Trace","file":"Earliest-Finish-Time-Strategy.html","content":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Topic 4 · Earliest-Finish-Time Strategy</title>\n<style>\n:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;color:#253047;background:#f5f7fb;font-synthesis:none;--ink:#253047;--muted:#707c91;--line:#e4e9f1;--purple:#7149e8;--purple-light:#f0ecff;--mint:#19a88b;--mint-light:#e8f8f5;--coral:#e67965;--shadow:0 12px 35px #2530470c;--meta:140px}\n*{box-sizing:border-box}\nbody{margin:0;background:radial-gradient(ellipse at top left,#f1eaff 0,transparent 35%),#f5f7fb;color:var(--ink);line-height:1.55}\n.lesson{width:min(1120px,calc(100% - 36px));margin:48px auto 72px}\n.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--purple)}\nh1{font-size:clamp(2rem,4vw,3.1rem);letter-spacing:-.045em;line-height:1.1;margin:.45rem 0 1rem}\n.lead{font-size:1.1rem;color:#59667c;max-width:740px;margin:0 0 28px}\n.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}\n.card h2{font-size:1.1rem;margin:0 0 14px;letter-spacing:-.02em}\n.card p{color:#5c687c;margin:.5rem 0}\n.context{grid-column:1/-1;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center}\n.context ul{margin:.65rem 0;padding-left:1.2rem;color:#5c687c}\n.context li+li{margin-top:8px}\n.rule{background:#f4f0ff;border:1px solid #e8dfff;padding:17px 18px;border-radius:16px;color:#443276;font-weight:650}\n.rule strong{color:var(--purple)}\n.rule code{font:inherit;font-style:italic;white-space:nowrap}\n.code-card{padding:0;overflow:hidden;background:#171b2d;border-color:#171b2d;color:#f4f4fa}\n.code-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #ffffff18;color:#c8c9d5;font-size:.82rem}\n.code-head button,.controls button,.add-button,.preset-btn{border:0;border-radius:11px;font:inherit;font-weight:750;cursor:pointer;transition:transform .16s,background .16s,color .16s}\n.code-head button{background:#ffffff18;color:#fff;padding:8px 12px}\n.code-head button:hover,.controls button:hover,.add-button:hover,.preset-btn:hover{transform:translateY(-1px)}\nbutton:focus-visible{outline:3px solid #7149e855;outline-offset:2px}\n.code-wrap{padding:15px 0;overflow:auto}\npre{margin:0;font:.82rem/1.85 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}\n.code-line{display:block;padding:0 18px 0 58px;position:relative;color:#d9dcef;transition:background .2s}\n.code-line::before{content:attr(data-line);position:absolute;left:20px;color:#747b96}\n.code-line.active{background:#704ce844;box-shadow:inset 3px 0 #a992ff;color:#fff;font-weight:600}\n.kw{color:#cf9dff}.fn{color:#8ed9ff}.str{color:#b4e3a3}.comment{color:#888fa8}\n.sim{grid-column:1/-1}\n.sim-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}\n.sim-top p{margin:0}\n.preset-bar{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}\n.preset-label{font-size:.78rem;font-weight:700;color:var(--muted);margin-right:4px}\n.preset-btn{background:#edf0f7;color:#4d5970;padding:6px 12px;font-size:.76rem;border-radius:8px}\n.preset-btn:hover{background:#e0e4f0}\n.preset-btn.on{background:var(--purple-light);color:#6540d6;box-shadow:inset 0 0 0 1.5px #cfc2fa}\n.add-button{background:var(--purple-light);color:#6540d6;padding:10px 14px;white-space:nowrap}\n.timeline-container{position:relative;margin-top:20px}\n.axis{display:flex;justify-content:space-between;color:#8a94a6;font-size:.72rem;margin-bottom:8px;padding:0 0 0 calc(var(--meta) + 12px);user-select:none}\n.cutoff-line{position:absolute;top:24px;bottom:0;width:2px;background:#7149e8;border-right:2px dashed #9a7aef;z-index:3;transition:left .3s cubic-bezier(.4,0,.2,1);pointer-events:none}\n.cutoff-badge{position:absolute;top:-20px;transform:translateX(-50%);background:var(--purple);color:#fff;font-size:.65rem;font-weight:800;padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 6px #7149e844}\n.ride-list{display:grid;gap:10px}\n.ride-row{display:grid;grid-template-columns:var(--meta) 1fr;gap:12px;align-items:center}\n.ride-meta{display:flex;align-items:center;justify-content:space-between}\n.ride-name{font-weight:750;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.delete-btn{background:transparent;border:0;color:#a0aab8;cursor:pointer;font-size:.9rem;padding:2px 6px;border-radius:4px;line-height:1}\n.delete-btn:hover{color:var(--coral);background:#fce8e4}\n.track{position:relative;height:36px;border-radius:10px;background:repeating-linear-gradient(90deg,#f2f4f8 0,#f2f4f8 calc(12.5% - 1px),#e5e9f0 calc(12.5% - 1px),#e5e9f0 12.5%);overflow:hidden}\n.bar{position:absolute;top:5px;height:26px;border-radius:8px;background:#c7cbd5;color:#50596b;font-size:.72rem;line-height:26px;text-align:center;font-weight:800;white-space:nowrap;overflow:hidden;transition:all .32s cubic-bezier(.4,0,.2,1)}\n.bar.accepted{background:#8de0c9;color:#116c58}\n.bar.current{background:#9a7aef;color:#fff;box-shadow:0 3px 12px #7149e866;animation:pulse 1.25s infinite;z-index:2}\n.bar.rejected{background:#e4e6eb;color:#9aa1b0;opacity:.65}\n.bar.pending{background:#dfe3eb;color:#727b8a}\n.legend{display:flex;gap:17px;margin-top:15px;color:#748095;font-size:.77rem;flex-wrap:wrap}\n.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#8de0c9}\n.dot.purple{background:#9a7aef}.dot.gray{background:#c7cbd5}\n.trace-info{margin-top:18px;border-radius:14px;padding:16px 18px;background:#f7f8fc;border:1px solid var(--line);min-height:78px}\n.trace-info strong{display:block;margin-bottom:4px;font-size:.95rem}\n.trace-info p{margin:0;color:#647086;font-size:.88rem}\n.trace-info .why{margin-top:6px;font-size:.8rem;color:#8b94a4}\n.controls{display:flex;gap:9px;margin-top:16px;align-items:center;flex-wrap:wrap}\n.controls button{background:var(--purple-light);color:#6040c7;padding:10px 16px}\n.controls button.primary{background:var(--purple);color:#fff}\n.controls button:disabled{opacity:.43;cursor:not-allowed;transform:none}\n.hint{color:#9aa3b2;font-size:.72rem;font-weight:600}\n.progress{color:#8b94a4;font-size:.82rem;margin-left:auto;align-self:center;font-weight:600}\n.ride-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}\n.ride-chip{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:#f4f5f8;color:#59657a;font-size:.76rem;font-weight:600}\n.badge{border-radius:999px;padding:2px 8px;background:#e9ebf0;color:#687285;font-size:.68rem;font-weight:800}\n.badge.accepted{background:#d9f5eb;color:#148367}\n.badge.rejected{background:#fce8e4;color:#ba5d4e}\n.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}\n.stat-card{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center}\n.stat-card .val{font-size:1.25rem;font-weight:800;color:var(--purple)}\n.stat-card .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}\n.result{margin-top:18px;padding:14px 16px;background:var(--mint-light);border:1px solid #d6f0e8;border-radius:14px;color:#24745f;font-weight:700;font-size:.9rem}\n.modal{position:fixed;inset:0;background:#19203380;display:grid;place-items:center;padding:18px;z-index:10}\n.modal[hidden]{display:none}\n.dialog{width:min(430px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 25px 90px #10172b40}\n.dialog-head{display:flex;justify-content:space-between;align-items:center}\n.dialog h2{margin:0}\n.close{border:0;background:#f1f2f6;border-radius:9px;padding:7px 10px;cursor:pointer;font-size:1rem}\n.form-grid{display:grid;gap:13px;margin-top:19px}\n.form-grid label{font-size:.82rem;font-weight:750;color:#4d5970}\n.form-grid input{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid #dce1ea;border-radius:10px;font:inherit;color:var(--ink)}\n.form-grid input:focus{outline:3px solid #7149e833;border-color:var(--purple)}\n.form-error{color:#b84a42;font-size:.82rem;min-height:1.2em}\n.form-submit{background:var(--purple);color:#fff;padding:11px 15px;border-radius:10px;border:0;font-weight:750;cursor:pointer}\n@keyframes pulse{50%{filter:brightness(1.08);transform:scaleY(1.06)}}\n@media(max-width:760px){\n:root{--meta:110px}\n.layout{grid-template-columns:1fr}\n.context{grid-column:auto;grid-template-columns:1fr}\n.sim{grid-column:auto}\n.card{padding:19px}.code-card{padding:0}\n.sim-top{align-items:center}\n.progress{width:100%;margin:4px 0 0}\n.hint{display:none}\n.stats-bar{grid-template-columns:1fr}\n}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}\n</style>\n</head>\n<body>\n<main id=\"topic-4\" class=\"lesson\">\n  <div class=\"eyebrow\">Algorithms · Activity selection</div>\n  <h1>Earliest-Finish-Time Strategy</h1>\n  <p class=\"lead\">Plan a park day with the Earliest-Finish-Time (EFT) rule: take the compatible ride that frees you up soonest, then keep going.</p>\n\n  <div class=\"layout\">\n    <section class=\"card context\" aria-labelledby=\"context-title\">\n      <div>\n        <h2 id=\"context-title\">🎟️ The park-day challenge</h2>\n        <p>Each ride has a start and finish time. A long coaster can crowd out several shorter attractions, so how can a simple rule help you fit in as many as possible?</p>\n        <ul>\n          <li><strong>Sort</strong> rides by their finish time ascending.</li>\n          <li><strong>Accept</stron
